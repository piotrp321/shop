# The production image of the admin panel (nginx-unprivileged: listens on 8080 as the user nginx).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Every location includes the security headers itself (see the file).

    # Written at container start from the environment by docker/40-admin-config.sh. Never cached: a changed
    # configuration must reach the browser on the next load.
    location = /config.js {
        alias /tmp/admin-config/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Vite names these files after their content, so they never change under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Single-page app: every other path (e.g. /auth/callback) is served by index.html, which is never cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
