# The security headers of the panel (spec: docs/features/hardening/spec.md, D10), included by every location of
# nginx.conf: an add_header in a location replaces the ones inherited from the server block, so they cannot live there.
# `always` adds them to error responses too. style-src is not restricted (PrimeVue and the Reka UI components set inline
# styles when they position popups and dialogs); HSTS is set by the ingress.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "script-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
