# Module boundaries, see docs/features/walking-skeleton/spec.md ("Reguły Deptrac").
# Layers are <Module>_<Layer>. Domain is pure PHP: it may only use Native and Shared_Domain, never Vendor.
deptrac:
  cache_file: var/.deptrac.cache
  paths:
    - src
  layers:
    - name: Catalog_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Catalog\\Domain\\#'
    - name: Catalog_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Catalog\\Application\\#'
    - name: Catalog_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Catalog\\Infrastructure\\#'
    - name: Catalog_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Catalog\\UI\\#'
    - name: Customer_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Customer\\Domain\\#'
    - name: Customer_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Customer\\Application\\#'
    - name: Customer_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Customer\\Infrastructure\\#'
    - name: Customer_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Customer\\UI\\#'
    - name: Backoffice_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Backoffice\\Domain\\#'
    - name: Backoffice_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Backoffice\\Application\\#'
    - name: Backoffice_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Backoffice\\Infrastructure\\#'
    - name: Backoffice_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Backoffice\\UI\\#'
    - name: Pricing_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Pricing\\Domain\\#'
    - name: Pricing_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Pricing\\Application\\#'
    - name: Pricing_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Pricing\\Infrastructure\\#'
    - name: Pricing_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Pricing\\UI\\#'
    - name: Inventory_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Inventory\\Domain\\#'
    - name: Inventory_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Inventory\\Application\\#'
    - name: Inventory_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Inventory\\Infrastructure\\#'
    - name: Inventory_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Inventory\\UI\\#'
    - name: Shared_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Shared\\Domain\\#'
    - name: Shared_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Shared\\Application\\#'
    - name: Shared_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Shared\\Infrastructure\\#'
    - name: Shared_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Shared\\UI\\#'
    # PHP built-ins (DateTimeImmutable, InvalidArgumentException, BackedEnum, ...) are plain PHP, allowed everywhere.
    - name: Native
      collectors:
        - type: php_internal
          value: '.*'
    # Everything outside App\ that is not a PHP built-in: Symfony, Doctrine, other libraries.
    - name: Vendor
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^(?!App\\)#'
          must_not:
            - type: php_internal
              value: '.*'
  ruleset:
    Catalog_Domain:
      - Native
      - Shared_Domain
    Catalog_Application:
      - Native
      - Catalog_Domain
      - Shared_Domain
      - Vendor
    Catalog_Infrastructure:
      - Native
      - Catalog_Application
      - Catalog_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      - Customer_Application
      - Backoffice_Application
    Catalog_UI:
      - Native
      - Catalog_Application
      - Catalog_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
    Customer_Domain:
      - Native
      - Shared_Domain
    Customer_Application:
      - Native
      - Customer_Domain
      - Shared_Domain
      - Vendor
    Customer_Infrastructure:
      - Native
      - Customer_Application
      - Customer_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      - Catalog_Application
      - Backoffice_Application
    Customer_UI:
      - Native
      - Customer_Application
      - Customer_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
    Backoffice_Domain:
      - Native
      - Shared_Domain
    Backoffice_Application:
      - Native
      - Backoffice_Domain
      - Shared_Domain
      - Vendor
    Backoffice_Infrastructure:
      - Native
      - Backoffice_Application
      - Backoffice_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      - Catalog_Application
      - Customer_Application
    Backoffice_UI:
      - Native
      - Backoffice_Application
      - Backoffice_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
    Pricing_Domain:
      - Native
      - Shared_Domain
    Pricing_Application:
      - Native
      - Pricing_Domain
      - Shared_Domain
      - Vendor
    Pricing_Infrastructure:
      - Native
      - Pricing_Application
      - Pricing_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # Adapters of Pricing's ports ask Catalog through its queries on query.bus. The only dependency between the
      # two modules, one way: Catalog depends on Pricing in no layer.
      - Catalog_Application
      # PriceVoter decides on the staff roles of AuthenticatedStaffMember: Pricing uses only the security contract
      # of Backoffice (its Application layer), never StaffUser of Backoffice_Infrastructure.
      - Backoffice_Application
    Pricing_UI:
      - Native
      - Pricing_Application
      - Pricing_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # The controller of a price change takes the actor from AuthenticatedStaffMember, the security contract of
      # Backoffice. Pricing_Domain and Pricing_Application stay free of Backoffice.
      - Backoffice_Application
    Inventory_Domain:
      - Native
      - Shared_Domain
    Inventory_Application:
      - Native
      - Inventory_Domain
      - Shared_Domain
      - Vendor
    Inventory_Infrastructure:
      - Native
      - Inventory_Application
      - Inventory_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # Adapters of Inventory's ports ask Catalog through its queries on query.bus (e.g. GetProductExists), like
      # Pricing. Catalog depends on Inventory in no layer, and Inventory_Domain and Inventory_Application never see
      # Catalog: the port speaks Inventory's own ProductId.
      - Catalog_Application
      # StockVoter decides on the staff roles of AuthenticatedStaffMember: Inventory uses only the security contract
      # of Backoffice (its Application layer), never StaffUser of Backoffice_Infrastructure.
      - Backoffice_Application
    Inventory_UI:
      - Native
      - Inventory_Application
      - Inventory_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # The controllers of receipts and corrections take the actor from AuthenticatedStaffMember, the security
      # contract of Backoffice. Inventory_Domain and Inventory_Application stay free of Backoffice.
      - Backoffice_Application
    Shared_Domain:
      - Native
    Shared_Application:
      - Native
      - Shared_Domain
      - Vendor
    Shared_Infrastructure:
      - Native
      - Shared_Domain
      - Shared_Application
      - Vendor
    Shared_UI:
      - Native
      - Shared_Domain
      - Shared_Application
      - Shared_Infrastructure
      - Vendor
