# Module boundaries, see docs/features/walking-skeleton/spec.md ("Reguły Deptrac").
# Layers are <Module>_<Layer>. Domain is pure PHP: it may only use Native and Shared_Domain, never Vendor.
deptrac:
  cache_file: var/.deptrac.cache
  paths:
    - src
  layers:
    - name: Catalog_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Catalog\\Domain\\#'
    - name: Catalog_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Catalog\\Application\\#'
    - name: Catalog_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Catalog\\Infrastructure\\#'
    - name: Catalog_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Catalog\\UI\\#'
    - name: Customer_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Customer\\Domain\\#'
    - name: Customer_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Customer\\Application\\#'
    - name: Customer_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Customer\\Infrastructure\\#'
    - name: Customer_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Customer\\UI\\#'
    - name: Backoffice_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Backoffice\\Domain\\#'
    - name: Backoffice_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Backoffice\\Application\\#'
    - name: Backoffice_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Backoffice\\Infrastructure\\#'
    - name: Backoffice_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Backoffice\\UI\\#'
    - name: Pricing_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Pricing\\Domain\\#'
    - name: Pricing_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Pricing\\Application\\#'
    - name: Pricing_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Pricing\\Infrastructure\\#'
    - name: Pricing_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Pricing\\UI\\#'
    - name: Inventory_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Inventory\\Domain\\#'
    - name: Inventory_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Inventory\\Application\\#'
    - name: Inventory_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Inventory\\Infrastructure\\#'
    - name: Inventory_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Inventory\\UI\\#'
    - name: Cart_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Cart\\Domain\\#'
    - name: Cart_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Cart\\Application\\#'
    - name: Cart_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Cart\\Infrastructure\\#'
    - name: Cart_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Cart\\UI\\#'
    - name: Ordering_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Ordering\\Domain\\#'
    - name: Ordering_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Ordering\\Application\\#'
    - name: Ordering_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Ordering\\Infrastructure\\#'
    - name: Ordering_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Ordering\\UI\\#'
    - name: Payment_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Payment\\Domain\\#'
    - name: Payment_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Payment\\Application\\#'
    - name: Payment_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Payment\\Infrastructure\\#'
    - name: Payment_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Payment\\UI\\#'
    # A fake external system, not a domain of the shop (flat module, one layer): see the ruleset.
    - name: PaymentSimulator
      collectors:
        - type: classNameRegex
          value: '#^App\\PaymentSimulator\\#'
    - name: Shared_Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Shared\\Domain\\#'
    - name: Shared_Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Shared\\Application\\#'
    - name: Shared_Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Shared\\Infrastructure\\#'
    - name: Shared_UI
      collectors:
        - type: classNameRegex
          value: '#^App\\Shared\\UI\\#'
    # PHP built-ins (DateTimeImmutable, InvalidArgumentException, BackedEnum, ...) are plain PHP, allowed everywhere.
    - name: Native
      collectors:
        - type: php_internal
          value: '.*'
    # Everything outside App\ that is not a PHP built-in: Symfony, Doctrine, other libraries.
    - name: Vendor
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^(?!App\\)#'
          must_not:
            - type: php_internal
              value: '.*'
  ruleset:
    Catalog_Domain:
      - Native
      - Shared_Domain
    Catalog_Application:
      - Native
      - Catalog_Domain
      - Shared_Domain
      - Vendor
    Catalog_Infrastructure:
      - Native
      - Catalog_Application
      - Catalog_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      - Customer_Application
      - Backoffice_Application
    Catalog_UI:
      - Native
      - Catalog_Application
      - Catalog_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
    Customer_Domain:
      - Native
      - Shared_Domain
    Customer_Application:
      - Native
      - Customer_Domain
      - Shared_Domain
      - Vendor
    Customer_Infrastructure:
      - Native
      - Customer_Application
      - Customer_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      - Catalog_Application
      - Backoffice_Application
    Customer_UI:
      - Native
      - Customer_Application
      - Customer_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
    Backoffice_Domain:
      - Native
      - Shared_Domain
    Backoffice_Application:
      - Native
      - Backoffice_Domain
      - Shared_Domain
      - Vendor
    Backoffice_Infrastructure:
      - Native
      - Backoffice_Application
      - Backoffice_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      - Catalog_Application
      - Customer_Application
    Backoffice_UI:
      - Native
      - Backoffice_Application
      - Backoffice_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
    Pricing_Domain:
      - Native
      - Shared_Domain
    Pricing_Application:
      - Native
      - Pricing_Domain
      - Shared_Domain
      - Vendor
    Pricing_Infrastructure:
      - Native
      - Pricing_Application
      - Pricing_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # Adapters of Pricing's ports ask Catalog through its queries on query.bus. The only dependency between the
      # two modules, one way: Catalog depends on Pricing in no layer.
      - Catalog_Application
      # PriceVoter decides on the staff roles of AuthenticatedStaffMember: Pricing uses only the security contract
      # of Backoffice (its Application layer), never StaffUser of Backoffice_Infrastructure.
      - Backoffice_Application
    Pricing_UI:
      - Native
      - Pricing_Application
      - Pricing_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # The controller of a price change takes the actor from AuthenticatedStaffMember, the security contract of
      # Backoffice. Pricing_Domain and Pricing_Application stay free of Backoffice.
      - Backoffice_Application
    Inventory_Domain:
      - Native
      - Shared_Domain
    Inventory_Application:
      - Native
      - Inventory_Domain
      - Shared_Domain
      - Vendor
    Inventory_Infrastructure:
      - Native
      - Inventory_Application
      - Inventory_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # Adapters of Inventory's ports ask Catalog through its queries on query.bus (e.g. GetProductExists), like
      # Pricing. Catalog depends on Inventory in no layer, and Inventory_Domain and Inventory_Application never see
      # Catalog: the port speaks Inventory's own ProductId.
      - Catalog_Application
      # StockVoter decides on the staff roles of AuthenticatedStaffMember: Inventory uses only the security contract
      # of Backoffice (its Application layer), never StaffUser of Backoffice_Infrastructure.
      - Backoffice_Application
    Inventory_UI:
      - Native
      - Inventory_Application
      - Inventory_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # The controllers of receipts and corrections take the actor from AuthenticatedStaffMember, the security
      # contract of Backoffice. Inventory_Domain and Inventory_Application stay free of Backoffice.
      - Backoffice_Application
    # Only Ordering depends on Cart, one way (Ordering_Infrastructure → Cart_Application: the commands LockCartForOrder
    # and ClearCartAfterOrder); Cart depends on Ordering in no layer. Cart_Domain and Cart_Application never see
    # another module: the ports speak Cart's own ProductId, Money and product data.
    Cart_Domain:
      - Native
      - Shared_Domain
    Cart_Application:
      - Native
      - Cart_Domain
      - Shared_Domain
      - Vendor
    Cart_Infrastructure:
      - Native
      - Cart_Application
      - Cart_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # Adapters of Cart's ports (ProductCatalog, CartPrices, StockAvailability) ask the other modules through their
      # queries on query.bus: Catalog GetProductSummaries, Pricing GetCurrentPrices, Inventory GetStockLevels. Only
      # their Application layer, never their Domain or Infrastructure.
      - Catalog_Application
      - Pricing_Application
      - Inventory_Application
    Cart_UI:
      - Native
      - Cart_Application
      - Cart_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # The controllers of the customer cart take the owner from AuthenticatedCustomer (the `sub` of the token), the
      # security contract of Customer, never CustomerUser of Customer_Infrastructure.
      - Customer_Application
    # Only Payment depends on Ordering (see Payment_Infrastructure); Ordering depends on Payment in no layer.
    # Ordering_Domain and Ordering_Application never see another module: the ports speak Ordering's own VariantId,
    # PriceCopy and order data.
    Ordering_Domain:
      - Native
      - Shared_Domain
    Ordering_Application:
      - Native
      - Ordering_Domain
      - Shared_Domain
      - Vendor
    Ordering_Infrastructure:
      - Native
      - Ordering_Application
      - Ordering_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # Adapters of Ordering's ports (OrderCart, OrderPrices, OrderCatalog, StockReservations) dispatch the commands
      # and queries of the other modules on command.bus and query.bus, nested in the transaction of PlaceOrder: Cart
      # LockCartForOrder and ClearCartAfterOrder, Pricing GetCurrentPrices, Catalog GetVariantSummaries, Inventory
      # ReserveStock. Only their Application layer, never their Domain or Infrastructure.
      - Cart_Application
      - Catalog_Application
      - Pricing_Application
      - Inventory_Application
      # OrderVoter decides on the staff roles of AuthenticatedStaffMember: Ordering uses only the security contract
      # of Backoffice (its Application layer), never StaffUser of Backoffice_Infrastructure.
      - Backoffice_Application
    Ordering_UI:
      - Native
      - Ordering_Application
      - Ordering_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # The controller of a customer's order takes the customer from AuthenticatedCustomer, the security contract of
      # Customer, never CustomerUser of Customer_Infrastructure.
      - Customer_Application
      # The controllers of the panel take the staff member of a status change and of a refund completion from
      # AuthenticatedStaffMember, the security contract of Backoffice. Ordering_Domain and Ordering_Application stay
      # free of Backoffice.
      - Backoffice_Application
    # Only Payment depends on Ordering, one way (Payment_Infrastructure → Ordering_Application: the query
    # GetOrderForPayment and the command MarkOrderPaid); Ordering depends on Payment in no layer, and no other
    # module depends on Payment. Payment_Domain and Payment_Application never see another module: the ports speak
    # Payment's own OrderId, Amount and order data.
    Payment_Domain:
      - Native
      - Shared_Domain
    Payment_Application:
      - Native
      - Payment_Domain
      - Shared_Domain
      - Vendor
    Payment_Infrastructure:
      - Native
      - Payment_Application
      - Payment_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # PayableOrders asks Ordering through GetOrderForPayment on query.bus, OrderPayments pays orders through
      # MarkOrderPaid on command.bus. Only its Application layer, never its Domain or Infrastructure.
      - Ordering_Application
    Payment_UI:
      - Native
      - Payment_Application
      - Payment_Domain
      - Shared_Domain
      - Shared_Infrastructure
      - Vendor
      # The controllers of a customer's payment take the customer from AuthenticatedCustomer, the security contract
      # of Customer, never CustomerUser of Customer_Infrastructure.
      - Customer_Application
    # The simulator of the payment providers talks to the shop over HTTP only, like a real provider: it depends on no
    # context and no context depends on it (nor does Payment, which calls it through its HTTP adapters).
    PaymentSimulator:
      - Native
      - Vendor
      - Shared_Infrastructure
    Shared_Domain:
      - Native
    Shared_Application:
      - Native
      - Shared_Domain
      - Vendor
    Shared_Infrastructure:
      - Native
      - Shared_Domain
      - Shared_Application
      - Vendor
    Shared_UI:
      - Native
      - Shared_Domain
      - Shared_Application
      - Shared_Infrastructure
      - Vendor
