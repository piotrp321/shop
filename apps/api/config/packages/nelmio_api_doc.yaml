# Two OpenAPI documents, exported by `make -C apps/api openapi`. No Swagger UI or JSON routes are exposed.
nelmio_api_doc:
    areas:
        default:
            path_patterns:
                - ^/api/v1(/|$)(?!admin(/|$))
            documentation:
                openapi: 3.0.3
                info:
                    title: Shop API
                    description: Public and customer endpoints used by the store.
                    version: 1.0.0
                components:
                    schemas:
                        # Response schemas of the product list. They are written here, not as attributes, so the
                        # Application layer stays free of OpenAPI; ProductsEndpointTest checks them against real responses.
                        ProductPage:
                            type: object
                            required: [items, page, perPage, total]
                            properties:
                                items:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/ProductListItem'
                                page:
                                    type: integer
                                    description: The requested page, from 1.
                                    example: 1
                                perPage:
                                    type: integer
                                    description: The requested page size.
                                    example: 24
                                total:
                                    type: integer
                                    description: All products matching the filter, not only this page.
                                    example: 412
                        ProductListItem:
                            type: object
                            required: [id, name, slug, shortDescription, image]
                            properties:
                                id:
                                    type: string
                                    format: uuid
                                name:
                                    type: string
                                    example: Buty do biegania Puls 2 granatowe
                                slug:
                                    type: string
                                    example: buty-do-biegania-puls-2-granatowe
                                shortDescription:
                                    type: string
                                image:
                                    nullable: true
                                    description: The main image, null when the product has no images.
                                    allOf:
                                        - $ref: '#/components/schemas/ProductImage'
                        ProductImage:
                            type: object
                            description: A product image of one predefined size, with signed URLs of its variants grouped by output format.
                            required: [alt, size, aspectRatio, variants]
                            properties:
                                alt:
                                    type: string
                                    description: Alternative text of the image.
                                    example: Biegaczka na leśnej ścieżce
                                size:
                                    type: string
                                    description: Name of the image size.
                                    example: listing
                                aspectRatio:
                                    type: string
                                    description: Aspect ratio of every variant, width:height.
                                    example: '1:1'
                                variants:
                                    type: object
                                    description: Variants by output format (the key is the file extension, e.g. webp), widths ascending.
                                    additionalProperties:
                                        type: array
                                        items:
                                            type: object
                                            required: [width, url]
                                            properties:
                                                width:
                                                    type: integer
                                                    example: 256
                                                url:
                                                    type: string
                                                    example: http://localhost:8081/signature/rs:fill:256:256/g:sm/czM6Ly9idWNrZXQva2V5/plain.webp
                        # Response schemas of the cart (Cart\Application\View), checked against real responses by the
                        # functional tests of the cart endpoints.
                        CartView:
                            type: object
                            description: A cart with everything the store shows, computed by the API. The number of available units is never part of it.
                            required: [id, lines, totals, hasExcludedLines]
                            properties:
                                id:
                                    type: string
                                    format: uuid
                                    nullable: true
                                    description: Id of the cart; null for a customer who has no cart yet.
                                lines:
                                    type: array
                                    description: The lines in the order they were added.
                                    items:
                                        $ref: '#/components/schemas/CartLine'
                                totals:
                                    $ref: '#/components/schemas/CartTotals'
                                hasExcludedLines:
                                    type: boolean
                                    description: Whether a line is not purchasable and so not part of `totals.gross`.
                        CartLine:
                            type: object
                            required: [variantId, product, quantity, unitPrice, lineTotal, state]
                            properties:
                                variantId:
                                    type: string
                                    format: uuid
                                    description: The variant of a product the line holds; the lines are unique by variant.
                                product:
                                    nullable: true
                                    description: Null when Catalog no longer knows the variant (`unavailable_product`).
                                    allOf:
                                        - $ref: '#/components/schemas/CartLineProduct'
                                quantity:
                                    type: integer
                                    minimum: 1
                                    maximum: 99
                                unitPrice:
                                    nullable: true
                                    description: The current gross price; null without a current price.
                                    allOf:
                                        - $ref: '#/components/schemas/GrossAmount'
                                lineTotal:
                                    nullable: true
                                    description: Unit price × quantity, only for a `purchasable` line.
                                    allOf:
                                        - $ref: '#/components/schemas/GrossAmount'
                                state:
                                    type: string
                                    description: 'The first that applies: the variant is unknown to Catalog, has no current price, has no available unit, has fewer available units than the quantity; otherwise purchasable.'
                                    enum: [unavailable_product, no_price, out_of_stock, insufficient_stock, purchasable]
                        CartLineProduct:
                            type: object
                            description: The product of the variant of the line.
                            required: [productId, name, variantLabel, image]
                            properties:
                                productId:
                                    type: string
                                    format: uuid
                                name:
                                    type: string
                                    description: Name of the product.
                                    example: Buty szosowe Tarvik Asfalt 200
                                variantLabel:
                                    type: string
                                    description: The values of the variant joined with ", "; empty for the default variant of a product without variant axes.
                                    example: czarne, 42
                                image:
                                    nullable: true
                                    description: The main image in the listing size, null when the product has no images.
                                    allOf:
                                        - $ref: '#/components/schemas/ProductImage'
                        GrossAmount:
                            type: object
                            required: [gross, currency]
                            properties:
                                gross:
                                    type: integer
                                    description: Gross amount (VAT included) in grosze.
                                    example: 19999
                                currency:
                                    type: string
                                    enum: [PLN]
                        CartTotals:
                            type: object
                            required: [gross, currency, itemCount]
                            properties:
                                gross:
                                    type: integer
                                    description: Sum of the purchasable lines in grosze, 0 for an empty cart.
                                    example: 39998
                                currency:
                                    type: string
                                    enum: [PLN]
                                itemCount:
                                    type: integer
                                    description: Units of every line, purchasable or not (the counter in the header).
                                    example: 2
                        MergeResult:
                            type: object
                            description: The cart of the customer after a merge of a guest cart.
                            required: [cart, result, truncated]
                            properties:
                                cart:
                                    $ref: '#/components/schemas/CartView'
                                result:
                                    type: string
                                    description: '`merged`: the guest lines moved; `already_merged`: the guest cart was merged before; `nothing_to_merge`: the guest cart is unknown, expired or a customer cart. Only `merged` changes anything.'
                                    enum: [merged, already_merged, nothing_to_merge]
                                truncated:
                                    type: boolean
                                    description: Whether a sum was cut to 99 units or a variant of the guest skipped because the cart had 50 variants; always false unless `merged`.
                        CartSummary:
                            type: object
                            required: [itemCount]
                            properties:
                                itemCount:
                                    type: integer
                                    description: Units of every line of the cart.
                                    example: 2
                        Problem: &problem
                            type: object
                            description: Problem details (RFC 9457), `application/problem+json`.
                            required: [type, title, status]
                            properties:
                                type:
                                    type: string
                                    example: about:blank
                                title:
                                    type: string
                                    example: Bad Request
                                status:
                                    type: integer
                                    example: 400
                                detail:
                                    type: string
                                    description: Present only for 4xx errors, never for 5xx.
                                violations:
                                    type: array
                                    description: Present only for 400 (invalid query parameters) or 422 (invalid request body) caused by invalid input.
                                    items:
                                        type: object
                                        required: [propertyPath, title]
                                        properties:
                                            propertyPath:
                                                type: string
                                                example: category
                                            title:
                                                type: string
                                                example: This is not a valid UUID.
                    securitySchemes:
                        shop:
                            type: http
                            scheme: bearer
                            bearerFormat: JWT
                            description: Access token issued by the `shop` realm (customers).
        admin:
            path_patterns:
                - ^/api/v1/admin(/|$)
            documentation:
                openapi: 3.0.3
                info:
                    title: Shop Admin API
                    description: Endpoints used by the admin panel.
                    version: 1.0.0
                components:
                    schemas:
                        # The same document as in the default area.
                        Problem: *problem
                    securitySchemes:
                        backoffice:
                            type: http
                            scheme: bearer
                            bearerFormat: JWT
                            description: Access token issued by the `backoffice` realm (staff).
