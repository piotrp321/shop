# Two OpenAPI documents, exported by `make -C apps/api openapi`. No Swagger UI or JSON routes are exposed.
nelmio_api_doc:
    areas:
        default:
            path_patterns:
                - ^/api/v1(/|$)(?!admin(/|$))
            documentation:
                openapi: 3.0.3
                info:
                    title: Shop API
                    description: Public and customer endpoints used by the store.
                    version: 1.0.0
                components:
                    schemas:
                        # Response schemas of the product list. They are written here, not as attributes, so the
                        # Application layer stays free of OpenAPI; ProductsEndpointTest checks them against real responses.
                        ProductPage:
                            type: object
                            required: [items, page, perPage, total, facets]
                            properties:
                                items:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/ProductListItem'
                                page:
                                    type: integer
                                    description: The requested page, from 1.
                                    example: 1
                                perPage:
                                    type: integer
                                    description: The requested page size.
                                    example: 24
                                total:
                                    type: integer
                                    description: All products matching the filter, not only this page.
                                    example: 412
                                facets:
                                    $ref: '#/components/schemas/ProductFacets'
                        ProductFacets:
                            type: object
                            description: >-
                                Counts for the filters of the list. Each one is computed with every condition of the search
                                except its own. The count of an axis value is the number of products that have a variant with
                                that value meeting the other variant conditions (other axes, price, availability). For an axis
                                without a selection it is the `total` the search would return after adding that value; for an
                                axis with a selection it is the result of selecting only that value of the axis.
                            required: [categories, options, price, availableCount]
                            properties:
                                categories:
                                    type: array
                                    description: >-
                                        The subcategories of the `category` filter (the top-level categories without it) that have
                                        products, in the order of the category tree.
                                    items:
                                        $ref: '#/components/schemas/CategoryFacet'
                                options:
                                    type: array
                                    description: >-
                                        The variant axes of the products found, most products first (at most 10; the selected
                                        axes are always listed, beyond that limit). A selected value stays in its list with a count
                                        of 0 when nothing matches.
                                    items:
                                        $ref: '#/components/schemas/OptionFacet'
                                price:
                                    nullable: true
                                    description: >-
                                        The lowest and the highest gross price of the variants that can be bought now and have the
                                        selected `option` values, ignoring `priceMin` and `priceMax`; null without such a variant.
                                    allOf:
                                        - $ref: '#/components/schemas/PriceRange'
                                availableCount:
                                    type: integer
                                    description: The `total` the search would return with `available=true` added.
                                    example: 18
                        CategoryFacet:
                            type: object
                            required: [id, name, slug, path, count]
                            properties:
                                id:
                                    type: string
                                    format: uuid
                                name:
                                    type: string
                                    example: Buty
                                slug:
                                    type: string
                                    example: buty
                                path:
                                    type: string
                                    description: The slugs from the top-level category joined with `/`.
                                    example: bieganie/buty
                                count:
                                    type: integer
                                    description: The products of the category (and its subcategories) found, with the variant conditions of the search.
                                    example: 7
                        OptionFacet:
                            type: object
                            required: [axis, values]
                            properties:
                                axis:
                                    type: string
                                    example: Kolor
                                values:
                                    type: array
                                    description: >-
                                        Most products first, then by value (at most 30; the selected values are always listed,
                                        beyond that limit).
                                    items:
                                        $ref: '#/components/schemas/OptionValue'
                        OptionValue:
                            type: object
                            required: [value, count]
                            properties:
                                value:
                                    type: string
                                    example: czarne
                                count:
                                    type: integer
                                    description: >-
                                        The number of products that have a variant with this value meeting the other variant
                                        conditions (other axes, price, availability). For an axis without a selection it is the
                                        `total` after adding the value; for an axis with a selection, the result of selecting only
                                        this value of the axis.
                                    example: 4
                        PriceRange:
                            type: object
                            description: Gross prices in grosze.
                            required: [min, max]
                            properties:
                                min:
                                    type: integer
                                    example: 24900
                                max:
                                    type: integer
                                    example: 49900
                        ProductListItem:
                            type: object
                            required: [id, name, slug, shortDescription, image]
                            properties:
                                id:
                                    type: string
                                    format: uuid
                                name:
                                    type: string
                                    example: Buty do biegania Puls 2 granatowe
                                slug:
                                    type: string
                                    example: buty-do-biegania-puls-2-granatowe
                                shortDescription:
                                    type: string
                                image:
                                    nullable: true
                                    description: The main image, null when the product has no images.
                                    allOf:
                                        - $ref: '#/components/schemas/ProductImage'
                        ProductImage:
                            type: object
                            description: A product image of one predefined size, with signed URLs of its variants grouped by output format.
                            required: [alt, size, aspectRatio, variants]
                            properties:
                                alt:
                                    type: string
                                    description: Alternative text of the image.
                                    example: Biegaczka na leśnej ścieżce
                                size:
                                    type: string
                                    description: Name of the image size.
                                    example: listing
                                aspectRatio:
                                    type: string
                                    description: Aspect ratio of every variant, width:height.
                                    example: '1:1'
                                variants:
                                    type: object
                                    description: Variants by output format (the key is the file extension, e.g. webp), widths ascending.
                                    additionalProperties:
                                        type: array
                                        items:
                                            type: object
                                            required: [width, url]
                                            properties:
                                                width:
                                                    type: integer
                                                    example: 256
                                                url:
                                                    type: string
                                                    example: http://localhost:8081/signature/rs:fill:256:256/g:sm/czM6Ly9idWNrZXQva2V5/plain.webp
                        # Response schema of the product page (Catalog\Application\Query\ProductDetails); checked against
                        # real responses by ProductDetailsEndpointTest.
                        ProductDetails:
                            type: object
                            required: [id, slug, name, shortDescription, breadcrumb, images, variantAxes, variants]
                            properties:
                                id:
                                    type: string
                                    format: uuid
                                slug:
                                    type: string
                                    example: buty-szosowe-tarvik-asfalt-200
                                name:
                                    type: string
                                    example: Buty szosowe Tarvik Asfalt 200
                                shortDescription:
                                    type: string
                                breadcrumb:
                                    type: array
                                    description: The categories from the root to the main category of the product.
                                    items:
                                        $ref: '#/components/schemas/BreadcrumbItem'
                                images:
                                    type: array
                                    description: All the images of the product in position order, the first is the main one (size `product`).
                                    items:
                                        $ref: '#/components/schemas/ProductImage'
                                variantAxes:
                                    type: array
                                    description: Names of the variant axes, in order; empty for a product with one default variant.
                                    items:
                                        type: string
                                    example: [Kolor, Rozmiar]
                                variants:
                                    type: array
                                    description: The variants in position order.
                                    items:
                                        $ref: '#/components/schemas/ProductDetailsVariant'
                        BreadcrumbItem:
                            type: object
                            required: [id, name, path]
                            properties:
                                id:
                                    type: string
                                    format: uuid
                                name:
                                    type: string
                                    example: Buty
                                path:
                                    type: string
                                    description: The slugs from the root to this category joined with `/`, as `path` of `CategoryNode`.
                                    example: bieganie/buty
                        ProductDetailsVariant:
                            type: object
                            required: [variantId, label, values]
                            properties:
                                variantId:
                                    type: string
                                    format: uuid
                                label:
                                    type: string
                                    description: The values joined with a comma; empty for the default variant.
                                    example: czarne, 42
                                values:
                                    type: array
                                    description: One value per axis, in the order of the axes.
                                    items:
                                        type: string
                                    example: [czarne, '42']
                        # Response schemas of the cart (Cart\Application\View), checked against real responses by the
                        # functional tests of the cart endpoints.
                        CartView:
                            type: object
                            description: A cart with everything the store shows, computed by the API. The number of available units is never part of it.
                            required: [id, lines, totals, hasExcludedLines, discount]
                            properties:
                                id:
                                    type: string
                                    format: uuid
                                    nullable: true
                                    description: Id of the cart; null for a customer who has no cart yet.
                                lines:
                                    type: array
                                    description: The lines in the order they were added.
                                    items:
                                        $ref: '#/components/schemas/CartLine'
                                totals:
                                    $ref: '#/components/schemas/CartTotals'
                                hasExcludedLines:
                                    type: boolean
                                    description: Whether a line is not purchasable and so not part of the totals.
                                discount:
                                    nullable: true
                                    description: >-
                                        The discount code of the read (`discountCode`), applied or rejected; null without a code,
                                        for a blank one and for a cart without a purchasable line (no quote). Changes of the cart
                                        answer without a code.
                                    oneOf:
                                        - $ref: '#/components/schemas/AppliedCartDiscount'
                                        - $ref: '#/components/schemas/RejectedCartDiscount'
                                    discriminator:
                                        propertyName: status
                                        mapping:
                                            applied: '#/components/schemas/AppliedCartDiscount'
                                            rejected: '#/components/schemas/RejectedCartDiscount'
                        AppliedCartDiscount:
                            type: object
                            description: A code the quote applied to the purchasable lines.
                            required: [status, code, amountGross, kind, value]
                            properties:
                                status:
                                    type: string
                                    enum: [applied]
                                code:
                                    type: string
                                    description: The code in its normalised form (upper case).
                                    example: WITAJ10
                                amountGross:
                                    type: integer
                                    description: The discount in grosze, at least 1; `totals.gross` is `totals.subtotalGross` less it.
                                    example: 4498
                                kind:
                                    type: string
                                    enum: [percent, amount]
                                value:
                                    type: integer
                                    description: The percent (1–90) of a `percent` code, the amount in grosze of an `amount` code.
                                    example: 10
                        RejectedCartDiscount:
                            type: object
                            description: A code the quote did not apply; the totals are without discount.
                            required: [status, code, reason, detail, minimumOrderGross]
                            properties:
                                status:
                                    type: string
                                    enum: [rejected]
                                code:
                                    type: string
                                    description: The code as read (trimmed, ASCII letters in upper case).
                                    example: LATO15
                                reason:
                                    type: string
                                    description: '`invalid`: unknown, disabled, not started or expired (also a text that is no code); `used_up`: the usage limit is reached; `below_minimum`: the subtotal is below the minimum of the code.'
                                    enum: [invalid, used_up, below_minimum]
                                detail:
                                    type: string
                                    description: The Polish message for the customer, the same as the `detail` of the 409 of an order with the code.
                                    example: Ten kod jest nieprawidłowy albo nieaktywny.
                                minimumOrderGross:
                                    type: integer
                                    nullable: true
                                    description: The smallest subtotal in grosze the code works from, only for `below_minimum`.
                                    example: 30000
                        CartLine:
                            type: object
                            required: [variantId, product, quantity, unitPrice, lineTotal, state]
                            properties:
                                variantId:
                                    type: string
                                    format: uuid
                                    description: The variant of a product the line holds; the lines are unique by variant.
                                product:
                                    nullable: true
                                    description: Null when Catalog no longer knows the variant (`unavailable_product`).
                                    allOf:
                                        - $ref: '#/components/schemas/CartLineProduct'
                                quantity:
                                    type: integer
                                    minimum: 1
                                    maximum: 99
                                unitPrice:
                                    nullable: true
                                    description: The current (effective) gross price, for a purchasable line from Pricing's quote; null without a current price.
                                    allOf:
                                        - $ref: '#/components/schemas/GrossAmount'
                                lineTotal:
                                    nullable: true
                                    description: Unit price × quantity before the discount code, only for a `purchasable` line.
                                    allOf:
                                        - $ref: '#/components/schemas/GrossAmount'
                                state:
                                    type: string
                                    description: 'The first that applies: the variant is unknown to Catalog, has no current price, has no available unit, has fewer available units than the quantity; otherwise purchasable.'
                                    enum: [unavailable_product, no_price, out_of_stock, insufficient_stock, purchasable]
                        CartLineProduct:
                            type: object
                            description: The product of the variant of the line.
                            required: [productId, name, variantLabel, image]
                            properties:
                                productId:
                                    type: string
                                    format: uuid
                                name:
                                    type: string
                                    description: Name of the product.
                                    example: Buty szosowe Tarvik Asfalt 200
                                variantLabel:
                                    type: string
                                    description: The values of the variant joined with ", "; empty for the default variant of a product without variant axes.
                                    example: czarne, 42
                                image:
                                    nullable: true
                                    description: The main image in the listing size, null when the product has no images.
                                    allOf:
                                        - $ref: '#/components/schemas/ProductImage'
                        GrossAmount:
                            type: object
                            required: [gross, currency]
                            properties:
                                gross:
                                    type: integer
                                    description: Gross amount (VAT included) in grosze.
                                    example: 19999
                                currency:
                                    type: string
                                    enum: [PLN]
                        CartTotals:
                            type: object
                            description: The totals of Pricing's quote of the purchasable lines; all 0 without a purchasable line.
                            required: [subtotalGross, discountGross, gross, currency, itemCount]
                            properties:
                                subtotalGross:
                                    type: integer
                                    description: Sum of the `lineTotal` of the purchasable lines in grosze, before the discount code.
                                    example: 44988
                                discountGross:
                                    type: integer
                                    description: The discount of the applied code in grosze, 0 without one.
                                    example: 4498
                                gross:
                                    type: integer
                                    description: The total to pay in grosze, `subtotalGross` − `discountGross`.
                                    example: 40490
                                currency:
                                    type: string
                                    enum: [PLN]
                                itemCount:
                                    type: integer
                                    description: Units of every line, purchasable or not (the counter in the header).
                                    example: 2
                        MergeResult:
                            type: object
                            description: The cart of the customer after a merge of a guest cart.
                            required: [cart, result, truncated]
                            properties:
                                cart:
                                    $ref: '#/components/schemas/CartView'
                                result:
                                    type: string
                                    description: '`merged`: the guest lines moved; `already_merged`: the guest cart was merged before; `nothing_to_merge`: the guest cart is unknown, expired or a customer cart. Only `merged` changes anything.'
                                    enum: [merged, already_merged, nothing_to_merge]
                                truncated:
                                    type: boolean
                                    description: Whether a sum was cut to 99 units or a variant of the guest skipped because the cart had 50 variants; always false unless `merged`.
                        CartSummary:
                            type: object
                            required: [itemCount]
                            properties:
                                itemCount:
                                    type: integer
                                    description: Units of every line of the cart.
                                    example: 2
                        # Response schema of a placed order (Ordering\Application\View\OrderView, `placedAt` and
                        # `paymentDeadline` formatted by OrderPlacement), checked against real responses by the functional
                        # tests of the order endpoints.
                        OrderView:
                            type: object
                            description: An order as it was placed, with copies of the names and prices of that moment. Amounts in grosze.
                            required: [orderId, number, status, email, fullName, phone, shippingAddress, lines, totals, placedAt, paymentDeadline, accessToken]
                            properties:
                                orderId:
                                    type: string
                                    format: uuid
                                number:
                                    type: string
                                    description: The number the customer is told, `R-` and a number from 100001.
                                    example: R-100001
                                status:
                                    $ref: '#/components/schemas/CustomerOrderStatus'
                                email:
                                    type: string
                                    description: The address the order is confirmed to.
                                    example: anna.nowak@example.com
                                fullName:
                                    type: string
                                    example: Anna Nowak
                                phone:
                                    type: string
                                    description: +48 and 9 digits.
                                    example: '+48600100200'
                                shippingAddress:
                                    $ref: '#/components/schemas/OrderShippingAddress'
                                lines:
                                    type: array
                                    description: The lines of the cart, in its order.
                                    items:
                                        $ref: '#/components/schemas/OrderLine'
                                totals:
                                    $ref: '#/components/schemas/OrderTotals'
                                placedAt:
                                    type: string
                                    format: date-time
                                    description: When the order was placed (RFC 3339, UTC).
                                    example: '2026-11-05T12:30:00+00:00'
                                paymentDeadline:
                                    type: string
                                    format: date-time
                                    description: The order is to be paid by this moment, 30 minutes after the placement (RFC 3339, UTC).
                                    example: '2026-11-05T13:00:00+00:00'
                                accessToken:
                                    type: string
                                    nullable: true
                                    description: >-
                                        The key of a guest to the order (starting a payment, reading its status), 43 characters of
                                        base64url; the same on a replay. Null for an order of a customer, who reaches it with the
                                        token of the session.
                                    minLength: 43
                                    maxLength: 43
                                    pattern: '^[A-Za-z0-9_-]{43}$'
                                    example: dGhpcy1pcy1hLXRva2VuLW9mLXRoZS1ndWVzdC0xMjM
                        OrderShippingAddress:
                            type: object
                            required: [street, postalCode, city, country]
                            properties:
                                street:
                                    type: string
                                    example: ul. Długa 5/3
                                postalCode:
                                    type: string
                                    example: '00-950'
                                city:
                                    type: string
                                    example: Warszawa
                                country:
                                    type: string
                                    enum: [PL]
                        OrderLine:
                            type: object
                            required: [variantId, productName, variantLabel, quantity, unitGross, lineGross]
                            properties:
                                variantId:
                                    type: string
                                    format: uuid
                                productName:
                                    type: string
                                    example: Buty szosowe Tarvik Asfalt 200
                                variantLabel:
                                    type: string
                                    description: The values of the variant joined with ", "; empty for the default variant of a product without variant axes.
                                    example: czarne, 42
                                quantity:
                                    type: integer
                                    minimum: 1
                                    maximum: 99
                                unitGross:
                                    type: integer
                                    description: Gross price of one unit in grosze.
                                    example: 19999
                                lineGross:
                                    type: integer
                                    description: Unit gross price × quantity, in grosze.
                                    example: 39998
                        OrderTotals:
                            type: object
                            description: Sums of the lines; net + vat = gross.
                            required: [net, vat, gross, currency]
                            properties:
                                net:
                                    type: integer
                                    example: 32519
                                vat:
                                    type: integer
                                    example: 7479
                                gross:
                                    type: integer
                                    example: 39998
                                currency:
                                    type: string
                                    enum: [PLN]
                        # Response schemas of the order history of the customer (Ordering\Application\Query\CustomerOrderList and
                        # View\CustomerOrderView, formatted by Ordering\UI\Http\CustomerOrderJson), checked against real
                        # responses by the functional tests of the order history endpoints.
                        CustomerOrderStatus:
                            type: string
                            description: '`new` (waits for the payment; right after the placement), `paid`, `shipped`, `delivered`, `cancelled` (unpaid in time, or by staff), `returned`.'
                            enum: [new, paid, shipped, delivered, cancelled, returned]
                        CustomerOrderList:
                            type: object
                            description: A page of the order history of the customer.
                            required: [items, nextCursor]
                            properties:
                                items:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/CustomerOrderListItem'
                                nextCursor:
                                    type: string
                                    nullable: true
                                    description: Opaque cursor of the next page (send it as `after`), null on the last page.
                                    example: eyJzIjoicGxhY2VkIiwidCI6IjIwMjYtMTEtMDVUMTI6MDA6MDAuMDAwMDAwKzAwOjAwIiwiaSI6IjAxOTJmMGM0In0
                        CustomerOrderListItem:
                            type: object
                            description: An order in the history. Amounts in grosze.
                            required: [orderId, number, placedAt, status, totalGross, currency, itemCount, paymentDeadline, paymentDeadlinePassed]
                            properties:
                                orderId:
                                    type: string
                                    format: uuid
                                number:
                                    type: string
                                    example: R-100001
                                placedAt:
                                    type: string
                                    format: date-time
                                    description: RFC 3339, UTC.
                                    example: '2026-11-05T12:30:00+00:00'
                                status:
                                    $ref: '#/components/schemas/CustomerOrderStatus'
                                totalGross:
                                    type: integer
                                    example: 39998
                                currency:
                                    type: string
                                    enum: [PLN]
                                itemCount:
                                    type: integer
                                    description: Units of all lines of the order.
                                    example: 3
                                paymentDeadline:
                                    type: string
                                    format: date-time
                                    description: The order was to be paid by this moment (RFC 3339, UTC); meaningful for a `new` order.
                                    example: '2026-11-05T13:00:00+00:00'
                                paymentDeadlinePassed:
                                    type: boolean
                                    description: True only for a `new` order whose `paymentDeadline` has come, computed by the API; false for every other status.
                        CustomerOrder:
                            type: object
                            description: >-
                                An order of the customer with copies of the names and prices of the placement. Amounts in grosze.
                                No history of changes, notes, data of staff, refund or payment.
                            required: [orderId, number, status, shippingAddress, lines, totals, placedAt, paymentDeadline, paymentDeadlinePassed, paidAt, shippedAt, deliveredAt, cancelledAt, returnedAt]
                            properties:
                                orderId:
                                    type: string
                                    format: uuid
                                number:
                                    type: string
                                    example: R-100001
                                status:
                                    $ref: '#/components/schemas/CustomerOrderStatus'
                                shippingAddress:
                                    $ref: '#/components/schemas/OrderShippingAddress'
                                lines:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/OrderLine'
                                totals:
                                    $ref: '#/components/schemas/OrderTotals'
                                placedAt:
                                    type: string
                                    format: date-time
                                    description: RFC 3339, UTC.
                                    example: '2026-11-05T12:30:00+00:00'
                                paymentDeadline:
                                    type: string
                                    format: date-time
                                    description: The order was to be paid by this moment, 30 minutes after the placement (RFC 3339, UTC).
                                    example: '2026-11-05T13:00:00+00:00'
                                paymentDeadlinePassed:
                                    type: boolean
                                    description: True only for a `new` order whose `paymentDeadline` has come, computed by the API; false for every other status.
                                paidAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                                    description: When the payment was confirmed (RFC 3339, UTC); null until then.
                                shippedAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                                    description: When the order was shipped (RFC 3339, UTC); null until then.
                                deliveredAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                                    description: When the order was delivered (RFC 3339, UTC); null until then, and for an order returned without being delivered.
                                cancelledAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                                    description: When the order was cancelled (RFC 3339, UTC); null for an order that was not.
                                returnedAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                                    description: When the return was received (RFC 3339, UTC); null for an order that was not returned.
                        # Response schemas of Payment (Payment\Application\View\PaymentView, Query\PaymentStatusView,
                        # Query\PaymentProviderView, formatted by PaymentEndpoints), checked against real responses by the
                        # functional tests of the payment endpoints.
                        PaymentProvider:
                            type: object
                            required: [code, name]
                            properties:
                                code:
                                    type: string
                                    enum: [demo-transfer, demo-card]
                                name:
                                    type: string
                                    description: The name the customer sees.
                                    example: Szybki przelew (demo)
                        PaymentView:
                            type: object
                            description: A payment of an order at a provider.
                            required: [paymentId, provider, status, redirectUrl]
                            properties:
                                paymentId:
                                    type: string
                                    format: uuid
                                provider:
                                    type: string
                                    enum: [demo-transfer, demo-card]
                                status:
                                    type: string
                                    description: '`pending` until the provider confirms the payment (`succeeded`) or refuses it (`failed`); `cancelled` when a newer attempt cancelled it at the provider.'
                                    enum: [pending, succeeded, failed, cancelled]
                                redirectUrl:
                                    type: string
                                    nullable: true
                                    description: The page of the provider where the customer pays.
                                    example: http://localhost:8000/payment-simulator/demo-transfer/pay/7d3f0a8e-4a1b-4c55-9f1e-2b3c4d5e6f70
                        PaymentStatusView:
                            type: object
                            description: The order and its newest payment, as the confirmation page shows them. Amounts in grosze.
                            required: [orderNumber, orderStatus, paymentDeadline, totalGross, currency, canStartPayment, latestPayment]
                            properties:
                                orderNumber:
                                    type: string
                                    example: R-100001
                                orderStatus:
                                    type: string
                                    enum: [new, paid, cancelled]
                                paymentDeadline:
                                    type: string
                                    format: date-time
                                    description: The order is to be paid by this moment (RFC 3339, UTC).
                                    example: '2026-11-05T13:00:00+00:00'
                                totalGross:
                                    type: integer
                                    example: 39998
                                currency:
                                    type: string
                                    enum: [PLN]
                                canStartPayment:
                                    type: boolean
                                    description: Whether a payment can be started now (the order is new and before its deadline). A new attempt cancels a pending payment at its provider first.
                                latestPayment:
                                    nullable: true
                                    description: The newest payment of the order, null before the first one.
                                    allOf:
                                        - $ref: '#/components/schemas/LatestPayment'
                        LatestPayment:
                            type: object
                            required: [provider, status, resumeUrl]
                            properties:
                                provider:
                                    type: string
                                    enum: [demo-transfer, demo-card]
                                status:
                                    type: string
                                    enum: [pending, succeeded, failed, cancelled]
                                resumeUrl:
                                    type: string
                                    nullable: true
                                    description: The page of the provider of a pending payment, to go back to it while the order is payable; null otherwise.
                        PaymentConflictProblem:
                            type: object
                            description: >-
                                A 409 of the payment endpoints. `type` names the cause (the `detail` is Polish text for people
                                and may change): the order is paid, the order is cancelled or past its payment deadline, another
                                payment of the order is in progress (a concurrent start, or the pending payment was executed at its
                                provider and waits for its confirmation), or the `Idempotency-Key` was used by another request.
                            required: [type, title, status, detail]
                            properties:
                                type:
                                    type: string
                                    enum:
                                        - 'tag:piotrp321.github.io,2026:shop/problems/order-already-paid'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/payment-deadline-passed'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/payment-in-progress'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/payment-idempotency-key-reused'
                                title:
                                    type: string
                                    example: Conflict
                                status:
                                    type: integer
                                    enum: [409]
                                detail:
                                    type: string
                                    description: Polish text for the customer.
                        Problem: &problem
                            type: object
                            description: Problem details (RFC 9457), `application/problem+json`.
                            required: [type, title, status]
                            properties:
                                type:
                                    type: string
                                    example: about:blank
                                title:
                                    type: string
                                    example: Bad Request
                                status:
                                    type: integer
                                    example: 400
                                detail:
                                    type: string
                                    description: Present only for 4xx errors, never for 5xx.
                                violations:
                                    type: array
                                    description: Present only for 400 (invalid query parameters) or 422 (invalid request body) caused by invalid input.
                                    items:
                                        type: object
                                        required: [propertyPath, title]
                                        properties:
                                            propertyPath:
                                                type: string
                                                example: category
                                            title:
                                                type: string
                                                example: This is not a valid UUID.
                        OrderConflictProblem:
                            type: object
                            description: >-
                                A 409 of the order endpoints. `type` names the cause (the `detail` is Polish text for people
                                and may change): the cart is empty (also without a cart or with an expired one), has a line that
                                cannot be bought (no current price, unknown variant), has fewer units in stock than ordered, has
                                a gross total other than `expectedTotalGross`, or the `Idempotency-Key` was used by another request.
                            required: [type, title, status, detail]
                            properties:
                                type:
                                    type: string
                                    enum:
                                        - 'tag:piotrp321.github.io,2026:shop/problems/cart-empty'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/cart-not-orderable'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/insufficient-stock-for-order'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/order-total-changed'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/idempotency-key-reused'
                                title:
                                    type: string
                                    example: Conflict
                                status:
                                    type: integer
                                    enum: [409]
                                detail:
                                    type: string
                                    description: Polish text for the customer.
                    securitySchemes:
                        shop:
                            type: http
                            scheme: bearer
                            bearerFormat: JWT
                            description: Access token issued by the `shop` realm (customers).
        admin:
            path_patterns:
                - ^/api/v1/admin(/|$)
            documentation:
                openapi: 3.0.3
                info:
                    title: Shop Admin API
                    description: Endpoints used by the admin panel.
                    version: 1.0.0
                components:
                    schemas:
                        # The same document as in the default area.
                        Problem: *problem
                        # Response schemas of the orders of the panel (Ordering\Application\Query\BackofficeOrderList and
                        # View\BackofficeOrderView, formatted by Ordering\UI\Http\BackofficeOrderJson), checked against real
                        # responses by the functional tests of the order endpoints of the panel.
                        BackofficeOrderList:
                            type: object
                            description: A page of the order list.
                            required: [items, nextCursor]
                            properties:
                                items:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/BackofficeOrderListItem'
                                nextCursor:
                                    type: string
                                    nullable: true
                                    description: Opaque cursor of the next page (send it as `after` with the same filters), null on the last page.
                                    example: eyJzIjoicGxhY2VkIiwidCI6IjIwMjYtMTEtMDVUMTI6MDA6MDAuMDAwMDAwKzAwOjAwIiwiaSI6IjAxOTJmMGM0In0
                        BackofficeOrderListItem:
                            type: object
                            description: An order in the list. Amounts in grosze.
                            required: [orderId, number, placedAt, status, email, fullName, totalGross, currency, itemCount, refund]
                            properties:
                                orderId:
                                    type: string
                                    format: uuid
                                number:
                                    type: string
                                    example: R-100001
                                placedAt:
                                    type: string
                                    format: date-time
                                    description: RFC 3339, UTC.
                                    example: '2026-11-05T12:30:00+00:00'
                                status:
                                    $ref: '#/components/schemas/BackofficeOrderStatus'
                                email:
                                    type: string
                                    example: anna.nowak@example.com
                                fullName:
                                    type: string
                                    example: Anna Nowak
                                totalGross:
                                    type: integer
                                    example: 39998
                                currency:
                                    type: string
                                    enum: [PLN]
                                itemCount:
                                    type: integer
                                    description: Units of all lines of the order.
                                    example: 3
                                refund:
                                    allOf:
                                        - $ref: '#/components/schemas/BackofficeOrderListRefund'
                                    nullable: true
                                    description: The refund of an order cancelled by staff or returned; null for any other order.
                        BackofficeOrderListRefund:
                            type: object
                            required: [amount, dueAt, completedAt, overdue]
                            properties:
                                amount:
                                    type: integer
                                    description: The gross total of the order, in grosze, in its currency.
                                    example: 39998
                                dueAt:
                                    type: string
                                    format: date-time
                                    description: The refund is to be made by this moment, 14 days after the cancellation or the return (RFC 3339, UTC).
                                    example: '2026-11-19T12:30:00+00:00'
                                completedAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                                    description: When a staff member marked it made (RFC 3339, UTC); null while it is to do.
                                overdue:
                                    type: boolean
                                    description: Still to do past `dueAt`, computed by the API.
                        BackofficeOrderStatus:
                            type: string
                            description: '`new` (waits for the payment), `paid`, `shipped`, `delivered`, `cancelled` (unpaid in time, or by staff), `returned`.'
                            enum: [new, paid, shipped, delivered, cancelled, returned]
                        BackofficeOrderTransition:
                            type: string
                            description: 'A change of the status by staff: `ship` (paid → shipped), `deliver` (shipped → delivered), `cancel` (paid → cancelled, a refund to do), `return` (shipped or delivered → returned, a refund to do).'
                            enum: [ship, deliver, cancel, return]
                        BackofficeOrder:
                            type: object
                            description: >-
                                An order with everything the panel shows of it, copies of the names and prices of its placement included.
                                Amounts in grosze; moments in RFC 3339 and UTC, null until the status they belong to.
                            required: [orderId, number, status, version, email, fullName, phone, shippingAddress, lines, totals, placedAt, paymentDeadline, paidAt, paymentId, shippedAt, deliveredAt, cancelledAt, cancellationReason, returnedAt, history, refund, allowedTransitions, canCompleteRefund]
                            properties:
                                orderId:
                                    type: string
                                    format: uuid
                                number:
                                    type: string
                                    example: R-100001
                                status:
                                    $ref: '#/components/schemas/BackofficeOrderStatus'
                                version:
                                    type: integer
                                    minimum: 1
                                    description: The version to send with the next change of the status or the completion of the refund.
                                    example: 2
                                email:
                                    type: string
                                    example: anna.nowak@example.com
                                fullName:
                                    type: string
                                    example: Anna Nowak
                                phone:
                                    type: string
                                    description: +48 and 9 digits.
                                    example: '+48600100200'
                                shippingAddress:
                                    $ref: '#/components/schemas/BackofficeOrderAddress'
                                lines:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/BackofficeOrderLine'
                                totals:
                                    $ref: '#/components/schemas/BackofficeOrderTotals'
                                placedAt:
                                    type: string
                                    format: date-time
                                    example: '2026-11-05T12:30:00+00:00'
                                paymentDeadline:
                                    type: string
                                    format: date-time
                                    description: An order still `new` past this moment is cancelled.
                                    example: '2026-11-05T13:00:00+00:00'
                                paidAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                                    description: Stays after a cancellation by staff and a return.
                                paymentId:
                                    type: string
                                    format: uuid
                                    nullable: true
                                    description: The payment that paid the order (the one to refund); stays after a cancellation by staff and a return.
                                shippedAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                                deliveredAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                                    description: Null also for an order returned without being delivered.
                                cancelledAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                                cancellationReason:
                                    type: string
                                    nullable: true
                                    description: '`payment_timeout` (unpaid in time) or `staff`; null unless cancelled.'
                                    enum: [payment_timeout, staff, null]
                                returnedAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                                history:
                                    type: array
                                    description: Every change of the status, oldest first.
                                    items:
                                        $ref: '#/components/schemas/BackofficeOrderStatusChange'
                                refund:
                                    allOf:
                                        - $ref: '#/components/schemas/BackofficeOrderRefund'
                                    nullable: true
                                    description: The refund of an order cancelled by staff or returned; null for any other order.
                                allowedTransitions:
                                    type: array
                                    description: The changes of the status the staff member of the token may make now (the status allows them and so do their roles).
                                    items:
                                        $ref: '#/components/schemas/BackofficeOrderTransition'
                                canCompleteRefund:
                                    type: boolean
                                    description: The refund is to do and the staff member of the token may mark it made.
                        BackofficeOrderAddress:
                            type: object
                            required: [street, postalCode, city, country]
                            properties:
                                street:
                                    type: string
                                    example: ul. Długa 5/3
                                postalCode:
                                    type: string
                                    example: '00-950'
                                city:
                                    type: string
                                    example: Warszawa
                                country:
                                    type: string
                                    enum: [PL]
                        BackofficeOrderLine:
                            type: object
                            required: [variantId, productName, variantLabel, quantity, unitGross, lineGross]
                            properties:
                                variantId:
                                    type: string
                                    format: uuid
                                productName:
                                    type: string
                                    example: Buty szosowe Tarvik Asfalt 200
                                variantLabel:
                                    type: string
                                    description: The values of the variant joined with ", "; empty for the default variant of a product without variant axes.
                                    example: czarne, 42
                                quantity:
                                    type: integer
                                    example: 2
                                unitGross:
                                    type: integer
                                    example: 19999
                                lineGross:
                                    type: integer
                                    example: 39998
                        BackofficeOrderTotals:
                            type: object
                            description: Sums of the lines; net + vat = gross.
                            required: [net, vat, gross, currency]
                            properties:
                                net:
                                    type: integer
                                    example: 32519
                                vat:
                                    type: integer
                                    example: 7479
                                gross:
                                    type: integer
                                    example: 39998
                                currency:
                                    type: string
                                    enum: [PLN]
                        BackofficeOrderStatusChange:
                            type: object
                            description: An entry of the history. Only a change by `staff` names the staff member, and only it may have a note.
                            required: [from, to, occurredAt, actorType, staffId, staffUsername, note]
                            properties:
                                from:
                                    allOf:
                                        - $ref: '#/components/schemas/BackofficeOrderStatus'
                                    nullable: true
                                    description: Null for the placement.
                                to:
                                    $ref: '#/components/schemas/BackofficeOrderStatus'
                                occurredAt:
                                    type: string
                                    format: date-time
                                    example: '2026-11-05T12:40:00+00:00'
                                actorType:
                                    type: string
                                    description: '`customer` (the placement, also by a guest), `system` (the payment, the expiry), `staff`.'
                                    enum: [system, customer, staff]
                                staffId:
                                    type: string
                                    nullable: true
                                staffUsername:
                                    type: string
                                    nullable: true
                                    example: anna
                                note:
                                    type: string
                                    nullable: true
                                    example: Kurier DPD
                        BackofficeOrderRefund:
                            type: object
                            description: The money the order owes the customer back; made by hand outside the system, then marked made.
                            required: [amount, currency, dueAt, overdue, completedAt, completedByStaffId, completedByUsername, note]
                            properties:
                                amount:
                                    type: integer
                                    description: The gross total of the order, in grosze.
                                    example: 39998
                                currency:
                                    type: string
                                    enum: [PLN]
                                dueAt:
                                    type: string
                                    format: date-time
                                    description: 14 days after the cancellation or the return.
                                    example: '2026-11-19T12:30:00+00:00'
                                overdue:
                                    type: boolean
                                    description: Still to do past `dueAt`, computed by the API.
                                completedAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                                    description: Null while it is to do.
                                completedByStaffId:
                                    type: string
                                    nullable: true
                                completedByUsername:
                                    type: string
                                    nullable: true
                                    example: bartek
                                note:
                                    type: string
                                    nullable: true
                                    example: Przelew wysłany
                        # A separate schema from OrderConflictProblem of the store (default area), which stays as it is.
                        BackofficeOrderConflictProblem:
                            type: object
                            description: >-
                                A 409 of the order endpoints of the panel. `type` names the cause (the `detail` is Polish text for
                                people and may change): the status of the order does not allow the change, the order has no
                                refund to do, or (`about:blank`) the order changed since the `version` sent, also when a change
                                that succeeded is sent again. Nothing is changed.
                            required: [type, title, status, detail]
                            properties:
                                type:
                                    type: string
                                    enum:
                                        - 'tag:piotrp321.github.io,2026:shop/problems/order-transition-not-allowed'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/refund-not-pending'
                                        - about:blank
                                title:
                                    type: string
                                    example: Conflict
                                status:
                                    type: integer
                                    enum: [409]
                                detail:
                                    type: string
                                    description: Polish text for the staff member.
                        PricingConflictProblem:
                            type: object
                            description: >-
                                A 409 of the prices, promotions and discount codes of the panel. `type` names the cause (the
                                `detail` is Polish text for people and may change): the price of a variant in an active promotion
                                cannot change (end the promotion first), variants are in another promotion of an overlapping
                                period (listed in `conflictingVariantIds`), the status of the promotion does not allow the change
                                (after its start only the name and the end, an ended one not at all, only a planned one is
                                deleted), another discount code has the same text, the change of a started discount code is not
                                allowed (only its end, `enabled` and an existing limit change), or (`about:blank`) the price, the
                                promotion or the discount code changed since the `version` sent. Nothing is changed.
                            required: [type, title, status, detail]
                            properties:
                                type:
                                    type: string
                                    enum:
                                        - 'tag:piotrp321.github.io,2026:shop/problems/price-locked-by-promotion'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/promotion-overlap'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/promotion-not-editable'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/discount-code-taken'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/discount-code-not-editable'
                                        - about:blank
                                title:
                                    type: string
                                    example: Conflict
                                status:
                                    type: integer
                                    enum: [409]
                                detail:
                                    type: string
                                    description: Polish text for the staff member.
                                conflictingVariantIds:
                                    type: array
                                    description: Only with `promotion-overlap`. The variants of the request that are in another promotion of an overlapping period, ordered by id.
                                    items:
                                        type: string
                                        format: uuid
                        ProductConflictProblem:
                            type: object
                            description: >-
                                A 409 of the product endpoints. `type` names the cause (the `detail` is Polish text for people
                                and may change): the product changed since the given version, the slug belongs to another
                                product, the slug is locked since the first publication, the product cannot be published (a draft
                                without images) or lose its last image once published, an axis or the meaning of a variant cannot
                                change after the first publication, or a removed variant has stock or reservations.
                            required: [type, title, status, detail]
                            properties:
                                type:
                                    type: string
                                    enum:
                                        - 'tag:piotrp321.github.io,2026:shop/problems/product-modified'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/slug-taken'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/slug-locked'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/product-not-publishable'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/variant-locked'
                                        - 'tag:piotrp321.github.io,2026:shop/problems/variant-in-use'
                                title:
                                    type: string
                                    example: Conflict
                                status:
                                    type: integer
                                    enum: [409]
                                detail:
                                    type: string
                                    description: Polish text for the staff member.
                    securitySchemes:
                        backoffice:
                            type: http
                            scheme: bearer
                            bearerFormat: JWT
                            description: Access token issued by the `backoffice` realm (staff).
