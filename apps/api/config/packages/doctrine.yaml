doctrine:
    dbal:
        driver: pdo_pgsql
        host: '%env(SHOP_DB_HOST)%'
        dbname: '%env(SHOP_DB_NAME)%'
        user: '%env(SHOP_DB_USER)%'
        password: '%env(SHOP_DB_PASSWORD)%'
        server_version: '18'
        charset: utf8
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: false
        mappings:
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Infrastructure/Persistence/Doctrine/Record'
                prefix: 'App\Catalog\Infrastructure\Persistence\Doctrine\Record'

when@test: &test
    doctrine:
        dbal:
            dbname_suffix: '_test'

when@test_messaging: *test

when@test_oidc: *test

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
