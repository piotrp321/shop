doctrine:
    dbal:
        driver: pdo_pgsql
        host: '%env(SHOP_DB_HOST)%'
        dbname: '%env(SHOP_DB_NAME)%'
        user: '%env(SHOP_DB_USER)%'
        password: '%env(SHOP_DB_PASSWORD)%'
        server_version: '18'
        charset: utf8
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: false
        mappings:
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Infrastructure/Persistence/Doctrine/Record'
                prefix: 'App\Catalog\Infrastructure\Persistence\Doctrine\Record'
            Pricing:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Pricing/Infrastructure/Persistence/Doctrine/Record'
                prefix: 'App\Pricing\Infrastructure\Persistence\Doctrine\Record'
            Inventory:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inventory/Infrastructure/Persistence/Doctrine/Record'
                prefix: 'App\Inventory\Infrastructure\Persistence\Doctrine\Record'
            Cart:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cart/Infrastructure/Persistence/Doctrine/Record'
                prefix: 'App\Cart\Infrastructure\Persistence\Doctrine\Record'
            Ordering:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Ordering/Infrastructure/Persistence/Doctrine/Record'
                prefix: 'App\Ordering\Infrastructure\Persistence\Doctrine\Record'
            Payment:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Payment/Infrastructure/Persistence/Doctrine/Record'
                prefix: 'App\Payment\Infrastructure\Persistence\Doctrine\Record'
            # The flat simulator module: its one entity is mapped in place (it is no domain of the shop).
            PaymentSimulator:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/PaymentSimulator'
                prefix: 'App\PaymentSimulator'

when@test: &test
    doctrine:
        dbal:
            dbname_suffix: '_test'

when@test_messaging: *test

when@test_oidc: *test

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
