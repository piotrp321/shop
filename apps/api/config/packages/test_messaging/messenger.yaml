# Real transports for the tests of the message route: the outbox, `scheduled`, `payment_simulator`, `promotions` and `jobs`
# in `shop_test` (doctrine.yaml, as configured in messenger.yaml) and `events` on the `test` vhost, so the dev worker
# (database `shop`, vhost `/`) never sees test messages.
framework:
    messenger:
        transports:
            events:
                dsn: 'amqp://%env(urlencode:RABBITMQ_USER)%:%env(urlencode:RABBITMQ_DEFAULT_PASS)%@%env(RABBITMQ_HOST)%:5672/test/events'
                # The retries of `events` (messenger.yaml: 10 tries after 1, 3, 9 s … at most 300 s) come 500 times sooner
                # (2 ms, at most 600 ms), so the test of the exhausted retries takes seconds; the count, the growth and
                # the proportion of the longest delay to the first one stay the same.
                retry_strategy:
                    max_retries: 10
                    delay: 2
                    multiplier: 3
                    max_delay: 600
