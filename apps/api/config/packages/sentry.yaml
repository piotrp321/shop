# Sentry (spec: docs/features/sentry/spec.md). Without SENTRY_DSN the SDK sends nothing and traces nothing that leaves
# the process; the variables are read when the container starts (D2), so one image runs with Sentry and without.
#
# One channel per source (D5), each error is one event:
# - HTTP: ServerErrorReporter (only what ends in a 5xx; the error listener of the bundle is off),
# - console: the console listener of the bundle (an uncaught exception of a command; services.yaml keeps it reporting
#   with the error listener off),
# - Messenger: the listener of the bundle, only the last try of a message (capture_soft_fails: false),
# - explicit logs of the application from `error` up: the handler `sentry` in monolog.yaml.
# The PHP error handler of the SDK is off: a fatal error ends as an exception of the kernel (500) or a log of `php`.
sentry:
    dsn: '%env(default::SENTRY_DSN)%'
    register_error_listener: false
    register_error_handler: false
    options:
        environment: '%env(default:kernel.environment:SENTRY_ENVIRONMENT)%'
        release: '%env(default::SENTRY_RELEASE)%'
        # 0 by default: only a caller that sent its decision in sentry-trace makes a request traced (D7, P8).
        traces_sample_rate: '%env(float:default:app.sentry.traces_sample_rate:SENTRY_TRACES_SAMPLE_RATE)%'
        # The probes are not traced (P4).
        ignore_transactions: ['GET health', 'HEAD health']
        # No personal data and no body of requests from the SDK; the rest is removed by the filter (D4).
        send_default_pii: false
        max_request_body_size: none
        before_send: app.sentry.before_send
        before_send_transaction: app.sentry.before_send_transaction
        before_breadcrumb: app.sentry.before_breadcrumb
        # An error event is sent at once, so an unreachable Sentry delays its response by at most these seconds.
        http_connect_timeout: 2
        http_timeout: 2
    messenger:
        capture_soft_fails: false
        # A scope of Sentry per message: what one message leaves on it never reaches the next one (D6).
        isolate_context_by_message: true

# The tests send nothing over the network: the HTTP client of the SDK keeps the envelopes (tests/Functional/Shared/
# Sentry), and only a test that sets SENTRY_DSN gets any.
when@test: &test
    sentry:
        options:
            http_client: App\Tests\Functional\Shared\Sentry\RecordingSentryHttpClient

when@test_messaging: *test
