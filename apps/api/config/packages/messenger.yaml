framework:
    messenger:
        default_bus: command.bus
        failure_transport: failed

        # The correlation id middleware comes first among ours: the validation and the transaction run under the
        # identifier of the message (spec: docs/features/hardening/spec.md, "Correlation ID").
        buses:
            command.bus:
                middleware:
                    - App\Shared\Infrastructure\Observability\CorrelationIdMiddleware
                    - validation
                    - doctrine_transaction
            query.bus:
                middleware:
                    - App\Shared\Infrastructure\Observability\CorrelationIdMiddleware
            event.bus:
                middleware:
                    - App\Shared\Infrastructure\Observability\CorrelationIdMiddleware
                # An event may have no subscriber yet; that is not an error.
                default_middleware:
                    enabled: true
                    allow_no_handlers: true

        transports:
            # Same connection as the aggregates, so the row joins the command's transaction. The worker polls it
            # (no NOTIFY trigger). A row taken by a worker that died before the ack is retaken after
            # redeliver_timeout; relaying takes milliseconds plus at most the confirm timeout.
            outbox:
                dsn: 'doctrine://default?queue_name=outbox&auto_setup=false&redeliver_timeout=300'
                options:
                    use_notify: false
                # Relaying fails only when RabbitMQ does, so it keeps trying for about 25 minutes (1, 2, 4 … 32 s,
                # then every 60 s) before the event goes to `failed`.
                retry_strategy:
                    max_retries: 30
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
            events:
                dsn: 'amqp://%env(urlencode:RABBITMQ_USER)%:%env(urlencode:RABBITMQ_DEFAULT_PASS)%@%env(RABBITMQ_HOST)%:5672/%env(urlencode:RABBITMQ_VHOST)%/events'
                serializer: messenger.transport.symfony_serializer
                options:
                    # Wait for the broker to confirm the publish, so the relay acks the outbox row only once
                    # RabbitMQ has the message. That it routed the message to a queue is checked by
                    # RoutedAmqpTransport (mandatory publish), which every AMQP transport is.
                    confirm_timeout: 5
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 3
            # Delayed commands (DelayStamp sets available_at): ExpireUnpaidOrder, written in the transaction of the
            # placement on the same connection, waits in the table through any restart or outage of the worker. A row
            # taken by a worker that died before the ack is retaken after redeliver_timeout, as in `outbox`.
            scheduled:
                dsn: 'doctrine://default?queue_name=scheduled&auto_setup=false&redeliver_timeout=300'
                options:
                    use_notify: false
                # A version conflict (the order paid meanwhile) is retried at once by the next attempt; after 5 tries
                # (1, 3, 9, 27, 81 s) the message goes to `failed` and the order stays new.
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 3
            # Webhook deliveries of the payment simulator (DeliverSimulatedWebhook), written in the transaction of the
            # customer's decision on the same connection. A 5xx or a network error of the shop is retried by this
            # strategy: 5 tries after 1, 3, 9, 27 and 81 s (about 2 minutes), then `failed`.
            payment_simulator:
                dsn: 'doctrine://default?queue_name=payment_simulator&auto_setup=false&redeliver_timeout=300'
                options:
                    use_notify: false
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 3
            # The boundaries of the promotion periods (PromotionBoundaryReached, delayed by a DelayStamp) and the
            # refresh of the products of a promotion whose end moved (RefreshPromotionProducts), written in the
            # transaction of the promotion write on the same connection. A queue of its own, so the demo seeds that
            # empty `scheduled` (ordering:seed-demo) leave them alone. Retried like `scheduled`, then `failed`.
            promotions:
                dsn: 'doctrine://default?queue_name=promotions&auto_setup=false&redeliver_timeout=300'
                options:
                    use_notify: false
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 3
            failed:
                dsn: 'doctrine://default?queue_name=failed&auto_setup=false'
                options:
                    use_notify: false

        routing:
            App\Shared\Domain\Event\DomainEvent: outbox
            App\Ordering\Application\Command\ExpireUnpaidOrder: scheduled
            App\PaymentSimulator\DeliverSimulatedWebhook: payment_simulator
            App\Pricing\Application\Command\PromotionBoundaryReached: promotions
            App\Pricing\Application\Command\RefreshPromotionProducts: promotions
