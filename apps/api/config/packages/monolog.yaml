# Logs are JSON lines on stderr (silenced in test).
monolog:
    channels:
        - deprecation

when@dev:
    monolog:
        handlers:
            stderr:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
                channels: ['!event', '!doctrine']

when@test: &test
    monolog:
        handlers:
            'null':
                type: 'null'

when@test_messaging: *test

when@test_oidc: *test

when@prod:
    monolog:
        handlers:
            stderr:
                type: fingers_crossed
                action_level: error
                handler: stderr_json
                excluded_http_codes: [404, 405]
                channels: ['!event', '!cache']
                buffer_size: 50
            # A failing cache pool (Redis of the rate limits down: the limits are off, spec docs/features/hardening/
            # spec.md, D7) is logged by the pool as a warning and the request goes on; outside the buffer above, so
            # the warning is written also when the request succeeds.
            cache_stderr:
                type: stream
                path: php://stderr
                level: warning
                formatter: monolog.formatter.json
                channels: ['cache']
            stderr_json:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
