# The locks of the rate limiters (spec: docs/features/abuse-limits/spec.md, D1), in the Redis of their counters: the
# same DSN (parameter rate_limiter.redis_dsn of rate_limiter.yaml, with its timeouts), a lazy connection of its own.
framework:
    lock:
        rate_limiter: 'rate_limiter.lock_connection'

services:
    rate_limiter.lock_connection:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments: ['%rate_limiter.redis_dsn%', { lazy: true }]
