# The `test` kernel keeps every message in memory. Tests of the real route (Doctrine outbox, RabbitMQ) boot the
# `test_messaging` kernel instead.
framework:
    messenger:
        transports:
            outbox: 'in-memory://'
            scheduled: 'in-memory://'
            payment_simulator: 'in-memory://'
            promotions: 'in-memory://'
            jobs: 'in-memory://'
            indexing_finalize: 'in-memory://'
            # Serialized, like `events`: the JSON serializer of the batches is exercised.
            indexing: 'in-memory://?serialize=true'
            # Serialized, so the JSON serializer of `events` is exercised.
            events: 'in-memory://?serialize=true'
            failed: 'in-memory://'
