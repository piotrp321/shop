# Tests sign their tokens with a key pair generated by tests/bootstrap.php; the firewalls trust its public half
# instead of fetching keys from Keycloak.
security:
    firewalls:
        admin:
            access_token:
                token_handler:
                    oidc:
                        keyset: '%env(OIDC_TEST_JWKS)%'
        shop:
            access_token:
                token_handler:
                    oidc:
                        keyset: '%env(OIDC_TEST_JWKS)%'
