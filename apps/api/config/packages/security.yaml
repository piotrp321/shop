# Access tokens of Keycloak (spec: "Uwierzytelnianie i uprawnienia"). Two stateless firewalls, the first matching
# pattern wins: /api/v1/admin takes only tokens of the `backoffice` realm (staff), the rest of /api/v1 only tokens of
# the `shop` realm (customers). Each checks the RS256 signature, the issuer (public URL of its realm), the audience,
# exp, nbf and iat. Where the keys come from depends on the environment: discovery below, a fixed keyset in tests.
security:
    providers:
        staff:
            id: App\Backoffice\Infrastructure\Security\StaffUserProvider
        customers:
            id: App\Customer\Infrastructure\Security\CustomerUserProvider

    firewalls:
        admin:
            pattern: ^/api/v1/admin(/|$)
            stateless: true
            provider: staff
            entry_point: App\Shared\Infrastructure\Security\ProblemAuthenticationEntryPoint
            access_token:
                token_handler:
                    oidc:
                        audience: backoffice-api
                        issuers: ['%app.oidc.backoffice.issuer%']
                        algorithms: ['RS256']
                failure_handler: App\Shared\Infrastructure\Security\ProblemAuthenticationFailureHandler
        shop:
            pattern: ^/api/v1(/|$)
            stateless: true
            provider: customers
            entry_point: App\Shared\Infrastructure\Security\ProblemAuthenticationEntryPoint
            access_token:
                token_handler:
                    oidc:
                        audience: shop-api
                        issuers: ['%app.oidc.shop.issuer%']
                        algorithms: ['RS256']
                failure_handler: App\Shared\Infrastructure\Security\ProblemAuthenticationFailureHandler

    # First match wins. Everything under /api/v1 needs a token unless it is listed as public here.
    access_control:
        - { path: ^/api/v1/admin(/|$), roles: ROLE_STAFF }
        - { path: ^/api/v1/(products|categories|product-offers)$, methods: [GET, HEAD], roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/products/[^/]+$, methods: [GET, HEAD], roles: PUBLIC_ACCESS }
        # The sitemap of the products (spec: docs/features/seo/spec.md).
        - { path: ^/api/v1/sitemap/(product-chunks|products)$, methods: [GET, HEAD], roles: PUBLIC_ACCESS }
        # Guest carts need no token: the random cart id is the key to the cart (spec: docs/features/cart/spec.md).
        - { path: ^/api/v1/guest-carts(/|$), roles: PUBLIC_ACCESS }
        # A guest places an order of the guest cart named in the body (spec: docs/features/checkout/spec.md);
        # a customer uses /api/v1/me/orders, which the rule below covers.
        - { path: ^/api/v1/orders$, roles: PUBLIC_ACCESS }
        # A guest starts and reads the payment of an order with its access token (header Order-Access-Token; spec:
        # docs/features/payment/spec.md); the providers deliver webhooks signed, without a token; the checkout lists
        # the providers. A customer uses /api/v1/me/orders/{id}/payment(s), which the rule below covers.
        - { path: ^/api/v1/orders/[^/]+/payments?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/payments/webhooks/, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/payment-providers$, methods: [GET, HEAD], roles: PUBLIC_ACCESS }
        - { path: ^/api/v1(/|$), roles: ROLE_CUSTOMER }

# Keys from the discovery document and JWKS of each realm, fetched through the internal URL and cached.
when@dev: &discovery
    security:
        firewalls:
            admin:
                access_token:
                    token_handler:
                        oidc:
                            discovery:
                                base_uri: '%app.oidc.backoffice.discovery_url%'
                                cache: { id: cache.oidc }
            shop:
                access_token:
                    token_handler:
                        oidc:
                            discovery:
                                base_uri: '%app.oidc.shop.discovery_url%'
                                cache: { id: cache.oidc }

when@prod: *discovery

# Functional tests of the discovery itself (KeycloakOutageTest).
when@test_oidc: *discovery
