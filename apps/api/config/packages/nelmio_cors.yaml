# CORS only for the admin panel. The store calls the API from its server, so its origin gets no CORS headers.
nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: []
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        # sentry-trace and baggage: the panel continues its Sentry trace in the API (docs/features/sentry/spec.md, D7).
        allow_headers: ['Content-Type', 'Authorization', 'Idempotency-Key', 'sentry-trace', 'baggage']
        expose_headers: []
        max_age: 3600
    paths:
        '^/api/v1':
            allow_origin: ['%env(ADMIN_URL)%']
