parameters:
    app.images_bucket: '%env(IMAGES_BUCKET)%'
    app.imgproxy_public_url: '%env(IMGPROXY_PUBLIC_URL)%'
    # Search index (spec: "Indeks Elasticsearch"). The application reads and writes through the alias.
    app.search.alias: products
    app.search.shards: 1
    app.search.replicas: 0
    # Keycloak realms: tokens carry the public URL as issuer, keys are discovered through the internal URL
    # (the trailing slash is needed, discovery paths are resolved relative to it).
    app.oidc.backoffice.issuer: '%env(KEYCLOAK_PUBLIC_URL)%/realms/backoffice'
    app.oidc.backoffice.discovery_url: '%env(KEYCLOAK_INTERNAL_URL)%/realms/backoffice/'
    app.oidc.shop.issuer: '%env(KEYCLOAK_PUBLIC_URL)%/realms/shop'
    app.oidc.shop.discovery_url: '%env(KEYCLOAK_INTERNAL_URL)%/realms/shop/'
    # Vhost of the `events` transport, whose queues the dashboard lists (the tests use their own, see below).
    app.rabbitmq.vhost: '%env(RABBITMQ_VHOST)%'
    # Products per bulk request in catalog:reindex (overridden by --batch-size).
    app.search.batch_size: 500
    # The client never retries; timeouts are in seconds.
    app.search.connect_timeout: 1.0
    # Search, count, single writes and alias operations.
    app.search.request_timeout: 2.0
    # Bulk writes, index creation and refresh.
    app.search.long_request_timeout: 30.0

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    app.s3_client:
        class: AsyncAws\S3\S3Client
        arguments:
            -
                endpoint: '%env(GARAGE_S3_ENDPOINT)%'
                region: garage
                pathStyleEndpoint: 'true'
                accessKeyId: '%env(GARAGE_ACCESS_KEY_ID)%'
                accessKeySecret: '%env(GARAGE_SECRET_ACCESS_KEY)%'

    App\Catalog\Infrastructure\Image\FlysystemProductImageStorage:
        arguments:
            $filesystem: '@product_images.storage'
            $maxBytes: 67108864 # 64 MB
            $maxPixels: 50000000 # 50 MP

    App\Catalog\Infrastructure\Image\ImgproxyUrlGenerator:
        arguments:
            $publicUrl: '%app.imgproxy_public_url%'
            $key: '%env(IMGPROXY_KEY)%'
            $salt: '%env(IMGPROXY_SALT)%'
            $bucket: '%app.images_bucket%'

    App\Catalog\Infrastructure\Search\ElasticsearchClientFactory:
        arguments:
            $url: '%env(ELASTICSEARCH_URL)%'
            $connectTimeout: '%app.search.connect_timeout%'

    app.search.client:
        class: Elastic\Elasticsearch\Client
        factory: ['@App\Catalog\Infrastructure\Search\ElasticsearchClientFactory', 'create']
        arguments: ['%app.search.request_timeout%']

    app.search.long_request_client:
        class: Elastic\Elasticsearch\Client
        factory: ['@App\Catalog\Infrastructure\Search\ElasticsearchClientFactory', 'create']
        arguments: ['%app.search.long_request_timeout%']

    App\Catalog\Infrastructure\Search\ProductIndexDefinition:
        arguments:
            $shards: '%app.search.shards%'
            $replicas: '%app.search.replicas%'

    App\Catalog\Infrastructure\Search\ElasticsearchSearchIndexMaintenance:
        arguments:
            $client: '@app.search.client'
            $longRequestClient: '@app.search.long_request_client'
            $alias: '%app.search.alias%'

    App\Catalog\Infrastructure\Search\ElasticsearchProductIndexer:
        arguments:
            $client: '@app.search.client'
            $alias: '%app.search.alias%'

    App\Catalog\Infrastructure\Search\ElasticsearchProductSearch:
        arguments:
            $client: '@app.search.client'
            $alias: '%app.search.alias%'

    App\Catalog\Infrastructure\Persistence\Doctrine\PostgresSearchIndexRebuildLock:
        arguments:
            $alias: '%app.search.alias%'

    # A key source that cannot be read is a 503, not a 401 (see the class).
    app.security.shop_token_handler:
        class: App\Shared\Infrastructure\Security\KeySourceOutageTokenHandler
        decorates: security.access_token_handler.shop
        arguments: ['@.inner']
    app.security.admin_token_handler:
        class: App\Shared\Infrastructure\Security\KeySourceOutageTokenHandler
        decorates: security.access_token_handler.admin
        arguments: ['@.inner']

    # Health probes of the dashboard. Each service is reached at the address containers use among themselves.
    App\Shared\Infrastructure\Health\Probe\RedisProbe:
        arguments:
            $host: '%env(REDIS_HOST)%'
    App\Shared\Infrastructure\Health\Probe\ElasticsearchProbe:
        arguments:
            $baseUrl: '%env(ELASTICSEARCH_URL)%'
    App\Shared\Infrastructure\Health\Probe\RabbitMqProbe:
        arguments:
            $baseUrl: '%env(RABBITMQ_MANAGEMENT_URL)%'
            $user: '%env(RABBITMQ_USER)%'
            $password: '%env(RABBITMQ_DEFAULT_PASS)%'
    App\Shared\Infrastructure\Health\Probe\KeycloakProbe:
        arguments:
            $baseUrl: '%env(KEYCLOAK_MANAGEMENT_URL)%'
    App\Shared\Infrastructure\Health\Probe\GarageProbe:
        arguments:
            $baseUrl: '%env(GARAGE_ADMIN_URL)%'
    App\Shared\Infrastructure\Health\Probe\ImgproxyProbe:
        arguments:
            $baseUrl: '%env(IMGPROXY_INTERNAL_URL)%'
    App\Shared\Infrastructure\Health\Probe\MailpitProbe:
        arguments:
            $baseUrl: '%env(MAILPIT_INTERNAL_URL)%'

    App\Backoffice\Infrastructure\MessagingStatisticsAdapter:
        arguments:
            $managementUrl: '%env(RABBITMQ_MANAGEMENT_URL)%'
            $user: '%env(RABBITMQ_USER)%'
            $password: '%env(RABBITMQ_DEFAULT_PASS)%'
            $vhost: '%app.rabbitmq.vhost%'

    App\Backoffice\Application\Port\CatalogStatisticsProvider: '@App\Backoffice\Infrastructure\QueryBusCatalogStatisticsProvider'
    App\Backoffice\Application\Port\SystemHealth: '@App\Backoffice\Infrastructure\ProbingSystemHealth'
    App\Backoffice\Application\Port\MessagingStatistics: '@App\Backoffice\Infrastructure\MessagingStatisticsAdapter'
    App\Catalog\Application\Port\ProductImageStorage: '@App\Catalog\Infrastructure\Image\FlysystemProductImageStorage'
    App\Catalog\Application\Port\ImageUrlGenerator: '@App\Catalog\Infrastructure\Image\ImgproxyUrlGenerator'
    App\Catalog\Application\Port\ProductSearchSource: '@App\Catalog\Infrastructure\Persistence\Doctrine\DbalProductSearchSource'
    App\Catalog\Application\Port\ProductIndexer: '@App\Catalog\Infrastructure\Search\ElasticsearchProductIndexer'
    App\Catalog\Application\Port\ProductSearch: '@App\Catalog\Infrastructure\Search\ElasticsearchProductSearch'
    App\Catalog\Application\Port\SearchIndexMaintenance: '@App\Catalog\Infrastructure\Search\ElasticsearchSearchIndexMaintenance'
    App\Catalog\Application\Port\SearchIndexRebuildLock: '@App\Catalog\Infrastructure\Persistence\Doctrine\PostgresSearchIndexRebuildLock'
    App\Catalog\Application\Port\CatalogReset: '@App\Catalog\Infrastructure\Demo\DbalCatalogReset'
    App\Catalog\Application\Port\DemoCatalogSource: '@App\Catalog\Infrastructure\Demo\YamlDemoCatalogSource'
    App\Shared\Domain\Event\DomainEventPublisher: '@App\Shared\Infrastructure\Messaging\MessengerDomainEventPublisher'

when@test: &test
    parameters:
        # Integration tests use their own bucket, like the `_test` database.
        app.images_bucket: 'product-images-test'
        # Test indexes are prefixed with test_, the alias is recreated by `make -C apps/api init-test`.
        app.search.alias: test_products
        # The `events` transport of the tests runs on its own vhost (config/packages/test_messaging/messenger.yaml).
        app.rabbitmq.vhost: test

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Tests\Support\:
            resource: '../tests/Support/'

        # Unused by application code yet; public so the integration tests can fetch them.
        App\Catalog\Application\Port\ProductImageStorage:
            alias: App\Catalog\Infrastructure\Image\FlysystemProductImageStorage
            public: true
        App\Catalog\Application\Port\ImageUrlGenerator:
            alias: App\Catalog\Infrastructure\Image\ImgproxyUrlGenerator
            public: true
        App\Shared\Domain\Event\DomainEventPublisher:
            alias: App\Shared\Infrastructure\Messaging\MessengerDomainEventPublisher
            public: true
        test.product_images.storage:
            alias: product_images.storage
            public: true
        # Tests switch the search backend (a temporary index, a failing stub) through this service.
        App\Tests\Support\SwitchableProductSearch:
            public: true
        App\Catalog\Application\Port\ProductSearch: '@App\Tests\Support\SwitchableProductSearch'
        App\Catalog\Application\Port\ProductSearchSource:
            alias: App\Catalog\Infrastructure\Persistence\Doctrine\DbalProductSearchSource
            public: true
        App\Catalog\Application\Port\SearchIndexMaintenance:
            alias: App\Catalog\Infrastructure\Search\ElasticsearchSearchIndexMaintenance
            public: true
        App\Catalog\Application\Port\SearchIndexRebuildLock:
            alias: App\Catalog\Infrastructure\Persistence\Doctrine\PostgresSearchIndexRebuildLock
            public: true
        test.App\Catalog\Infrastructure\Search\ElasticsearchClientFactory:
            alias: App\Catalog\Infrastructure\Search\ElasticsearchClientFactory
            public: true
        test.App\Catalog\Application\Search\ProductSearchIndexRebuilder:
            alias: App\Catalog\Application\Search\ProductSearchIndexRebuilder
            public: true
        # Public (and so never inlined), so a test can replace them with a spy or an in-memory source through
        # the container. They repeat the production definitions.
        App\Catalog\Infrastructure\Search\ElasticsearchProductIndexer:
            public: true
            arguments:
                $client: '@app.search.client'
                $alias: '%app.search.alias%'
        App\Catalog\Infrastructure\Persistence\Doctrine\DbalProductSearchSource:
            public: true
        # Fetched by the tests of the dashboard; the provider can be replaced by a stub that fails.
        App\Backoffice\Application\Port\CatalogStatisticsProvider:
            alias: App\Backoffice\Infrastructure\QueryBusCatalogStatisticsProvider
            public: true
        App\Backoffice\Application\Port\MessagingStatistics:
            alias: App\Backoffice\Infrastructure\MessagingStatisticsAdapter
            public: true
        # The probes are fetched one by one by ProbesTest.
        test.App\Shared\Infrastructure\Health\Probe\PostgresProbe:
            alias: App\Shared\Infrastructure\Health\Probe\PostgresProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\RedisProbe:
            alias: App\Shared\Infrastructure\Health\Probe\RedisProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\ElasticsearchProbe:
            alias: App\Shared\Infrastructure\Health\Probe\ElasticsearchProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\RabbitMqProbe:
            alias: App\Shared\Infrastructure\Health\Probe\RabbitMqProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\KeycloakProbe:
            alias: App\Shared\Infrastructure\Health\Probe\KeycloakProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\GarageProbe:
            alias: App\Shared\Infrastructure\Health\Probe\GarageProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\ImgproxyProbe:
            alias: App\Shared\Infrastructure\Health\Probe\ImgproxyProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\MailpitProbe:
            alias: App\Shared\Infrastructure\Health\Probe\MailpitProbe
            public: true
        App\Tests\Support\StatementCounter:
            public: true
            tags: ['doctrine.middleware']

when@test_messaging: *test
