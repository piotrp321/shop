parameters:
    app.images_bucket: '%env(IMAGES_BUCKET)%'
    app.imgproxy_public_url: '%env(IMGPROXY_PUBLIC_URL)%'
    # The rules of an uploaded original: the upload in Catalog and the photo pool of the demo data (DemoData) share them.
    app.image_upload.max_bytes: 67108864 # 64 MB
    app.image_upload.max_pixels: 50000000 # 50 MP
    # Seconds between the attempts of storefront:cache:purge-all (5 per layer).
    app.storefront_cache.retry_delay: 5.0
    # Search index (spec: "Indeks Elasticsearch"). The application reads and writes through the alias.
    app.search.alias: products
    app.search.replicas: 0
    # The refresh interval of an index that exists and of a new one once it is filled: SEARCH_REFRESH_INTERVAL of the
    # environment, 1s without it; a whole number with ms or s (ProductIndexDefinition refuses another value). setup
    # sets it on the index of the alias without a rebuild.
    env(SEARCH_REFRESH_INTERVAL): '1s'
    app.search.refresh_interval: '%env(SEARCH_REFRESH_INTERVAL)%'
    # Keycloak realms: tokens carry the public URL as issuer, keys are discovered through the internal URL
    # (the trailing slash is needed, discovery paths are resolved relative to it).
    app.oidc.backoffice.issuer: '%env(KEYCLOAK_PUBLIC_URL)%/realms/backoffice'
    app.oidc.backoffice.discovery_url: '%env(KEYCLOAK_INTERNAL_URL)%/realms/backoffice/'
    app.oidc.shop.issuer: '%env(KEYCLOAK_PUBLIC_URL)%/realms/shop'
    app.oidc.shop.discovery_url: '%env(KEYCLOAK_INTERNAL_URL)%/realms/shop/'
    # Vhost of the `events` transport, whose queues the dashboard lists (the tests use their own, see below).
    app.rabbitmq.vhost: '%env(RABBITMQ_VHOST)%'
    # A queue of the database stands when its oldest ready message waits longer than this many seconds: the dashboard shows
    # it and app:messaging:check (the CronJob queue-check) fails (docs/features/async-reliability/spec.md, W7).
    app.messaging.stalled_after_seconds: 600
    # `redeliver_timeout` in seconds of every Doctrine transport the statistics report (the DSNs in messenger.yaml; a test
    # compares them): a message handed to a worker is ready again only after it, so the age of a queue counts it from then.
    app.messaging.redeliver_timeouts:
        outbox: 300
        scheduled: 300
        payment_simulator: 300
        promotions: 300
        jobs: 300
    # ordering:expire-overdue cancels a new order only this many seconds after its expiry (the deadline and the window of the
    # webhooks), so the delayed ExpireUnpaidOrder handles the usual case (docs/features/async-reliability/spec.md, W5).
    app.ordering.expiry_grace_seconds: 600
    # Products per bulk request in catalog:reindex (overridden by --batch-size).
    app.search.batch_size: 500
    # The client never retries; timeouts are in seconds.
    app.search.connect_timeout: 1.0
    # Search, count, single writes and alias operations.
    app.search.request_timeout: 2.0
    # Bulk writes, index creation and refresh.
    app.search.long_request_timeout: 30.0
    # Sitemap of the products (spec: docs/features/seo/spec.md): products per chunk, and the most rows that reading one
    # chunk takes from the database (drafts count).
    app.sitemap.chunk_size: 10000
    app.sitemap.row_limit: 50000
    # Products per batch of the chain that reindexes a category subtree (ReindexCategoryBatchHandler).
    app.catalog.category_reindex_batch_size: 500
    # Sampling of the traces without SENTRY_TRACES_SAMPLE_RATE (config/packages/sentry.yaml).
    app.sentry.traces_sample_rate: '0'
    # Keycloak of the steps of the demo data accounts without DEMO_DATA_KEYCLOAK_URL (KeycloakAdminFactory).
    app.demo_data.keycloak_url: 'http://keycloak:8080'
    # Limits of time of the requests of those steps to Keycloak (seconds). A `partialImport` of a batch of 2000 accounts is
    # one transaction of Keycloak and answers nothing until it ends: on the k3d cluster with the resources of prod (500m
    # CPU) and 4 batches at once it outlasted the 5 s of the shared client. Idle: the longest silence of one request, so
    # the whole batch (measured at tens of seconds there) fits with a margin. Total: the longest of one request, so a
    # Keycloak that hangs still fails the step.
    app.demo_data.keycloak_idle_timeout: 120
    app.demo_data.keycloak_max_duration: 300

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    app.s3_client:
        class: AsyncAws\S3\S3Client
        arguments:
            -
                endpoint: '%env(GARAGE_S3_ENDPOINT)%'
                region: garage
                pathStyleEndpoint: 'true'
                accessKeyId: '%env(GARAGE_ACCESS_KEY_ID)%'
                accessKeySecret: '%env(GARAGE_SECRET_ACCESS_KEY)%'

    # The private R2 bucket of the demo photo pool (DemoData, read only): the bucket is in the path, R2 takes the region `auto`.
    # The client has its own HTTP client (not the shared one, which gives every request 5 s in all: the archive of the pool
    # is about 1.6 GB) and no logger: the shared client and the client of AsyncAws log the whole URL of a request, and that holds
    # the endpoint and the bucket of the private pool, which must not reach a log or Sentry.
    app.demo_photos_http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        autowire: false
        autoconfigure: false
        arguments:
            -
                # No limit of the whole request; a request that gets no data for a minute fails.
                timeout: 60
                max_duration: 0

    # The admin API of Keycloak for the steps of the accounts of the demo data: not the shared client, which gives every
    # request 5 s in all, and no logger of requests. The limits are the parameters above.
    app.demo_data_keycloak_http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        autowire: false
        autoconfigure: false
        arguments:
            -
                timeout: '%app.demo_data.keycloak_idle_timeout%'
                max_duration: '%app.demo_data.keycloak_max_duration%'

    App\DemoData\Accounts\KeycloakAdminFactory:
        arguments:
            $http: '@app.demo_data_keycloak_http_client'

    app.demo_photos_s3_client:
        class: AsyncAws\S3\S3Client
        autowire: false
        autoconfigure: false
        arguments:
            $configuration:
                endpoint: '%env(DEMO_PHOTOS_ENDPOINT)%'
                region: '%env(DEMO_PHOTOS_REGION)%'
                pathStyleEndpoint: 'true'
                accessKeyId: '%env(DEMO_PHOTOS_ACCESS_KEY_ID)%'
                accessKeySecret: '%env(DEMO_PHOTOS_SECRET_ACCESS_KEY)%'
            $credentialProvider: null
            $httpClient: '@app.demo_photos_http_client'
            $logger: null

    App\Catalog\Infrastructure\Image\FlysystemProductImageStorage:
        arguments:
            $filesystem: '@product_images.storage'
            $maxBytes: '%app.image_upload.max_bytes%'
            $maxPixels: '%app.image_upload.max_pixels%'

    App\Catalog\Infrastructure\Image\ImgproxyUrlGenerator:
        arguments:
            $publicUrl: '%app.imgproxy_public_url%'
            $key: '%env(IMGPROXY_KEY)%'
            $salt: '%env(IMGPROXY_SALT)%'
            $bucket: '%app.images_bucket%'

    App\Catalog\Infrastructure\Search\ElasticsearchClientFactory:
        arguments:
            $url: '%env(ELASTICSEARCH_URL)%'
            $connectTimeout: '%app.search.connect_timeout%'

    app.search.client:
        class: Elastic\Elasticsearch\Client
        factory: ['@App\Catalog\Infrastructure\Search\ElasticsearchClientFactory', 'create']
        arguments: ['%app.search.request_timeout%']

    app.search.long_request_client:
        class: Elastic\Elasticsearch\Client
        factory: ['@App\Catalog\Infrastructure\Search\ElasticsearchClientFactory', 'create']
        arguments: ['%app.search.long_request_timeout%']

    App\Catalog\Infrastructure\Search\ProductIndexDefinition:
        arguments:
            $replicas: '%app.search.replicas%'
            $refreshInterval: '%app.search.refresh_interval%'

    App\Catalog\Infrastructure\Search\ElasticsearchSearchIndexMaintenance:
        arguments:
            $client: '@app.search.client'
            $longRequestClient: '@app.search.long_request_client'
            $alias: '%app.search.alias%'
            $logger: '@monolog.logger.search_rebuild'

    # Logs the progress of the rebuild on the same channel as the retries of ElasticsearchSearchIndexMaintenance.
    App\Catalog\Application\Search\ProductSearchIndexRebuilder:
        arguments:
            $logger: '@monolog.logger.search_rebuild'

    App\Catalog\Infrastructure\Search\ElasticsearchProductIndexer:
        arguments:
            $client: '@app.search.client'
            $alias: '%app.search.alias%'

    App\Catalog\Infrastructure\Search\ElasticsearchProductSearch:
        arguments:
            $client: '@app.search.client'
            $alias: '%app.search.alias%'

    App\Catalog\Infrastructure\Persistence\Doctrine\PostgresSearchIndexRebuildLock:
        arguments:
            $alias: '%app.search.alias%'

    App\Catalog\Application\Query\ListSitemapProductChunksHandler:
        arguments:
            $chunkSize: '%app.sitemap.chunk_size%'

    App\Catalog\Infrastructure\Persistence\Doctrine\DbalSitemapProductSource:
        arguments:
            $rowLimit: '%app.sitemap.row_limit%'

    App\Catalog\Application\Command\ReindexCategoryBatchHandler:
        arguments:
            $batchSize: '%app.catalog.category_reindex_batch_size%'

    App\Catalog\Infrastructure\Search\ElasticsearchSubtreeProductIds:
        arguments:
            $client: '@app.search.client'
            $alias: '%app.search.alias%'

    App\Catalog\Infrastructure\Persistence\Doctrine\CachingSitemapProductSource:
        arguments:
            $inner: '@App\Catalog\Infrastructure\Persistence\Doctrine\DbalSitemapProductSource'

    # The logs of a token that cannot be verified (an error each, from the caller's input) go to the `security` channel,
    # which neither the Sentry handler nor the `fingers_crossed` buffer of `prod` takes (config/packages/monolog.yaml;
    # spec docs/features/abuse-limits/spec.md, D13). The abstract parent of the handlers of both firewalls, as the
    # security bundle defines it, with the logger changed (arguments 0-3 are set by each firewall).
    security.access_token_handler.oidc:
        class: Symfony\Component\Security\Http\AccessToken\Oidc\OidcTokenHandler
        abstract: true
        arguments:
            - ~
            - ~
            - ~
            - ~
            - 'sub'
            - '@monolog.logger.security'
            - '@clock'

    # A key source that cannot be read is a 503, not a 401 (see the class).
    app.security.shop_token_handler:
        class: App\Shared\Infrastructure\Security\KeySourceOutageTokenHandler
        decorates: security.access_token_handler.shop
        arguments: ['@.inner']
    app.security.admin_token_handler:
        class: App\Shared\Infrastructure\Security\KeySourceOutageTokenHandler
        decorates: security.access_token_handler.admin
        arguments: ['@.inner']

    # AMQP sends fail when the broker cannot route the message (see the class).
    App\Shared\Infrastructure\Messaging\RoutedAmqpTransportFactory:
        decorates: messenger.transport.amqp.factory
        arguments: ['@.inner']

    # Health probes of the dashboard. Each service is reached at the address containers use among themselves.
    App\Shared\Infrastructure\Health\Probe\RedisProbe:
        arguments:
            $host: '%env(REDIS_HOST)%'
    App\Shared\Infrastructure\Health\Probe\ElasticsearchProbe:
        arguments:
            $baseUrl: '%env(ELASTICSEARCH_URL)%'
    App\Shared\Infrastructure\Health\Probe\RabbitMqProbe:
        arguments:
            $baseUrl: '%env(RABBITMQ_MANAGEMENT_URL)%'
            $user: '%env(RABBITMQ_USER)%'
            $password: '%env(RABBITMQ_DEFAULT_PASS)%'
    App\Shared\Infrastructure\Health\Probe\KeycloakProbe:
        arguments:
            $baseUrl: '%env(KEYCLOAK_MANAGEMENT_URL)%'
    App\Shared\Infrastructure\Health\Probe\GarageProbe:
        arguments:
            $baseUrl: '%env(GARAGE_ADMIN_URL)%'
    App\Shared\Infrastructure\Health\Probe\ImgproxyProbe:
        arguments:
            $baseUrl: '%env(IMGPROXY_INTERNAL_URL)%'
    App\Shared\Infrastructure\Health\Probe\MailpitProbe:
        arguments:
            $baseUrl: '%env(MAILPIT_INTERNAL_URL)%'

    # The caches of the store: Varnish (purge by xkey) and the ISR pages (revalidation), see the class.
    App\Shared\Infrastructure\Http\Cache\HttpStorefrontCache:
        arguments: &storefront_cache_arguments
            $varnishUrl: '%env(VARNISH_URL)%'
            $purgeSecret: '%env(VARNISH_PURGE_SECRET)%'
            $storeUrl: '%env(STORE_INTERNAL_URL)%'
            $revalidateSecret: '%env(STORE_REVALIDATE_SECRET)%'
    App\Shared\Infrastructure\Http\Cache\StorefrontCache: '@App\Shared\Infrastructure\Http\Cache\HttpStorefrontCache'

    # The payment simulator: two fake providers inside the API (src/PaymentSimulator), reached over HTTP like real ones.
    # Its secrets (PAYMENT_DEMO_*, .env.local, written by infra/scripts/init-env.sh) and addresses (compose file) are
    # injected by #[Autowire(env: …)] where they are used.
    # The client of every call between the shop and the simulator (the adapters of Payment and the webhook delivery
    # of the simulator). The tests replace it with a client that forwards the requests to another kernel.
    app.payment_http_client:
        alias: http_client

    App\Backoffice\Infrastructure\MessagingStatisticsAdapter:
        arguments:
            $managementUrl: '%env(RABBITMQ_MANAGEMENT_URL)%'
            $user: '%env(RABBITMQ_USER)%'
            $password: '%env(RABBITMQ_DEFAULT_PASS)%'
            $vhost: '%app.rabbitmq.vhost%'
            $redeliverTimeouts: '%app.messaging.redeliver_timeouts%'

    App\Backoffice\Application\Query\MessagingHealth:
        arguments:
            $stalledAfterSeconds: '%app.messaging.stalled_after_seconds%'

    App\Backoffice\Application\Port\CatalogStatistics: '@App\Backoffice\Infrastructure\QueryBusCatalogStatistics'
    App\Backoffice\Application\Port\SystemHealth: '@App\Backoffice\Infrastructure\ProbingSystemHealth'
    App\Backoffice\Application\Port\MessagingStatistics: '@App\Backoffice\Infrastructure\MessagingStatisticsAdapter'
    App\Catalog\Application\Port\ProductImageStorage: '@App\Catalog\Infrastructure\Image\FlysystemProductImageStorage'
    App\Catalog\Application\Port\ImageUrlGenerator: '@App\Catalog\Infrastructure\Image\ImgproxyUrlGenerator'
    App\Catalog\Application\Port\ProductSearchSource: '@App\Catalog\Infrastructure\Persistence\Doctrine\DbalProductSearchSource'
    App\Catalog\Application\Port\ProductIndexer: '@App\Catalog\Infrastructure\Search\ElasticsearchProductIndexer'
    App\Catalog\Application\Port\ProductSearch: '@App\Catalog\Infrastructure\Search\ElasticsearchProductSearch'
    App\Catalog\Application\Port\SearchIndexMaintenance: '@App\Catalog\Infrastructure\Search\ElasticsearchSearchIndexMaintenance'
    App\Catalog\Application\Port\SearchIndexRebuildLock: '@App\Catalog\Infrastructure\Persistence\Doctrine\PostgresSearchIndexRebuildLock'
    App\Catalog\Application\Port\CatalogReset: '@App\Catalog\Infrastructure\Demo\DbalCatalogReset'
    App\Catalog\Application\Port\DemoCatalogSource: '@App\Catalog\Infrastructure\Demo\YamlDemoCatalogSource'
    App\Catalog\Application\Port\BackofficeProductSource: '@App\Catalog\Infrastructure\Persistence\Doctrine\DbalBackofficeProductSource'
    App\Catalog\Application\Port\ProductEditSource: '@App\Catalog\Infrastructure\Persistence\Doctrine\DbalProductEditSource'
    App\Catalog\Application\Port\VariantSource: '@App\Catalog\Infrastructure\Persistence\Doctrine\DbalVariantSource'
    App\Catalog\Application\Port\ProductDetailsSource: '@App\Catalog\Infrastructure\Persistence\Doctrine\DbalProductDetailsSource'
    App\Catalog\Application\Port\SitemapProductSource: '@App\Catalog\Infrastructure\Persistence\Doctrine\CachingSitemapProductSource'
    App\Catalog\Application\Port\CategoryReindexRuns: '@App\Catalog\Infrastructure\Persistence\Doctrine\DbalCategoryReindexRuns'
    App\Catalog\Application\Port\CategoryReindexBatches: '@App\Catalog\Infrastructure\Messaging\MessengerCategoryReindexBatches'
    App\Catalog\Application\Port\SubtreeProductIds: '@App\Catalog\Infrastructure\Search\ElasticsearchSubtreeProductIds'
    App\Catalog\Application\Port\StorefrontCatalogCache: '@App\Catalog\Infrastructure\Storefront\HttpStorefrontCatalogCache'
    App\Shared\Domain\Event\DomainEventPublisher: '@App\Shared\Infrastructure\Messaging\MessengerDomainEventPublisher'

    # The callbacks of the Sentry SDK (config/packages/sentry.yaml): the correlation tag and the filter of the events.
    app.sentry.before_send:
        class: Closure
        factory: [Closure, fromCallable]
        arguments: [['@App\Shared\Infrastructure\Observability\SentryEventProcessor', beforeSend]]
    app.sentry.before_send_transaction:
        class: Closure
        factory: [Closure, fromCallable]
        arguments: [['@App\Shared\Infrastructure\Observability\SentryEventProcessor', beforeSendTransaction]]
    app.sentry.before_breadcrumb:
        class: Closure
        factory: [Closure, fromCallable]
        arguments: [['@App\Shared\Infrastructure\Observability\SentryEventProcessor', beforeBreadcrumb]]

    # The handler of the explicit logs of the application (config/packages/monolog.yaml): from `error` up, never a log
    # with an exception in its context (it goes through the channel of its source), and without the context of the log.
    app.sentry.monolog_handler:
        class: Sentry\Monolog\LogToSentryIssueHandler
        arguments:
            $hub: '@Sentry\State\HubInterface'
            $level: error
            $fillExtraContext: false

    # The console listener of the bundle reports the uncaught exceptions of the commands only when the error listener of
    # the bundle is on, which it is not (ServerErrorReporter reports the HTTP errors): the same definition, reporting.
    Sentry\SentryBundle\EventListener\ConsoleListener:
        arguments: ['@Sentry\State\HubInterface', true]
        tags:
            - { name: kernel.event_listener, event: console.command, method: handleConsoleCommandEvent, priority: 128 }
            - { name: kernel.event_listener, event: console.terminate, method: handleConsoleTerminateEvent, priority: -64 }
            - { name: kernel.event_listener, event: console.error, method: handleConsoleErrorEvent, priority: -64 }

when@test: &test
    parameters:
        # Integration tests use their own bucket, like the `_test` database.
        app.images_bucket: 'product-images-test'
        # Test indexes are prefixed with test_, the alias is recreated by `make -C apps/api init-test`.
        app.search.alias: test_products
        # The `events` transport of the tests runs on its own vhost (config/packages/test_messaging/messenger.yaml).
        app.rabbitmq.vhost: test
        # The tests of storefront:cache:purge-all do not wait between the attempts.
        app.storefront_cache.retry_delay: 0.0
        # Small enough for the tests to cut chunks of a few products and to pass the row limit.
        app.sitemap.chunk_size: 3
        app.sitemap.row_limit: 10
        # A subtree of a few products takes several batches of the reindexing chain.
        app.catalog.category_reindex_batch_size: 2

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Tests\Support\:
            resource: '../tests/Support/'

        # Unused by application code yet; public so the integration tests can fetch them.
        App\Catalog\Application\Port\ProductImageStorage:
            alias: App\Catalog\Infrastructure\Image\FlysystemProductImageStorage
            public: true
        App\Catalog\Application\Port\ImageUrlGenerator:
            alias: App\Catalog\Infrastructure\Image\ImgproxyUrlGenerator
            public: true
        App\Shared\Domain\Event\DomainEventPublisher:
            alias: App\Shared\Infrastructure\Messaging\MessengerDomainEventPublisher
            public: true
        test.product_images.storage:
            alias: product_images.storage
            public: true
        # Public, so a test can check how the private bucket of the photo pool is wired.
        test.demo_photos.storage:
            alias: demo_photos.storage
            public: true
        # Public, so a test can check the limits of time of the client that reaches the admin API of Keycloak.
        test.App\DemoData\Accounts\KeycloakAdminFactory:
            alias: App\DemoData\Accounts\KeycloakAdminFactory
            public: true
        # Public, so a test can set the identifier like the request subscriber does and read it back.
        App\Shared\Infrastructure\Observability\CorrelationId:
            public: true
        # Keeps every log record of every channel, so a test can check what was logged (the handlers of the test drop it).
        App\Tests\Support\RecordingLogProcessor:
            public: true
            tags: ['monolog.processor']
        # Public, so a test can read the limits the photo pool is checked with (the ones of the Catalog upload).
        App\DemoData\Photo\PhotoRules:
            public: true
        # Public (and so never inlined), so a functional test can replace the image storage with a stub that is down.
        App\Catalog\Infrastructure\Image\FlysystemProductImageStorage:
            public: true
            arguments:
                $filesystem: '@product_images.storage'
                $maxBytes: '%app.image_upload.max_bytes%'
                $maxPixels: '%app.image_upload.max_pixels%'
        # Tests switch the search backend (a temporary index, a failing stub) through this service.
        App\Tests\Support\SwitchableProductSearch:
            public: true
        App\Catalog\Application\Port\ProductSearch: '@App\Tests\Support\SwitchableProductSearch'
        App\Catalog\Application\Port\ProductSearchSource:
            alias: App\Catalog\Infrastructure\Persistence\Doctrine\DbalProductSearchSource
            public: true
        App\Catalog\Application\Port\SearchIndexMaintenance:
            alias: App\Catalog\Infrastructure\Search\ElasticsearchSearchIndexMaintenance
            public: true
        App\Catalog\Application\Port\SearchIndexRebuildLock:
            alias: App\Catalog\Infrastructure\Persistence\Doctrine\PostgresSearchIndexRebuildLock
            public: true
        test.App\Catalog\Infrastructure\Search\ElasticsearchClientFactory:
            alias: App\Catalog\Infrastructure\Search\ElasticsearchClientFactory
            public: true
        test.App\Catalog\Application\Search\ProductSearchIndexRebuilder:
            alias: App\Catalog\Application\Search\ProductSearchIndexRebuilder
            public: true
        # Public (and so never inlined), so a test can replace them with a spy or an in-memory source through
        # the container. They repeat the production definitions.
        App\Catalog\Infrastructure\Search\ElasticsearchProductIndexer:
            public: true
            arguments:
                $client: '@app.search.client'
                $alias: '%app.search.alias%'
        App\Catalog\Infrastructure\Persistence\Doctrine\DbalProductSearchSource:
            public: true
        App\Catalog\Infrastructure\Search\ElasticsearchSubtreeProductIds:
            public: true
            arguments:
                $client: '@app.search.client'
                $alias: '%app.search.alias%'
        App\Cart\Infrastructure\Catalog\QueryBusProductOfferFacts:
            public: true
        # Public (and so never inlined), so a test can point it at an HTTP double or replace it with a spy.
        App\Shared\Infrastructure\Http\Cache\HttpStorefrontCache:
            public: true
            arguments: *storefront_cache_arguments
        # Replaced by a test that makes the database fail under the statistics query.
        App\Catalog\Infrastructure\Persistence\Doctrine\DoctrineProductRepository:
            public: true
        # Fetched by the tests of the dashboard.
        App\Backoffice\Application\Port\MessagingStatistics:
            alias: App\Backoffice\Infrastructure\MessagingStatisticsAdapter
            public: true
        App\Backoffice\Application\Port\SystemHealth:
            alias: App\Backoffice\Infrastructure\ProbingSystemHealth
            public: true
        # The probes are fetched one by one by ProbesTest.
        test.App\Shared\Infrastructure\Health\Probe\PostgresProbe:
            alias: App\Shared\Infrastructure\Health\Probe\PostgresProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\RedisProbe:
            alias: App\Shared\Infrastructure\Health\Probe\RedisProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\ElasticsearchProbe:
            alias: App\Shared\Infrastructure\Health\Probe\ElasticsearchProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\RabbitMqProbe:
            alias: App\Shared\Infrastructure\Health\Probe\RabbitMqProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\KeycloakProbe:
            alias: App\Shared\Infrastructure\Health\Probe\KeycloakProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\GarageProbe:
            alias: App\Shared\Infrastructure\Health\Probe\GarageProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\ImgproxyProbe:
            alias: App\Shared\Infrastructure\Health\Probe\ImgproxyProbe
            public: true
        test.App\Shared\Infrastructure\Health\Probe\MailpitProbe:
            alias: App\Shared\Infrastructure\Health\Probe\MailpitProbe
            public: true
        App\Tests\Support\StatementCounter:
            public: true
            tags: ['doctrine.middleware']
        # The calls between the shop and the simulator stay in the process (see the class); public, so a test can
        # replace it with a client of constant responses.
        app.payment_http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            factory: ['App\Tests\Support\KernelForwardingHttpClient', 'create']
            arguments: ['%kernel.environment%']
            public: true
        # Replaced by the delivery tests with a builder that signs with the secrets of the shared test vector.
        App\PaymentSimulator\SimulatedWebhooks:
            public: true
        # Public (and so never inlined), so a test can replace it with one whose write of the copy fails.
        App\Shared\Infrastructure\Messaging\KeepFailedMessageListener:
            public: true
        # The HTTP client of the Sentry SDK in the tests (config/packages/sentry.yaml): keeps what would be sent.
        App\Tests\Functional\Shared\Sentry\RecordingSentryHttpClient:
            public: true
        # The transport of the shared HTTP client (below the decorator of Sentry, priority -15): keeps the headers of
        # the requests that leave the API.
        App\Tests\Functional\Shared\Sentry\RecordingOutgoingHttpClient:
            public: true
            decorates: http_client.transport
            decoration_priority: 0

