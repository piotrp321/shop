; Shared by the base and dev images.
memory_limit = 256M
expose_php = Off
date.timezone = UTC
opcache.enable = 1
opcache.enable_cli = 0
; Image upload (decision K8): a file up to 64 MB, one per request, in a body up to 70 MB. The controller of the upload
; refuses a Content-Length above post_max_size itself, because PHP drops the whole body then.
upload_max_filesize = 64M
post_max_size = 70M
