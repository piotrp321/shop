; Shared by all images.
memory_limit = 256M
expose_php = Off
date.timezone = UTC
opcache.enable = 1
opcache.enable_cli = 0
; Image upload (decision K8): a file up to 64 MB, one per request, in a body up to 70 MB. The controller of the upload
; refuses a Content-Length above post_max_size itself, because PHP drops the whole body then.
upload_max_filesize = 64M
post_max_size = 70M
; PHP prints its own warnings into the response body by default (there is no php.ini in the image). The warning of a
; request above post_max_size comes at request startup, before the application runs: displayed, it would send the status
; 200 and the headers first and break the 422 of the upload; logged, the request reaches the application.
display_errors = Off
log_errors = On
