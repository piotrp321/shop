; Production image only. The code in the image never changes, so opcache does not stat the files.
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; The arguments of the functions are not kept in the traces of the exceptions: no personal data in the frames that a
; log or Sentry gets (docs/features/sentry/spec.md, D4).
zend.exception_ignore_args = On
