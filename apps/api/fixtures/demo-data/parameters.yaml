# The parameter sets of the product types of the generator (product-types.yaml names one per type). A product draws 3 to 6
# of the parameters of its set, each with one value of its pool, and shows them in the order of the set.
#
# A set maps the name of a parameter (1-60 characters) to the pool of its values (1-200 characters each). A set has at
# least six parameters and a parameter at least three different values. The name of a parameter is never the name of an
# axis of the variants of a type that uses the set (Kolor, Rozmiar, Długość, Pojemność, ...), and neither the names nor the
# values depend on a product: they have to be true of every type of the set.
