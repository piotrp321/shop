# The short descriptions of the products: "<name>: <feature>, <feature> i <feature>. <closing>", where the features come
# from the product type and the closing from the department of the product. The closings are phrases without a verb or
# an adjective that would have to agree with the name of the product (a product may be singular or plural, of any
# gender).
closings:
  bieganie:
    - "Na treningi i do startów w zawodach."
    - "Na krótkie rozbiegania i długie dystanse."
    - "Dla biegaczy, którzy liczą na stały poziom komfortu."
    - "Do każdego planu treningowego."
  rower:
    - "Na szosę, szuter i leśne ścieżki."
    - "Do codziennych dojazdów i weekendowych wypraw."
    - "Na zmienną pogodę i długie trasy."
    - "Dla rowerzystów, którzy cenią niezawodność."
  turystyka:
    - "Na zmienną pogodę w górach."
    - "Na weekendowe wyjścia i wielodniowe wyprawy."
    - "Do trudnego terenu, przy niewielkiej masie w plecaku."
    - "Na szlak o każdej porze roku."
  sporty-zimowe:
    - "Na mroźne dni i długie zjazdy."
    - "Na stok, na skitury i na zimowy spacer."
    - "Do niskich temperatur i intensywnego wysiłku."
    - "Na całą zimę."
  fitness:
    - "Do treningów w domu i na siłowni."
    - "Dla początkujących i zaawansowanych."
    - "Do regularnych ćwiczeń."
    - "Na każdy dzień treningowy."
  sporty-wodne:
    - "Do użytku w wodzie słodkiej i słonej."
    - "Na jezioro, rzekę i basen."
    - "Dla wodniaków, którzy lubią mieć sprzęt pod kontrolą."
    - "Na sezon nad wodą."
  sporty-druzynowe:
    - "Do gry na treningach i w meczach."
    - "Na cały sezon rozgrywek."
    - "Dla drużyn szkolnych i klubowych."
    - "Na boisko i na halę."

# The sentences the long descriptions are built from, by department: every description takes three or four of them (a
# fixed number, without repeats, in a random order), joined with the features of the type ("Cechy: ..."). A sentence is
# true of every product of the department and needs no agreement with its name (no pronoun, no adjective or verb that
# refers to the product), and it is 80 to 115 characters long, so a description of two or three paragraphs is 300 to
# 600 characters whatever sentences are drawn (DictionariesTest).
sentences:
  bieganie:
    - "Dobór sprzętu do biegania zależy od dystansu, tempa i nawierzchni, na której trenujesz najczęściej."
    - "Przed zakupem sprawdź tabelę rozmiarów i zwróć uwagę na wygodę podczas długich treningów."
    - "Regularny trening wymaga wyposażenia, które sprawdza się zarówno w upalne dni, jak i w chłodne poranki."
    - "Biegacze doceniają rozwiązania, które ograniczają otarcia i pozwalają skupić się na rytmie kroku."
    - "Rozsądny plan treningowy zaczyna się od dobrze dobranego wyposażenia i stopniowego zwiększania dystansu."
    - "Niezależnie od poziomu zaawansowania warto przetestować sprzęt na krótszej trasie przed startem w zawodach."
    - "Wybór odpowiedniego modelu ułatwiają opinie innych biegaczy oraz porady doświadczonych trenerów."
    - "Wieczorne i poranne treningi wymagają wyposażenia, które zwiększa widoczność i poprawia bezpieczeństwo."
    - "Dbałość o sprzęt po każdym treningu wydłuża żywotność wyposażenia na wiele sezonów."
  rower:
    - "Dobry sprzęt rowerowy poprawia komfort jazdy zarówno w mieście, jak i na długich wycieczkach za miastem."
    - "Przed zakupem sprawdź zgodność z rowerem, a w razie wątpliwości poproś o poradę serwis rowerowy."
    - "Regularny przegląd i smarowanie podzespołów pozwalają jeździć bezpiecznie przez cały sezon."
    - "Rowerzyści cenią rozwiązania, które można zamontować bez specjalistycznych narzędzi i długiej konfiguracji."
    - "Przy wyborze liczą się masa, trwałość i sposób, w jaki sprzęt zachowuje się na nierównej nawierzchni."
    - "Niezależnie od stylu jazdy, rekreacyjnego czy sportowego, warto postawić na sprawdzone rozwiązania."
    - "Zimą i jesienią szczególnie przydają się elementy, które zwiększają widoczność na drodze."
    - "Wymiary i standardy montażu podajemy w opisie, więc łatwo ocenić, czy sprzęt pasuje do Twojego roweru."
    - "Dbałość o czystość i konserwację napędu wydłuża żywotność całego roweru na wiele sezonów."
  turystyka:
    - "Wyprawa w góry zaczyna się od przemyślanego wyposażenia, w którym liczy się każdy gram i każdy centymetr."
    - "Pogoda na szlaku potrafi zmienić się w kilka minut, dlatego warto mieć sprzęt na różne warunki."
    - "Przed wyjściem na szlak sprawdź prognozę, zaplanuj trasę i spakuj wyłącznie rzeczy, które naprawdę się przydadzą."
    - "Doświadczeni turyści wybierają rozwiązania lekkie, trwałe i łatwe do naprawienia w terenie."
    - "Dobór wyposażenia warto dostosować do długości wyprawy, pory roku i trudności wybranej trasy."
    - "Weekendowe wyjścia i wielodniowe trekkingi wymagają sprzętu, na którym można polegać o każdej porze dnia."
    - "Wygoda na szlaku zależy od dopasowania do sylwetki, dlatego warto sprawdzić rozmiar przed wyjazdem."
    - "Po powrocie z gór sprzęt trzeba wysuszyć i wyczyścić, aby posłużył na kolejne wyprawy."
    - "Rzetelnie zaplanowany ekwipunek pozwala cieszyć się widokami zamiast martwić się o drobiazgi."
  sporty-zimowe:
    - "Zimowy sprzęt powinien chronić przed wychłodzeniem, wiatrem i wilgocią podczas wielu godzin na stoku."
    - "Przed sezonem sprawdź dopasowanie i stan wyposażenia, aby uniknąć niespodzianek na pierwszym zjeździe."
    - "Niskie temperatury obciążają materiały i mocowania, dlatego liczy się solidne wykonanie każdego szczegółu."
    - "Narciarze i snowboardziści doceniają rozwiązania, które pozwalają szybko wyregulować sprzęt na stoku."
    - "Poziom zaawansowania i styl jazdy mają wpływ na wybór wyposażenia, więc warto uwzględnić oba czynniki przy zakupie."
    - "Po każdym dniu na śniegu wyposażenie należy osuszyć, a metalowe elementy zabezpieczyć przed korozją."
    - "Warstwowy ubiór pozwala dostosować się do zmian pogody, od mroźnego poranka po słoneczne południe."
    - "Bezpieczeństwo na stoku zaczyna się od sprawnego sprzętu oraz rozsądnej oceny własnych umiejętności."
    - "Dobrze dobrane wyposażenie pozwala cieszyć się zimą bez zmęczenia i przemarznięcia."
  fitness:
    - "Regularne ćwiczenia przynoszą efekty tylko wtedy, gdy sprzęt jest dopasowany do poziomu zaawansowania."
    - "Plan treningowy warto zacząć od lżejszych obciążeń i stopniowo zwiększać intensywność ćwiczeń."
    - "Trening w domu wymaga niewielkiej przestrzeni, a dobrze dobrane akcesoria potrafią zastąpić całą siłownię."
    - "Przed zakupem sprawdź wymiary i maksymalne obciążenie, aby wyposażenie bezpiecznie służyło przez lata."
    - "Osoby początkujące najlepiej zaczynają od podstawowych ćwiczeń pod okiem doświadczonego trenera."
    - "Zróżnicowany trening łączy ćwiczenia siłowe, wytrzymałościowe i rozciąganie, dlatego liczy się wszechstronność."
    - "Po treningu warto zadbać o regenerację, odpowiednie nawodnienie i porcję pełnowartościowego białka."
    - "Pielęgnacja sprzętu po każdym treningu zapobiega zniszczeniom i utrzymuje higienę ćwiczeń."
    - "Systematyczność i dobrze dobrane wyposażenie otwierają najkrótszą drogę do zamierzonych wyników."
  sporty-wodne:
    - "Czas nad wodą wymaga wyposażenia odpornego na słońce, wilgoć oraz działanie chloru lub soli."
    - "Przed sezonem sprawdź stan sprzętu, zwłaszcza uszczelnienia, zapięcia i elementy związane z bezpieczeństwem."
    - "Bezpieczeństwo na wodzie zaczyna się od odpowiedniej asekuracji i znajomości warunków panujących na akwenie."
    - "Po każdym wyjściu na wodę wyposażenie warto przepłukać słodką wodą i wysuszyć w przewiewnym, zacienionym miejscu."
    - "Początkujący najlepiej zaczynają od spokojnych akwenów i sprzętu, który wybacza drobne błędy techniki."
    - "Dopasowanie do sylwetki ma duże znaczenie, bo luźne elementy utrudniają pływanie i wiosłowanie."
    - "Latem liczy się ochrona przed promieniowaniem, zimą natomiast ocieplenie i szybkie schnięcie materiałów."
    - "Trening w basenie i nad jeziorem wymaga innych rozwiązań, dlatego warto określić swoje potrzeby."
    - "Odpowiednio przechowywany sprzęt wodny zachowuje właściwości przez wiele sezonów."
  sporty-druzynowe:
    - "Gra zespołowa wymaga wyposażenia, które wytrzymuje intensywny trening i emocje meczowe."
    - "Przed sezonem sprawdź rozmiary i stan wyposażenia całej drużyny, aby uniknąć niespodzianek przed pierwszym meczem."
    - "Wybór sprzętu warto dopasować do wieku zawodników, poziomu rozgrywek i rodzaju nawierzchni boiska."
    - "Trenerzy cenią rozwiązania, które łatwo wyczyścić, szybko rozpakować i sprawnie przygotować do zajęć."
    - "Dobre przygotowanie do meczu zaczyna się od rozgrzewki i sprawdzenia, czy wyposażenie jest kompletne."
    - "Szkolne zajęcia i treningi klubowe wymagają sprzętu bezpiecznego, odpornego na zużycie i wygodnego w użyciu."
    - "Po każdym spotkaniu wyposażenie warto wywietrzyć i wyczyścić, aby posłużyło przez cały sezon rozgrywek."
    - "Spójne wyposażenie drużyny buduje poczucie wspólnoty i ułatwia rozpoznawanie zawodników na boisku."
    - "Regularne treningi techniczne przynoszą efekty szybciej, gdy zawodnicy mają zaufanie do swojego sprzętu."
