# Demo gross prices in grosze (5490 = 54,90 zł) for the demo variants of fixtures/catalog.yaml, loaded by
# `pricing:seed-demo` (`make seed`). Keys are patterns of variant keys, `<product slug>/<label slug>`
# (`<product slug>/standard` for the default variant): `*` matches any run of characters, also `/`, and the pattern
# has to match the whole key.
#
# Patterns are checked in the order of this file and the FIRST one that matches wins, so a specific pattern goes
# before a general one. A demo variant that no pattern matches stops the seed with an error and nothing is changed.

