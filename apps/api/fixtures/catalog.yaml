templates:
  - category: "bieganie/buty/szosowe"
    productType: "Buty szosowe"
    taxClass: standard
    description:
      - "Buty przeznaczone do biegania po twardych nawierzchniach: asfalcie, kostce i utwardzonych ścieżkach. Amortyzacja w podeszwie ogranicza obciążenie stawów podczas treningu, a przewiewna cholewka odprowadza ciepło ze stopy."
      - "Sznurowanie obejmuje całą cholewkę i pozwala dopasować but do kształtu stopy. Wkładka jest wyjmowana, więc można ją zastąpić wkładką ortopedyczną. Rozmiary podajemy w skali europejskiej."
    parameters:
      - {name: "Przeznaczenie", value: "Bieganie po nawierzchniach twardych"}
      - {name: "Cholewka", value: "Siatka tekstylna"}
    brands:
      - "Tarvik"
      - "Norvane"
    models:
      - name: "Asfalt 200"
        description: "Lekkie buty na asfalt i ścieżki rowerowe z amortyzującą piankową podeszwą i oddychającą siatką."
        parameters:
          - {name: "Amortyzacja", value: "Standardowa, piankowa podeszwa"}
          - {name: "Waga buta w rozmiarze 42", value: "230 g"}
          - {name: "Drop", value: "10 mm"}
      - name: "Dystans 400"
        description: "Buty na długie wybiegania z podwyższoną amortyzacją i stabilną piętą."
        parameters:
          - {name: "Amortyzacja", value: "Podwyższona"}
          - {name: "Stabilizacja", value: "Stabilna pięta"}
          - {name: "Waga buta w rozmiarze 42", value: "290 g"}
          - {name: "Drop", value: "8 mm"}
      - name: "Tempo 600"
        description: "Dynamiczne buty startowe o niskiej masie i sprężystej podeszwie na szybkie treningi."
        parameters:
          - {name: "Amortyzacja", value: "Sprężysta, o niskiej masie"}
          - {name: "Waga buta w rozmiarze 42", value: "205 g"}
          - {name: "Drop", value: "6 mm"}
    variantAxes: ["Kolor", "Rozmiar"]
    axisValues:
      - ["czarne", "niebieskie"]
      - ["40", "41", "42", "43", "44", "45", "46"]
    images:
      - file: "runner-country-road.jpg"
        alt: "Biegacz na wiejskiej drodze wśród łąk"
      - file: "runner-road-fitz-roy.jpg"
        alt: "Biegacz na pustej asfaltowej drodze z górami w tle"
  - category: "bieganie/buty/trailowe"
    productType: "Buty trailowe"
    taxClass: standard
    description:
      - "Buty na szlaki i ścieżki w terenie: kamienie, korzenie, błoto i podbiegi. Bieżnik z głębokimi klockami trzyma na luźnym podłożu, a wzmocniony przód chroni palce przed uderzeniami."
      - "Cholewka jest odporna na ocieranie i szybko schnie po przemoczeniu. Sznurowanie pozostaje stabilne na zbiegach, a język jest przyszyty do cholewki, żeby do środka nie wpadał piach."
    parameters:
      - {name: "Przeznaczenie", value: "Bieganie w terenie i po górskich szlakach"}
      - {name: "Cholewka", value: "Siatka odporna na ocieranie"}
    brands:
      - "Tarvik"
      - "Norvane"
    models:
      - name: "Grań 300"
        description: "Buty w teren z agresywnym bieżnikiem i wzmocnioną osłoną czubka przed kamieniami."
        parameters:
          - {name: "Ochrona czubka", value: "Wzmocniona osłona przed kamieniami"}
          - {name: "Bieżnik", value: "Agresywny, klocki 5 mm"}
          - {name: "Waga buta w rozmiarze 42", value: "290 g"}
      - name: "Hala 500"
        description: "Wszechstronne buty na szlaki górskie z membraną odporną na wilgoć i przyczepną podeszwą."
        parameters:
          - {name: "Membrana", value: "Odporna na wilgoć"}
          - {name: "Bieżnik", value: "Przyczepny, klocki 4 mm"}
          - {name: "Waga buta w rozmiarze 42", value: "320 g"}
      - name: "Przełęcz 700"
        description: "Stabilne buty na długie górskie dystanse z ochroną śródstopia."
        parameters:
          - {name: "Ochrona śródstopia", value: "Wkładka stabilizująca"}
          - {name: "Bieżnik", value: "Głęboki, klocki 6 mm"}
          - {name: "Waga buta w rozmiarze 42", value: "350 g"}
    variantAxes: ["Kolor", "Rozmiar"]
    axisValues:
      - ["czarne", "zielone", "pomarańczowe"]
      - ["40", "41", "42", "43", "44", "45", "46"]
    images:
      - file: "trail-runner-mountain-ridge-italy.jpg"
        alt: "Biegacz na górskim szlaku w słoneczny dzień"
      - file: "runner-mountain-edge-trail.jpg"
        alt: "Biegacz na ścieżce wzdłuż górskiej grani"
  - category: "bieganie/odziez"
    additionalCategories:
      - "sporty-zimowe/odziez"
    productType: "Kurtka biegowa"
    taxClass: standard
    description:
      - "Kurtka na bieganie w chłodne i wietrzne dni. Krój przy ciele nie trzepocze podczas ruchu, a ściągacze przy rękawach i dole ograniczają przewiewy."
      - "Zamek na całej długości ułatwia regulację wentylacji w trakcie biegu. Odblaskowe detale zwiększają widoczność o zmierzchu. Kurtkę można prać w pralce w temperaturze 30 stopni."
    parameters:
      - {name: "Przeznaczenie", value: "Bieganie w zmiennej pogodzie"}
      - {name: "Zamek", value: "Na całej długości"}
      - {name: "Pranie", value: "W pralce, 30 stopni"}
    brands:
      - "Tarvik"
      - "Norvane"
    models:
      - name: "Wiatr 100"
        description: "Ultralekka wiatrówka składana do kieszeni, chroni przed wiatrem i lekkim deszczem."
        parameters:
          - {name: "Materiał", value: "Cienka tkanina wiatroszczelna"}
          - {name: "Składanie", value: "Do kieszeni kurtki"}
          - {name: "Ochrona", value: "Wiatr i lekki deszcz"}
      - name: "Mgła 300"
        description: "Kurtka softshell z elastycznymi panelami i odblaskowymi elementami na zimne poranki."
        parameters:
          - {name: "Materiał", value: "Softshell z elastycznymi panelami"}
          - {name: "Odblaski", value: "Elementy odblaskowe z przodu i z tyłu"}
          - {name: "Ochrona", value: "Chłód i wiatr"}
    variantAxes: ["Kolor", "Rozmiar"]
    axisValues:
      - ["czarna", "granatowa", "limonkowa"]
      - ["S", "M", "L", "XL"]
    images:
      - file: "runner-mountain-edge-trail.jpg"
        alt: "Biegacz na ścieżce wzdłuż górskiej grani"
      - file: "trail-runner-mountain-ridge-italy.jpg"
        alt: "Biegacz na górskim szlaku w słoneczny dzień"
  - category: "bieganie/odziez"
    productType: "Koszulka biegowa"
    taxClass: standard
    description:
      - "Koszulka do biegania i innych sportów wytrzymałościowych. Materiał odprowadza pot od skóry i szybko schnie, dzięki czemu koszulka nie przylega do ciała podczas długiego wysiłku."
      - "Płaskie szwy ograniczają ocieranie na plecach i ramionach. Krój jest sportowy, lekko dopasowany. Koszulkę można prać w pralce w temperaturze 30 stopni."
    parameters:
      - {name: "Przeznaczenie", value: "Bieganie i trening wytrzymałościowy"}
      - {name: "Krój", value: "Sportowy, lekko dopasowany"}
    brands:
      - "Tarvik"
      - "Norvane"
    models:
      - name: "Oddech 100"
        description: "Szybkoschnąca koszulka z siatkowymi wstawkami wentylacyjnymi i płaskimi szwami."
        parameters:
          - {name: "Materiał", value: "Poliester z siatkowymi wstawkami"}
          - {name: "Wentylacja", value: "Siatkowe wstawki"}
          - {name: "Gramatura", value: "100 g/m2"}
      - name: "Merino 200"
        description: "Koszulka z mieszanki wełny merino, neutralna zapachowo i przyjemna w dotyku."
        parameters:
          - {name: "Materiał", value: "Mieszanka wełny merino"}
          - {name: "Właściwości", value: "Neutralna zapachowo"}
          - {name: "Gramatura", value: "200 g/m2"}
    variantAxes: ["Kolor", "Rozmiar"]
    axisValues:
      - ["biała", "szara", "turkusowa"]
      - ["S", "M", "L", "XL"]
    images:
      - file: "runner-country-road.jpg"
        alt: "Biegacz na wiejskiej drodze wśród łąk"
      - file: "runner-road-fitz-roy.jpg"
        alt: "Biegacz na pustej asfaltowej drodze z górami w tle"
  - category: "bieganie/akcesoria"
    additionalCategories:
      - "turystyka/plecaki"
    productType: "Plecak biegowy"
    taxClass: standard
    description:
      - "Plecak biegowy przylega do pleców i nie podskakuje podczas biegu. Szerokie szelki w kształcie kamizelki rozkładają ciężar na klatce piersiowej i ramionach, a mostek spina je na przodzie."
      - "Kieszenie na szelkach pozwalają sięgnąć po żele, telefon lub bidon bez zdejmowania plecaka. Materiał jest lekki i odporny na ocieranie. Plecak należy prać ręcznie."
    parameters:
      - {name: "Rodzaj", value: "Plecak-kamizelka na bieganie"}
      - {name: "Mostek piersiowy", value: "Regulowany"}
    brands:
      - "Tarvik"
      - "Norvane"
    models:
      - name: "Sprint 8"
        description: "Plecak biegowy 8 l z kieszeniami na bidony miękkie i dostępem do telefonu bez zdejmowania."
        parameters:
          - {name: "Pojemność", value: "8 l"}
          - {name: "Bidony", value: "Kieszenie na miękkie bidony"}
          - {name: "Telefon", value: "Kieszeń dostępna bez zdejmowania plecaka"}
      - name: "Ultra 12"
        description: "Plecak biegowy 12 l na zawody górskie, z uchwytem na kijki i systemem nawadniającym."
        parameters:
          - {name: "Pojemność", value: "12 l"}
          - {name: "Kijki", value: "Uchwyt na kijki"}
          - {name: "Nawadnianie", value: "Przystosowany do systemu nawadniającego"}
    variantAxes: ["Kolor"]
    axisValues:
      - ["czarny", "pomarańczowy"]
    images:
      - file: "trail-runner-mountain-ridge-italy.jpg"
        alt: "Biegacz na górskim szlaku w słoneczny dzień"
      - file: "runner-mountain-edge-trail.jpg"
        alt: "Biegacz na ścieżce wzdłuż górskiej grani"
  - category: "bieganie/akcesoria"
    additionalCategories:
      - "turystyka/biwak"
    productType: "Latarka czołowa"
    taxClass: standard
    description:
      - "Latarka czołowa daje wolne ręce podczas biegania, wędrówki i pracy po zmroku. Obudowa jest odporna na zachlapanie, a elastyczna opaska z regulacją mocuje latarkę stabilnie na głowie."
      - "Przełącznik pozwala wybrać poziom jasności. Latarkę ładuje się przez port USB, więc nie trzeba kupować baterii. Latarka waży niewiele i nie obciąża głowy."
    parameters:
      - {name: "Zasilanie", value: "Akumulator ładowany przez USB"}
      - {name: "Mocowanie", value: "Elastyczna opaska na głowę"}
      - {name: "Wodoszczelność", value: "Odporna na zachlapanie"}
    brands:
      - "Tarvik"
      - "Hallen"
    models:
      - name: "Świt 250"
        description: "Lekka czołówka 250 lumenów z regulowanym kątem świecenia i ładowaniem przez USB."
        parameters:
          - {name: "Strumień świetlny", value: "250 lm"}
          - {name: "Regulacja", value: "Regulowany kąt świecenia"}
      - name: "Zmierzch 600"
        description: "Czołówka 600 lumenów z trybem czerwonym i akumulatorem na do 40 godzin pracy."
        parameters:
          - {name: "Strumień świetlny", value: "600 lm"}
          - {name: "Tryby", value: "Dodatkowo światło czerwone"}
          - {name: "Czas pracy", value: "Do 40 godzin"}
    variantAxes: ["Kolor"]
    axisValues:
      - ["czarna", "szara"]
    images:
      - file: "headlamp-hiker-chamonix.jpg"
        alt: "Samotny turysta z czołówką na górskiej ścieżce o zmierzchu"
  - category: "rower/rowery/gorskie"
    productType: "Rower górski"
    taxClass: standard
    description:
      - "Rower górski do jazdy po leśnych drogach, szlakach i ścieżkach w terenie. Amortyzowany widelec i szerokie opony z agresywnym bieżnikiem poprawiają przyczepność i komfort na nierównym podłożu."
      - "Hamulce tarczowe zapewniają skuteczne hamowanie także w deszczu i na stromych zjazdach. Szeroka kierownica i krótki mostek dają pewną kontrolę nad rowerem."
      - "Rower wysyłamy częściowo zmontowany. Przed pierwszą jazdą trzeba sprawdzić ciśnienie w oponach, dokręcić pedały i ustawić siodło na odpowiedniej wysokości."
    parameters:
      - {name: "Przeznaczenie", value: "Jazda terenowa"}
      - {name: "Rama", value: "Aluminiowa"}
      - {name: "Hamulce", value: "Tarczowe"}
    brands:
      - "Zolvia"
      - "Dravik"
    models:
      - name: "Singiel 29"
        description: "Hardtail z aluminiową ramą, amortyzatorem 120 mm i napędem 1x12."
        parameters:
          - {name: "Rozmiar kół", value: "29 cali"}
          - {name: "Amortyzacja", value: "Hardtail, amortyzator przedni o skoku 120 mm"}
          - {name: "Napęd", value: "1x12"}
      - name: "Trawers 29"
        description: "Rower trailowy z amortyzowanym tyłem 130 mm i hydraulicznymi hamulcami tarczowymi."
        parameters:
          - {name: "Rozmiar kół", value: "29 cali"}
          - {name: "Amortyzacja", value: "Pełna, skok tylnego amortyzatora 130 mm"}
          - {name: "Hamulce", value: "Hydrauliczne tarczowe"}
      - name: "Zjazd 27,5"
        description: "Zwrotny rower enduro z amortyzacją 150 mm do agresywnej jazdy po szlakach."
        parameters:
          - {name: "Rozmiar kół", value: "27,5 cala"}
          - {name: "Amortyzacja", value: "Pełna, skok 150 mm"}
          - {name: "Zastosowanie", value: "Enduro i agresywna jazda po szlakach"}
    variantAxes: ["Kolor", "Rozmiar ramy"]
    axisValues:
      - ["grafitowy", "zielony", "pomarańczowy"]
      - ["S", "M", "L"]
    images:
      - file: "bikepacker-rocky-trail-pines.jpg"
        alt: "Rowerzysta z sakwami bikepackingowymi na skalistym szlaku wśród sosen"
      - file: "bikepacking-bike-mountain-trail.jpg"
        alt: "Rower z sakwami bikepackingowymi na górskim szlaku"
      - file: "cyclist-dirt-road-british-columbia.jpg"
        alt: "Rowerzysta w niebieskiej kurtce na szutrowej drodze w górach"
  - category: "rower/rowery/elektryczne"
    productType: "Rower elektryczny"
    taxClass: standard
    description:
      - "Rower elektryczny wspomaga pedałowanie silnikiem, gdy jedziesz pod górę lub pod wiatr. Wspomaganie działa, dopóki pedałujesz, i wyłącza się powyżej 25 km/h."
      - "Akumulator można wypiąć z ramy i naładować w domu. Wyświetlacz pozwala wybrać poziom wspomagania. Zasięg zależy od masy rowerzysty, ukształtowania terenu i wybranego poziomu wspomagania."
    parameters:
      - {name: "Silnik", value: "Centralny, w osi korby"}
      - {name: "Wspomaganie do", value: "25 km/h"}
      - {name: "Akumulator", value: "Wypinany z ramy"}
    brands:
      - "Zolvia"
      - "Dravik"
    models:
      - name: "Dolina E"
        description: "Rower trekkingowy z silnikiem centralnym 85 Nm i akumulatorem o zasięgu do 110 km."
        parameters:
          - {name: "Przeznaczenie", value: "Trekking"}
          - {name: "Moment obrotowy", value: "85 Nm"}
          - {name: "Zasięg", value: "Do 110 km"}
        fullDescription:
          - "Dolina E to rower trekkingowy z silnikiem centralnym o momencie obrotowym 85 Nm, który ułatwia podjazdy z bagażem i jazdę pod wiatr. Akumulator pozwala przejechać do 110 km na jednym ładowaniu, zależnie od poziomu wspomagania i terenu."
          - "Rama z niskim przekrokiem daje wygodną pozycję i ułatwia wsiadanie. Rower ma błotniki, bagażnik i oświetlenie zasilane z akumulatora, więc od razu nadaje się do codziennych dojazdów i wycieczek."
          - "Akumulator wypina się z ramy i można go naładować w mieszkaniu. Wyświetlacz na kierownicy pokazuje prędkość, poziom naładowania i wybrany tryb wspomagania."
      - name: "Szlak E"
        description: "Elektryczny rower górski z silnikiem w osi korby i amortyzowanym przodem."
        parameters:
          - {name: "Przeznaczenie", value: "Jazda górska"}
          - {name: "Amortyzacja", value: "Amortyzowany przedni widelec"}
          - {name: "Zasięg", value: "Do 80 km"}
    variantAxes: ["Kolor", "Rozmiar ramy"]
    axisValues:
      - ["czarny", "grafitowy", "niebieski"]
      - ["S", "M", "L"]
    images:
      - file: "cyclist-path-canadian-rockies.jpg"
        alt: "Rowerzysta na ścieżce w pobliżu gór"
      - file: "cyclist-mountain-road-romania.jpg"
        alt: "Rowerzysta na drodze z widokiem na góry"
  - category: "rower/kaski-i-ochraniacze"
    productType: "Kask rowerowy"
    taxClass: standard
    description:
      - "Kask chroni głowę podczas upadku. Zewnętrzna skorupa łączy się z pianką, która pochłania energię uderzenia."
      - "Wewnątrz znajdują się wymienne wkładki, które można prać. Pasek podbródkowy ma szybkie zapięcie. Kask należy wymienić po każdym mocnym uderzeniu, nawet jeśli nie widać uszkodzeń."
    parameters:
      - {name: "Konstrukcja", value: "Skorupa z pianką EPS"}
      - {name: "Pasek", value: "Z szybkim zapięciem"}
      - {name: "Norma", value: "EN 1078"}
    brands:
      - "Zolvia"
