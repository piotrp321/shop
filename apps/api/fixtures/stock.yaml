# Demo stock (physical units on the shelf) for the demo variants of fixtures/catalog.yaml, loaded by
# `inventory:seed-demo` (`make seed`). Keys are patterns of variant keys, `<product slug>/<label slug>`
# (`<product slug>/standard` for the default variant): `*` matches any run of characters, also `/`, and the pattern
# has to match the whole key.
#
# Patterns are checked in the order of this file and the FIRST one that matches wins, so a specific pattern goes
# before a general one. A demo variant that no pattern matches stops the seed with an error and nothing is changed.
# A value is 0 to 100 000; 0 stores a stock record with nothing on the shelf (out of stock), 1-5 is low stock.
#
# Most variants have 20-50 units, a few have 2-3 and a few have 0. The e2e tests rely on:
# - kajak-turystyczny-vilmar-rzeka-2 (Kajak turystyczny Vilmar Rzeka 2): every variant has none; the receipt test
#   receives into the variant "zielony" (stock-receipt.spec.ts);
# - hantle-regulowane-* (Hantle regulowane): the default variant of every product has stock (price-change.spec.ts
#   changes the price of one of them);
# - buty-szosowe-tarvik-asfalt-200 (Buty szosowe Tarvik Asfalt 200): the sizes 41 and 42 in "czarne" are in stock (the
#   test of two sizes in the cart).
# - buty-trailowe-*-hala-500 (50 units, the most of the demo) and buty-szosowe-*-tempo-600 (45): the checkout tests
#   order Buty trailowe Norvane Hala 500 (guest, 2 units, checkout-guest.spec.ts) and Buty szosowe Norvane Tempo 600
#   (Jan, 1 unit, checkout-customer.spec.ts). Their reservations stay until PAYMENT, so every run takes units for good
#   until `make seed`; the tests choose the first variant that can still be bought.
# Products with variants both in and out of stock: kajak-turystyczny-dravik-rzeka-2, narty-skiturowe-stavro-gran-95.

