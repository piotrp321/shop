{{- /*
The CronJob load (docs/features/demo-scale/spec.md, "Sprawdzenie po generowaniu"): k6 runs load/smoke.js against the services of the
cluster (the store at http://store:3000 and the API at http://api, as in compose) once the demo data is generated; the measurement of
the load can run the other scripts of load/ in the same way. The CronJob never runs by itself (suspend: true): its Jobs are created
from it (kubectl create job --from=cronjob/load), so a run uses the scripts and the image of the deployed revision. The scripts are the
ConfigMap load-scripts (configmaps.yaml) mounted at /load, with the subdirectory lib. The settings are those of load/lib/config.js: the
origin of the writes is the public address of the store (the BFF of the store refuses another Origin). The pod has no secret and no
token of the Kubernetes API. A failed run is reported, never repeated; the checkout of a run stays in the data as an order of
load-<n>@example.com. An init container waits until the API answers from the pod (the NetworkPolicy shop-closed refuses the first
connections of a new pod).
*/ -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: load
  labels:
    {{- include "shop.labels" (dict "root" . "name" "load") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "1" | nindent 4 }}
spec:
  # Never by itself: the Jobs are created from it. The schedule is required, not used.
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.load.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "shop.labels" (dict "root" . "name" "load") | nindent 12 }}
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          # The Job of make generate runs while the shop is closed: under the NetworkPolicy shop-closed the first connections of a
          # pod that was just created are refused (until the controller of the policies knows its address), and k6 asks the API
          # once in its setup. k6 starts once the API answered from this pod. It is no wait-for-<workload> of the waves of Argo CD:
          # the CronJob is suspended, so a synchronization starts no pod of it; the limit is activeDeadlineSeconds of the Job.
          initContainers:
            - name: api-reachable
              image: {{ .Values.images.alpine }}
              command: ["sh", "-c", "until wget -T 3 -qO /dev/null http://api/health; do echo 'load: waiting until the API answers from this pod'; sleep 1; done"]
              resources:
                {{- include "shop.resources" (dict "root" . "resources" "job") | nindent 16 }}
          containers:
            - name: load
              image: {{ .Values.images.k6 }}
              args: ["run", "--quiet", "/load/smoke.js"]
              env:
                - name: STORE_URL
                  value: http://store:3000
                - name: API_URL
                  value: http://api
                - name: STORE_ORIGIN
                  value: {{ include "shop.url" (dict "root" . "sub" "") }}
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: scripts
                  mountPath: /load
                  readOnly: true
              resources:
                {{- include "shop.resources" (dict "root" . "resources" "k6") | nindent 16 }}
          volumes:
            - name: scripts
              configMap:
                name: load-scripts
                items:
                  {{- range $path := include "shop.load.scripts" . | fromJsonArray }}
                  - key: {{ replace "/" "__" $path }}
                    path: {{ $path }}
                  {{- end }}
