{{- /* Traefik middlewares referenced by the annotations of the ingresses (<namespace>-<name>@kubernetescrd). */ -}}
{{- if .Values.ipAllowList.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ipallowlist
  labels:
    {{- include "shop.labels" (dict "root" . "name" "ipallowlist") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "-2" | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml (required "ipAllowList.sourceRange is required when ipAllowList.enabled" .Values.ipAllowList.sourceRange) | nindent 6 }}
{{- end }}
{{- if .Values.noindex }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: noindex
  labels:
    {{- include "shop.labels" (dict "root" . "name" "noindex") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "-2" | nindent 4 }}
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
{{- end }}
{{- if .Values.ingress.tls }}
---
# HSTS (spec: docs/features/hardening/spec.md, D10): only where the ingress presents a certificate, for a year, for the host
# alone (no includeSubDomains, no preload).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
  labels:
    {{- include "shop.labels" (dict "root" . "name" "hsts") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "-2" | nindent 4 }}
spec:
  headers:
    stsSeconds: 31536000
{{- end }}
---
# Body limit of the routes that answer JSON (spec: docs/features/abuse-limits/spec.md, L8 and D10): the body is read to the
# end before the backend gets it (a slow body does not hold a thread of the API) and over 1 MiB it is refused with 413.
# The response is buffered too, so the ingresses of pages and RSC never carry it (templates/ingress.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: buffering
  labels:
    {{- include "shop.labels" (dict "root" . "name" "buffering") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "-2" | nindent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: {{ mul 1 1024 1024 }}
---
# The same for the upload of a product photo: 71 MiB, above post_max_size (70M), as in the Caddyfile of the API.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: buffering-upload
  labels:
    {{- include "shop.labels" (dict "root" . "name" "buffering-upload") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "-2" | nindent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: {{ mul 71 1024 1024 }}
