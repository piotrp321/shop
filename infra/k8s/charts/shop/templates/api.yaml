{{- /*
The environment of the API, the workers and the jobs: the one of the compose file with the addresses of this environment.
The secrets come with envFrom (the .env.local of the compose file).
*/ -}}
{{- define "shop.apiEnv" -}}
- name: APP_ENV
  value: prod
# Database connection (not secrets); the password is SHOP_DB_PASSWORD of the secret.
- name: SHOP_DB_HOST
  value: postgres
- name: SHOP_DB_NAME
  value: shop
- name: SHOP_DB_USER
  value: shop
# Public browser-facing URLs. Only the admin origin gets CORS.
- name: ADMIN_URL
  value: {{ include "shop.url" (dict "root" . "sub" "admin") | quote }}
- name: STORE_URL
  value: {{ include "shop.url" (dict "root" . "sub" "") | quote }}
- name: GARAGE_S3_ENDPOINT
  value: http://garage:3900
- name: IMAGES_BUCKET
  value: product-images
- name: IMGPROXY_PUBLIC_URL
  value: {{ include "shop.url" (dict "root" . "sub" "img") | quote }}
- name: RABBITMQ_HOST
  value: rabbitmq
- name: RABBITMQ_USER
  value: shop
- name: RABBITMQ_VHOST
  value: /
- name: ELASTICSEARCH_URL
  value: http://elasticsearch:9200
# The primary shards of a product index that setup and catalog:reindex create (SEARCH_SHARDS of compose). An index that exists
# keeps its own number until make -C infra/k8s reindex builds a new one.
- name: SEARCH_SHARDS
  value: {{ .Values.elasticsearch.shards | quote }}
# The refresh interval of the product index (SEARCH_REFRESH_INTERVAL of compose): setup, which the Job migrate runs, sets it on the
# index that exists, so a change needs no rebuild.
- name: SEARCH_REFRESH_INTERVAL
  value: {{ .Values.elasticsearch.refreshInterval | quote }}
# Keycloak: tokens carry the public URL as issuer, discovery and JWKS are fetched through the internal one.
- name: KEYCLOAK_PUBLIC_URL
  value: {{ include "shop.url" (dict "root" . "sub" "auth") | quote }}
- name: KEYCLOAK_INTERNAL_URL
  value: http://keycloak:8080
# Where the dashboard of the admin panel probes the services.
- name: REDIS_HOST
  value: redis
- name: RABBITMQ_MANAGEMENT_URL
  value: http://rabbitmq:15672
- name: KEYCLOAK_MANAGEMENT_URL
  value: http://keycloak:9000
- name: GARAGE_ADMIN_URL
  value: http://garage:3903
- name: IMGPROXY_INTERNAL_URL
  value: http://imgproxy:8080
- name: MAILPIT_INTERNAL_URL
  value: http://mailpit:8025
# orderMail: the Mailpit of the cluster or Brevo SMTP. Kubernetes puts the login and the key of the Brevo secret into
# MAILER_DSN ($(VAR) refers to the variables defined before it).
# `timeout=10` (seconds, every socket operation, SmtpTimeoutTransportFactory) is the one of compose: it keeps a sending well
# within the lease of its claim.
{{- if eq .Values.orderMail "brevo" }}
- name: BREVO_SMTP_LOGIN
  valueFrom:
    secretKeyRef:
      name: {{ .Values.brevo.secretName }}
      key: BREVO_SMTP_LOGIN
- name: BREVO_SMTP_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ .Values.brevo.secretName }}
      key: BREVO_SMTP_PASSWORD
- name: MAILER_DSN
  value: {{ printf "smtp://$(BREVO_SMTP_LOGIN):$(BREVO_SMTP_PASSWORD)@%s:%v?timeout=10" .Values.brevo.host .Values.brevo.port | quote }}
{{- else }}
- name: MAILER_DSN
  value: smtp://mailpit:1025?timeout=10
{{- end }}
- name: MAILER_FROM
  value: {{ include "shop.mailerFrom" . | quote }}
# The caches of the store invalidated after a price or stock change.
- name: VARNISH_URL
  value: http://varnish
- name: STORE_INTERNAL_URL
  value: http://store:3000
# The payment simulator inside the API: addresses only (the keys and webhook secrets are in the secret).
- name: PAYMENT_PROVIDER_BASE_URL
  value: http://api
- name: PAYMENT_SIMULATOR_PUBLIC_URL
  value: {{ include "shop.url" (dict "root" . "sub" "api") | quote }}
- name: PAYMENT_WEBHOOK_BASE_URL
  value: http://api
{{- /* Sentry of the api, the workers and the jobs: one project, only with a DSN (docs/features/sentry/spec.md, D3). */}}
{{- with include "shop.sentryEnv" (dict "root" . "app" "api") }}
{{ . | trim }}
{{- end }}
{{- end }}

{{/* Waits until the migrations of this revision are applied (the api and the workers never start on an old schema). */}}
{{- define "shop.api.waitMigrations" -}}
- name: wait-for-migrate
  image: {{ include "shop.appImage" (dict "root" . "app" "api") }}
  imagePullPolicy: {{ .Values.image.pullPolicy }}
  command: ["sh", "-c"]
  args:
    - |
      until bin/console doctrine:migrations:up-to-date >/dev/null 2>&1; do
        echo "waiting for the migrations"
        sleep 2
      done
  env:
    {{- include "shop.apiEnv" . | nindent 4 }}
  {{- include "shop.envFromSecret" . | nindent 2 }}
  resources:
    {{- include "shop.resources" (dict "root" . "resources" "job") | nindent 4 }}
{{- end }}

{{- define "shop.api.container" -}}
imagePullPolicy: {{ .Values.image.pullPolicy }}
env:
  {{- include "shop.apiEnv" . | nindent 2 }}
  # The rate limits count by the address of this header (docs/features/hardening/spec.md, D2).
  {{- include "shop.clientIpHeaderEnv" . | nindent 2 }}
{{ include "shop.envFromSecret" . }}
ports:
  - name: http
    containerPort: 80
readinessProbe:
  httpGet:
    path: /health
    port: 80
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 20
{{- end }}

{{/*
The container of a worker: the same command line as the compose file (the transports of one worker, then the limits). A
worker ends by itself after a day or at 192 MB (75% of the memory_limit of PHP), after the message it is handling, with
exit code 0, and the Deployment starts it again. Parameters: root, transports (the list of the transports).
*/}}
{{- define "shop.worker.container" -}}
{{- $command := concat (list "php" "bin/console" "messenger:consume") .transports (list "--time-limit=86400" "--memory-limit=192M") -}}
imagePullPolicy: {{ .root.Values.image.pullPolicy }}
command: {{ toJson $command }}
env:
  {{- include "shop.apiEnv" .root | nindent 2 }}
{{ include "shop.envFromSecret" .root }}
readinessProbe:
  exec:
    command:
      - sh
      - -c
      # Ready once PID 1 is this very consumer: the same command line, up to the last limit.
      - {{ printf "tr '\\0' ' ' < /proc/1/cmdline | grep -q '^%s'" (join " " $command) | quote }}
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
{{- end }}
{{ include "shop.service" (dict "root" . "name" "api" "ports" (list (dict "name" "http" "port" 80))) }}
---
{{ include "shop.deployment" (dict "root" . "name" "api" "wave" "1" "image" (include "shop.appImage" (dict "root" . "app" "api"))
  "initContainers" (include "shop.api.waitMigrations" .)
  "container" (include "shop.api.container" .)) }}
---
{{- /* The events: the relay of the outbox to RabbitMQ (first) and the events of RabbitMQ. The only worker that needs the broker. */}}
{{ include "shop.deployment" (dict "root" . "name" "worker" "wave" "1" "image" (include "shop.appImage" (dict "root" . "app" "api"))
  "initContainers" (print (include "shop.api.waitMigrations" .) "\n" (include "shop.wait" (dict "root" . "name" "rabbitmq" "check" "nc -z -w 2 rabbitmq 5672")))
  "container" (include "shop.worker.container" (dict "root" . "transports" (list "outbox" "events")))) }}
---
{{- /* The commands that wait in Postgres: the webhook deliveries of the payment simulator come before the cancellations of
unpaid orders (the worker starts from the first transport after every message), then the promotion boundaries and the
batches of background jobs. It does not wait for RabbitMQ and does not need it. */}}
{{ include "shop.deployment" (dict "root" . "name" "worker-commands" "resources" "workerCommands" "wave" "1" "image" (include "shop.appImage" (dict "root" . "app" "api"))
  "initContainers" (include "shop.api.waitMigrations" .)
  "container" (include "shop.worker.container" (dict "root" . "transports" (list "payment_simulator" "scheduled" "promotions" "jobs")))) }}
