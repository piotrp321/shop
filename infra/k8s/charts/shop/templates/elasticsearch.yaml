{{- /*
The image built from infra/elasticsearch/Dockerfile (the one compose builds): the Polish analysis plugin is installed
in it at build time, so nothing is downloaded when the pod starts.
*/ -}}
{{- define "shop.elasticsearch.container" -}}
imagePullPolicy: {{ .Values.image.pullPolicy }}
env:
  - name: discovery.type
    value: single-node
  - name: xpack.security.enabled
    value: "false"
  - name: ES_JAVA_OPTS
    value: {{ .Values.elasticsearch.javaOpts | quote }}
ports:
  - name: http
    containerPort: 9200
volumeMounts:
  - name: data
    mountPath: /usr/share/elasticsearch/data
readinessProbe:
  exec:
    command:
      - sh
      - -c
      - "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60
{{- end }}
{{ include "shop.service" (dict "root" . "name" "elasticsearch" "ports" (list (dict "name" "http" "port" 9200))) }}
---
{{ include "shop.statefulset" (dict "root" . "name" "elasticsearch" "wave" "-1" "image" (include "shop.appImage" (dict "root" . "app" "elasticsearch"))
  "claims" (list (dict "name" "data" "size" .Values.storage.elasticsearch))
  "container" (include "shop.elasticsearch.container" .)) }}
