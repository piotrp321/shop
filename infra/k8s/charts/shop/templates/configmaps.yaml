{{- /* The configuration files of the repository (symlinks in files/) and the scripts of the chart. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: varnish-vcl
  labels:
    {{- include "shop.labels" (dict "root" . "name" "varnish") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "-2" | nindent 4 }}
data:
  default.vcl: |
    {{- .Files.Get "files/default.vcl" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  labels:
    {{- include "shop.labels" (dict "root" . "name" "garage") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "-2" | nindent 4 }}
data:
  garage.toml: |
    {{- .Files.Get "files/garage.toml" | nindent 4 }}
  init.sh: |
    {{- .Files.Get "files/garage-init.sh" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "shop.labels" (dict "root" . "name" "postgres") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "-2" | nindent 4 }}
data:
  10-create-databases.sh: |
    {{- .Files.Get "files/10-create-databases.sh" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-scripts
  labels:
    {{- include "shop.labels" (dict "root" . "name" "scripts") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "-2" | nindent 4 }}
data:
  initialize.sh: |
    {{- .Files.Get "files/scripts/initialize.sh" | nindent 4 }}
  keycloak-config.sh: |
    {{- .Files.Get "files/scripts/keycloak-config.sh" | nindent 4 }}
  backup.sh: |
    {{- .Files.Get "files/scripts/backup.sh" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realms
  labels:
    {{- include "shop.labels" (dict "root" . "name" "keycloak") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "-2" | nindent 4 }}
data:
  {{- include "shop.keycloak.realmsData" . | trim | nindent 2 }}
