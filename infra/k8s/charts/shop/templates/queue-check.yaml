{{- /*
The check of the queues of messages (docs/features/async-reliability/spec.md, W7, W9, D4): a CronJob that runs `bin/console app:messaging:check`
in the image and the environment of the API every five minutes. The command reads only the database and ends with a code other than 0 when a
message is in the transport `failed` or a queue stands (its oldest ready message is older than ten minutes); the alert MessagingUnhealthy
(00-alerts.yaml) fires for a failed Job of this CronJob newer than its last success and goes out at the next success. It is in every profile
and never suspended; restore.sh suspends it while it works and brings it back.
*/ -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: queue-check
  labels:
    {{- include "shop.labels" (dict "root" . "name" "queue-check") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "1" | nindent 4 }}
spec:
  schedule: {{ .Values.queueCheck.schedule | quote }}
  timeZone: {{ .Values.queueCheck.timeZone | quote }}
  # One check at a time; a run that could not start within four minutes of its time is skipped (the next one is five minutes later).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A failed check is not retried: the next run is five minutes away and the alert counts the failed Jobs and the next success.
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            {{- include "shop.labels" (dict "root" . "name" "queue-check") | nindent 12 }}
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          containers:
            - name: queue-check
              image: {{ include "shop.appImage" (dict "root" . "app" "api") }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["bin/console", "app:messaging:check"]
              env:
                {{- include "shop.apiEnv" . | nindent 16 }}
              {{- include "shop.envFromSecret" . | nindent 14 }}
              resources:
                {{- include "shop.resources" (dict "root" . "resources" "job") | nindent 18 }}
