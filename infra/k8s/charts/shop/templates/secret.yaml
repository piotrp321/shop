{{- /*
The secret of the environment: one key per line of infra/scripts/init-env.sh (checked by `make check`). In prod the
Secret is not rendered: it is created outside the chart (a SealedSecret) under the same name.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "shop.labels" (dict "root" . "name" "secrets") | nindent 4 }}
  annotations:
    {{- include "shop.wave" "-2" | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.values.POSTGRES_PASSWORD is required" .Values.secrets.values.POSTGRES_PASSWORD | quote }}
  KEYCLOAK_DB_PASSWORD: {{ required "secrets.values.KEYCLOAK_DB_PASSWORD is required" .Values.secrets.values.KEYCLOAK_DB_PASSWORD | quote }}
  SHOP_DB_PASSWORD: {{ required "secrets.values.SHOP_DB_PASSWORD is required" .Values.secrets.values.SHOP_DB_PASSWORD | quote }}
  RABBITMQ_DEFAULT_PASS: {{ required "secrets.values.RABBITMQ_DEFAULT_PASS is required" .Values.secrets.values.RABBITMQ_DEFAULT_PASS | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "secrets.values.KC_BOOTSTRAP_ADMIN_PASSWORD is required" .Values.secrets.values.KC_BOOTSTRAP_ADMIN_PASSWORD | quote }}
  GARAGE_RPC_SECRET: {{ required "secrets.values.GARAGE_RPC_SECRET is required" .Values.secrets.values.GARAGE_RPC_SECRET | quote }}
  GARAGE_ADMIN_TOKEN: {{ required "secrets.values.GARAGE_ADMIN_TOKEN is required" .Values.secrets.values.GARAGE_ADMIN_TOKEN | quote }}
  GARAGE_ACCESS_KEY_ID: {{ required "secrets.values.GARAGE_ACCESS_KEY_ID is required" .Values.secrets.values.GARAGE_ACCESS_KEY_ID | quote }}
  GARAGE_SECRET_ACCESS_KEY: {{ required "secrets.values.GARAGE_SECRET_ACCESS_KEY is required" .Values.secrets.values.GARAGE_SECRET_ACCESS_KEY | quote }}
  IMGPROXY_KEY: {{ required "secrets.values.IMGPROXY_KEY is required" .Values.secrets.values.IMGPROXY_KEY | quote }}
  IMGPROXY_SALT: {{ required "secrets.values.IMGPROXY_SALT is required" .Values.secrets.values.IMGPROXY_SALT | quote }}
  STORE_CLIENT_SECRET: {{ required "secrets.values.STORE_CLIENT_SECRET is required" .Values.secrets.values.STORE_CLIENT_SECRET | quote }}
  STORE_SESSION_SECRET: {{ required "secrets.values.STORE_SESSION_SECRET is required" .Values.secrets.values.STORE_SESSION_SECRET | quote }}
  VARNISH_PURGE_SECRET: {{ required "secrets.values.VARNISH_PURGE_SECRET is required" .Values.secrets.values.VARNISH_PURGE_SECRET | quote }}
  STORE_REVALIDATE_SECRET: {{ required "secrets.values.STORE_REVALIDATE_SECRET is required" .Values.secrets.values.STORE_REVALIDATE_SECRET | quote }}
  PAYMENT_DEMO_TRANSFER_API_KEY: {{ required "secrets.values.PAYMENT_DEMO_TRANSFER_API_KEY is required" .Values.secrets.values.PAYMENT_DEMO_TRANSFER_API_KEY | quote }}
  PAYMENT_DEMO_TRANSFER_WEBHOOK_SECRET: {{ required "secrets.values.PAYMENT_DEMO_TRANSFER_WEBHOOK_SECRET is required" .Values.secrets.values.PAYMENT_DEMO_TRANSFER_WEBHOOK_SECRET | quote }}
  PAYMENT_DEMO_CARD_API_KEY: {{ required "secrets.values.PAYMENT_DEMO_CARD_API_KEY is required" .Values.secrets.values.PAYMENT_DEMO_CARD_API_KEY | quote }}
  PAYMENT_DEMO_CARD_WEBHOOK_SECRET: {{ required "secrets.values.PAYMENT_DEMO_CARD_WEBHOOK_SECRET is required" .Values.secrets.values.PAYMENT_DEMO_CARD_WEBHOOK_SECRET | quote }}
{{- end }}
