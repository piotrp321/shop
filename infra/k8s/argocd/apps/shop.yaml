# The shop: the chart of the revision with the values of the profile prod and the images values file of the same revision
# (environments/prod/values-images.yaml: image.tag and the four digests, generated by CI and present only on the branch
# deploy-images). One source, one revision: what was tested is what is deployed. There is no ignoreMissingValueFiles, so a
# revision without the images file does not render and nothing is synchronized.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/piotrp321/shop.git
    targetRevision: deploy-images
    path: infra/k8s/charts/shop
    helm:
      releaseName: shop
      valueFiles:
        - ../../environments/prod/values.yaml
        - ../../environments/prod/values-images.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
