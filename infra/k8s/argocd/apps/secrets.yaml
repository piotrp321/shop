# The sealed secrets of the environment (infra/k8s/environments/prod/secrets, written by scripts/seal-secrets.sh): the
# controller turns them into the Secrets of the namespace shop that the chart reads. A wave before the shop, so they exist
# when the pods start; the CRD comes from the application before it (the first dry run may not know it yet).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/piotrp321/shop.git
    targetRevision: deploy-images
    path: infra/k8s/environments/prod/secrets
    directory:
      recurse: false
      # Only the files seal-secrets.sh writes; check refuses any other file in the directory.
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
