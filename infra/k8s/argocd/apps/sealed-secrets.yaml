# The controller of Sealed Secrets, from the published chart pinned by version. It is the first application of the root
# (wave -2): the SealedSecret resources of the next one need its CRD and its key. Bootstrap applies this same file by hand
# before the root exists, to get the certificate for seal-secrets.sh; the root then adopts it. The controller keeps the
# name and the namespace that kubeseal assumes by default.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
