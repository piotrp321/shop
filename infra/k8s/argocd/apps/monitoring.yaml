# Grafana Alloy for Grafana Cloud (docs/features/deploy-ops/spec.md, O5 and O7): the chart k8s-monitoring of the version
# pinned below installs the Alloy Operator, kube-state-metrics and node-exporter, and one Alloy (kind Alloy, a Deployment of one
# replica, the cluster is one node) that sends the logs of every pod (read through the Kubernetes API), the cluster events and the
# metrics to Grafana Cloud, and synchronizes the PrometheusRule objects of the cluster to the ruler there. The last wave (1), after
# the shop: no account or a wrong token leaves this application Degraded and does not stop the shop. The interface of the chart
# changes between major versions (destinations are a map since 4.x): the version is pinned, an upgrade is a change of its own.
#
# The addresses and the instance ids of the two destinations come from the Grafana Cloud portal (the stack in the EU region,
# Germany; runbook, infra/k8s/README.md). The token is not here: it is the Secret grafana-cloud
# (GRAFANA_CLOUD_TOKEN) of the namespace shop, written by seal-secrets.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 4.6.0
    helm:
      releaseName: monitoring
      valuesObject:
        cluster:
          name: shop
        destinations:
          grafana-metrics:
            type: prometheus
            url: https://prometheus-prod-72-prod-eu-west-4.grafana.net/api/prom/push
            auth:
              type: basic
              # An Alloy expression: the instance id of the metrics (not a secret; the same value is the tenant). The chart reads
              # every other credential from the Secret, where there is only the token (a key missing there is empty).
              usernameFrom: &metricsInstance '"3773882"'
              passwordKey: GRAFANA_CLOUD_TOKEN
            tenantIdFrom: *metricsInstance
            secret:
              create: false
              name: grafana-cloud
              namespace: shop
          # Only the alert rules (spec, O6): the PrometheusRule objects of the cluster become Grafana-managed alert rules through
          # the import API of the Grafana of the stack (/api/convert, compatible with the ruler API: the default prefix /prometheus
          # gives /api/convert/prometheus/config/v1/rules), so that their alerts reach the Alertmanager of Grafana and its email
          # contact point. The ruler of the metrics has no Alertmanager on this stack (issue #594). The token is the one of the
          # service account shop-alloy-rules; the header names the data source the rules query. No feature sends metrics here: the
          # remote_write the chart gives every prometheus destination stays idle.
          grafana-alerting:
            type: prometheus
            url: https://cosmiccinnamon1835.grafana.net/api/convert
            auth:
              type: bearerToken
              bearerTokenKey: GRAFANA_ALERTING_TOKEN
            # The organization of the Grafana (the import API takes the tenant 1).
            tenantIdFrom: '"1"'
            secret:
              create: false
              name: grafana-cloud
              namespace: shop
            rules:
              enabled: true
              address: https://cosmiccinnamon1835.grafana.net/api/convert
              extraArguments: |
                http_headers = {
                  "X-Grafana-Alerting-Datasource-UID" = ["grafanacloud-prom"],
                }
          grafana-logs:
            type: loki
            url: https://logs-prod-050-prod-eu-west-4.grafana.net/loki/api/v1/push
            auth:
              type: basic
              usernameFrom: &logsInstance '"1882609"'
              passwordKey: GRAFANA_CLOUD_TOKEN
            tenantIdFrom: *logsInstance
            secret:
              create: false
              name: grafana-cloud
              namespace: shop
        # The metrics about the chart itself: without a list they would go to every prometheus destination, grafana-alerting too.
        selfReporting:
          destinations: [grafana-metrics]
        clusterMetrics:
          enabled: true
          destinations: [grafana-metrics]
          # The allowed metrics (the free plan of Grafana Cloud holds 10 thousand active series): the default list of the chart
          # (what the Kubernetes dashboards of Grafana Cloud need) plus the metrics of the alerts (spec, O6) and of hypercare of
          # /oncall (the image tag and owner of a pod, its readiness, the restarts; docs/features/oncall/spec.md), named here so
          # that a change of the default list in a new version of the chart cannot take them away.
          kube-state-metrics:
            metricsTuning:
              useDefaultAllowList: true
              includeMetrics:
                - kube_cronjob_status_last_successful_time
                - kube_job_status_condition
                - kube_job_owner
                - kube_node_info
                - kube_deployment_status_replicas_available
                - kube_deployment_spec_replicas
                - kube_statefulset_status_replicas_ready
                - kube_statefulset_replicas
                - kube_pod_container_info
                - kube_pod_owner
                - kube_pod_status_ready
                - kube_pod_container_status_restarts_total
          # The memory of a container that the kernel cannot take back (container_memory_rss, the anonymous pages) and the page cache
          # (container_memory_cache), against which the request of a pod is chosen (docs/features/runtime-config/spec.md, Z1). They are
          # in the default list too; named here so that a change of that list in a new version of the chart cannot take them away.
          cadvisor:
            metricsTuning:
              useDefaultAllowList: true
              includeMetrics:
                - container_memory_rss
                - container_memory_cache
        hostMetrics:
          enabled: true
          destinations: [grafana-metrics]
          linuxHosts:
            enabled: true
            metricsTuning:
              useDefaultAllowList: true
              includeMetrics:
                - node_filesystem_avail_bytes
                - node_filesystem_size_bytes
                # The pressure stall information of the node (PSI): the time the tasks waited for the processor, for the disk and
                # for memory (the pressure collector of node-exporter reads /proc/pressure).
                - node_pressure_cpu_waiting_seconds_total
                - node_pressure_io_stalled_seconds_total
                - node_pressure_io_waiting_seconds_total
                - node_pressure_memory_stalled_seconds_total
                - node_pressure_memory_waiting_seconds_total
        # The logs of the pods of every namespace, read through the Kubernetes API. The stages mask them before they leave the
        # cluster, and the discovery rules leave out the sources that cannot be masked (spec, O7; the test runs both in Alloy).
        podLogsViaKubernetesApi:
          enabled: true
          destinations: [grafana-logs]
          # Mailpit (the addressees and the subjects of the mail) is not collected. The list of such sources is here and in
          # tests/test_log_masking.py; a new one is a new rule, a rule per source.
          extraDiscoveryRules: |
            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              regex         = "shop;mailpit"
              action        = "drop"
            }
          # One block of stages for the pods and for the events (the alias below).
          extraLogProcessingStages: &logStages |
              // Stages of every log line before it leaves the cluster (docs/features/deploy-ops/spec.md, O7). The same text is used for the logs
              // of the pods and for the cluster events. A value is replaced by [REDACTED]; only the capture groups of a stage are replaced.
              // A rule of the same shape is added for a new key or format, and a source that cannot be masked is dropped in extraDiscoveryRules.
              // The names of the keys: password, passwd, secret, token (access_token, refresh_token, id_token, token_id, ...), session, api_key,
              // client_secret, authorization, cookie (Set-Cookie, Proxy-Authorization, ...) and their compounds, code, code_id and code_verifier (exactly: status_code
              // stays), username.

              // The lines DETAIL: and STATEMENT: of Postgres hold the values of the keys and the text of the queries.
              stage.drop {
                expression          = `(?:^|\]\s)\s*(?:DETAIL|STATEMENT):`
                drop_counter_reason = "postgres_detail_statement"
              }

              // The main message of an error of Postgres has the value of the input in a literal in quotes, and the formats of the
              // messages differ (invalid input syntax for type integer: "x", value "x" is out of range, "x" is out of range for type
              // real, time zone "x" not recognized, ...): of the 2000 formats of the server with a quoted %s the ones with the name of an
              // object (constraint, column, relation, table, ...) are the ones that must stay, so the rule is the other way round. Every
              // quote of the message of an error is a value unless the word before it names an object; the first such quote and
              // everything after it up to the end of the line (in the log of the API: up to the end of the string of JSON, where the quotes
              // are escaped) are replaced. Up to the end, not up to the closing quote, because the value is not escaped in the message,
              // so a quote, a backslash or the text of another message inside it would end the match too early. The text before the
              // quote stays (the kind of error, the type), and so do the names (violates unique constraint "uniq_customer_email").
              // Three stages: the quote after a name of an object is marked (the space before it becomes U+0001), the first quote
              // that is not marked and its tail are replaced, and the mark becomes the space again before any other stage.
              stage.replace {
                expression = `(?i)\b(?:column|relation|table|index|constraint|type|function|schema|database|role|user|sequence|view|trigger|extension|parameter|cursor|portal|statement|domain|language|collation|policy|rule|savepoint|tablespace|publication|subscription)( )\\?"`
                replace    = "\u0001"
              }
              stage.replace {
                expression = `(?:^|\]\s)\s*(?:ERROR|FATAL|PANIC|WARNING):\s+(?:[^"\x01]|\x01"[^"]*")*"(.*)$`
                replace    = "[REDACTED]"
              }
              stage.replace {
                expression = `\bERROR:\s+(?:[^"\\\x01]|\\[^"]|\x01\\"(?:[^"\\]|\\[^"])*\\")*\\"((?:[^"\\]|\\.)*)`
                replace    = "[REDACTED]"
              }
              stage.replace {
                expression = `(\x01)`
                replace    = " "
              }

              // The continuation lines of a message of Postgres of more lines (a value with a newline in it) start with a tab and have
              // no prefix to recognize them by, so the whole line of the container postgres is replaced.
              stage.match {
                selector = `{container="postgres"} |~ "^\t"`
                stage.replace {
                  expression = `^(\t.*)$`
                  replace    = "[REDACTED]"
                }
              }

              // JWT.
              stage.replace {
                expression = `(eyJ[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]*)+)`
                replace    = "[REDACTED]"
              }

              // Bearer tokens.
              stage.replace {
                expression = `(?i)\bbearer\s+([A-Za-z0-9._~+/=-]{16,})`
                replace    = "[REDACTED]"
              }

              // Headers written as lines: Authorization: ..., Cookie: ..., Set-Cookie: ... (the rest of the value).
              stage.replace {
                expression = `(?i)\b(?:proxy-authorization|authorization|set-cookie|cookie)\s*:\s*([^\r\n"]+)`
                replace    = "[REDACTED]"
              }

              // A list of two or more strings under a key (headers: "Set-Cookie":["a","b"]): all of them.
              stage.replace {
                expression = `(?i)(?:^|[^a-z0-9_-])"?(?:[a-z0-9_-]*(?:password|passwd|secret|token|session|api[_-]?key|authorization|cookie)[a-z0-9_-]*|code(?:_id|_verifier)?|username)"?\s*[:=]\s*\[\s*("(?:[^"\\]|\\.)*"(?:\s*,\s*"(?:[^"\\]|\\.)*")+)\s*\]`
                replace    = "\"[REDACTED]\""
              }

              // A number under a key of a secret ("password":12345; not code: the code of a response stays).
              stage.replace {
                expression = `(?i)(?:^|[^a-z0-9_-])"(?:[a-z0-9_-]*(?:password|passwd|secret|token|session|api[_-]?key|authorization|cookie)[a-z0-9_-]*)"\s*:\s*(-?[0-9][0-9.eE+-]*)`
                replace    = "[REDACTED]"
              }

              // The value of a key in JSON ("key":"value", also a list with one value, as above for more) and in logfmt (key="value").
              stage.replace {
                expression = `(?i)(?:^|[^a-z0-9_-])"?(?:[a-z0-9_-]*(?:password|passwd|secret|token|session|api[_-]?key|authorization|cookie)[a-z0-9_-]*|code(?:_id|_verifier)?|username)"?\s*[:=]\s*\[?\s*"((?:[^"\\]|\\.)*)"`
                replace    = "[REDACTED]"
              }

              // The same inside a string of JSON (the quotes are escaped).
              stage.replace {
                expression = `(?i)(?:^|[^a-z0-9_-])\\"(?:[a-z0-9_-]*(?:password|passwd|secret|token|session|api[_-]?key|authorization|cookie)[a-z0-9_-]*|code(?:_id|_verifier)?|username)\\"\s*:\s*\\"([^"\\]*)\\"`
                replace    = "[REDACTED]"
              }

              // The value of a key in a query string, a form and logfmt without quotes (key=value).
              stage.replace {
                expression = `(?i)(?:^|[^a-z0-9_-])(?:[a-z0-9_-]*(?:password|passwd|secret|token|session|api[_-]?key|authorization|cookie)[a-z0-9_-]*|code(?:_id|_verifier)?|username)=([^&\s"';,)}\]\\]+)`
                replace    = "[REDACTED]"
              }

              // The password of an address (scheme://user:password@host).
              stage.replace {
                expression = `://[^/\s:@"]*:([^@/\s"]+)@`
                replace    = "[REDACTED]"
              }

              // The parameters of a query in the message of Doctrine (with params [...]): the data of orders and addresses.
              stage.replace {
                expression = `with params \[((?:[^\]\\]|\\.)*)\]`
                replace    = "[REDACTED]"
              }

              // The values of the keys in DETAIL of Postgres inside another message.
              stage.replace {
                expression = `(?:Failing row contains |Key \([^)]*\)=)\(([^)]*)\)`
                replace    = "[REDACTED]"
              }

              // E-mail addresses, also with the @ written as %40 in a URL.
              stage.replace {
                expression = `([^\s"'<>(),;:\[\]\\=@/%&?]+@[^\s"'<>(),;\[\]\\@/:]+\.[^\s"'<>(),;\[\]\\@/:.&?]{2,})`
                replace    = "[REDACTED]"
              }
              stage.replace {
                expression = `([^\s"'<>(),;:\[\]\\=@/&?]+%40[^\s"'<>(),;\[\]\\&]+)`
                replace    = "[REDACTED]"
              }

              // IPv6 addresses: the full form, the compressed form with :: and the loopback.
              stage.replace {
                expression = `(?i)(?:^|[^0-9a-z:])((?:[0-9a-f]{1,4}:){7}[0-9a-f]{1,4})`
                replace    = "[REDACTED]"
              }
              stage.replace {
                expression = `(?i)(?:^|[^0-9a-z:])((?:[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){0,6})::(?:[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){0,6})?)`
                replace    = "[REDACTED]"
              }
              stage.replace {
                expression = `(?:^|[^0-9a-zA-Z:])(::1)\b`
                replace    = "[REDACTED]"
              }

              // IPv4 addresses.
              stage.replace {
                expression = `\b([0-9]{1,3}(?:\.[0-9]{1,3}){3})\b`
                replace    = "[REDACTED]"
              }
        clusterEvents:
          enabled: true
          destinations: [grafana-logs]
          extraLogProcessingStages: *logStages
        telemetryServices:
          kube-state-metrics:
            deploy: true
            # No metrics of Secrets and ConfigMaps: the ClusterRole of kube-state-metrics then has no access to Secrets.
            collectorsExclude: [secrets, configmaps]
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {cpu: 250m, memory: 256Mi}
          node-exporter:
            deploy: true
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 250m, memory: 128Mi}
        collectors:
          alloy:
            presets: [deployment]
            # The image the chart expects (its pinnedImageTag), so that what runs is what the test of the masking ran: without it
            # the operator picks the Alloy of its own chart.
            image:
              tag: v1.21.3
            # Not part of a feature of the chart: the exporters of the databases of the shop (the allow lists are in the text; the
            # test of the render, the one in a real Alloy against unreachable databases and the count of the series are in
            # tests/test_monitoring.py and scripts/exporters.sh). The Secret that the first block reads is in the Role below.
            extraConfig: |
              // The metrics of Postgres and Elasticsearch (docs/features/runtime-config/spec.md, D7): two exporters of Alloy, each with an allow
              // list of the metrics and of the names of the labels, so that no text of a query leaves the cluster and the series fit in the free
              // plan of Grafana Cloud (tests/test_monitoring.py counts them). The DSN of the role exporter, which has pg_monitor only, is the one
              // value of the Secret shop-exporter that Alloy reads, as a secret (it is never shown by Alloy and never in a ConfigMap).
              remote.kubernetes.secret "shop_exporter" {
                name      = "shop-exporter"
                namespace = "shop"
              }

              // The collectors are listed (the list replaces the default one). Never stat_statements: its rows carry the text of the queries.
              prometheus.exporter.postgres "shop" {
                data_source_names  = [remote.kubernetes.secret.shop_exporter.data["POSTGRES_EXPORTER_DSN"]]
                enabled_collectors = ["database", "stat_bgwriter", "stat_checkpointer", "stat_database", "wal", "long_running_transactions"]
              }

              prometheus.scrape "shop_postgres" {
                targets         = prometheus.exporter.postgres.shop.targets
                job_name        = "shop/postgres"
                scrape_interval = "60s"
                scrape_timeout  = "10s"
                forward_to      = [prometheus.relabel.shop_postgres.receiver]
              }

              prometheus.relabel "shop_postgres" {
                rule {
                  source_labels = ["__name__"]
                  regex         = "up|pg_up|pg_database_size_bytes|pg_long_running_transactions|pg_long_running_transactions_oldest_timestamp_seconds|pg_settings_max_connections|pg_settings_shared_buffers_bytes|pg_stat_activity_count|pg_stat_bgwriter_buffers_alloc_total|pg_stat_checkpointer_buffers_written_total|pg_stat_checkpointer_num_requested_total|pg_stat_checkpointer_num_timed_total|pg_stat_checkpointer_sync_time_total|pg_stat_checkpointer_write_time_total|pg_stat_database_active_time_seconds_total|pg_stat_database_blk_read_time|pg_stat_database_blk_write_time|pg_stat_database_blks_hit|pg_stat_database_blks_read|pg_stat_database_deadlocks|pg_stat_database_numbackends|pg_stat_database_temp_bytes|pg_stat_database_temp_files|pg_stat_database_xact_commit|pg_stat_database_xact_rollback|pg_wal_segments|pg_wal_size_bytes"
                  action        = "keep"
                }
                // The template databases are not the shop's.
                rule {
                  source_labels = ["datname"]
                  regex         = "template0|template1"
                  action        = "drop"
                }
                // Only these names of labels leave the cluster: a label that a new version of the exporter adds is dropped.
                rule {
                  regex  = "__name__|job|instance|datname|state"
                  action = "labelkeep"
                }
                forward_to = [prometheus.remote_write.grafana_metrics.receiver]
              }

              // The statistics of the cluster and of its nodes only (all = true is every node; no indices, shards, snapshots or settings).
              prometheus.exporter.elasticsearch "shop" {
                address = "http://elasticsearch.shop.svc.cluster.local:9200"
                all     = true
              }

              prometheus.scrape "shop_elasticsearch" {
                targets         = prometheus.exporter.elasticsearch.shop.targets
                job_name        = "shop/elasticsearch"
                scrape_interval = "60s"
                scrape_timeout  = "10s"
                forward_to      = [prometheus.relabel.shop_elasticsearch.receiver]
              }

              prometheus.relabel "shop_elasticsearch" {
                rule {
                  source_labels = ["__name__"]
                  regex         = "up|elasticsearch_breakers_tripped|elasticsearch_cluster_health_active_shards|elasticsearch_cluster_health_initializing_shards|elasticsearch_cluster_health_number_of_nodes|elasticsearch_cluster_health_relocating_shards|elasticsearch_cluster_health_status|elasticsearch_cluster_health_unassigned_shards|elasticsearch_filesystem_data_available_bytes|elasticsearch_filesystem_data_size_bytes|elasticsearch_indices_indexing_index_time_seconds_total|elasticsearch_indices_indexing_index_total|elasticsearch_indices_query_cache_count|elasticsearch_indices_query_cache_evictions|elasticsearch_indices_query_cache_memory_size_bytes|elasticsearch_indices_request_cache_evictions|elasticsearch_indices_request_cache_memory_size_bytes|elasticsearch_indices_search_query_time_seconds|elasticsearch_indices_search_query_total|elasticsearch_indices_segments_memory_bytes|elasticsearch_indices_store_size_bytes|elasticsearch_jvm_gc_collection_seconds_count|elasticsearch_jvm_gc_collection_seconds_sum|elasticsearch_jvm_memory_max_bytes|elasticsearch_jvm_memory_used_bytes|elasticsearch_node_stats_up|elasticsearch_os_cpu_percent|elasticsearch_thread_pool_active_count|elasticsearch_thread_pool_queue_count|elasticsearch_thread_pool_rejected_count"
                  action        = "keep"
                }
                // The pools of the gets, searches and writes only (a node has forty).
                rule {
                  source_labels = ["__name__", "type"]
                  separator     = "@"
                  regex         = "elasticsearch_thread_pool_.*@(?:get|search|write)"
                  target_label  = "__keepme"
                  replacement   = "1"
                }
                rule {
                  source_labels = ["__name__", "__keepme"]
                  separator     = "@"
                  regex         = "elasticsearch_thread_pool_.*@"
                  action        = "drop"
                }
                // The name of the node is the pod; its address and its roles would only add series when the pod is made again.
                rule {
                  regex  = "__name__|job|instance|cluster|name|area|gc|type|cache|breaker|color|mount|path"
                  action = "labelkeep"
                }
                forward_to = [prometheus.remote_write.grafana_metrics.receiver]
              }
            alloy:
              resources:
                requests: {cpu: 200m, memory: 384Mi}
                limits: {cpu: "1", memory: 768Mi}
            configReloader:
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 100m, memory: 64Mi}
            # The operator makes no RBAC objects (it has no rights on them, see alloy-operator below): the Alloy chart makes none, and
            # the ClusterRole of Alloy and its binding are in extraObjects (monitoring-alloy-collector). The default of the Alloy chart
            # would be a ClusterRole that reads all Secrets of the cluster.
            rbac:
              create: false
            # The name that the operator gives the service account (the name of the Alloy resource), written out because the
            # bindings of extraObjects name it.
            serviceAccount:
              name: monitoring-alloy
        alloy-operator:
          # The operator works in the namespace monitoring only (WATCH_NAMESPACE): no ClusterRole, and its RBAC is the Role of
          # extraObjects (monitoring-alloy-operator) instead of the one of its chart, which has bind and escalate on Roles.
          ownNamespaceOnly: true
          rbac:
            create: false
          # The hooks that wait for the removal of the Alloy resources are Helm pre-delete hooks, which Argo CD does not run.
          waitForAlloyRemoval:
            enabled: false
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
        # The admission policies and the RBAC of the monitoring (tests/test_monitoring.py; make -C infra/k8s monitoring-smoke runs them
        # in k3d, sends them the requests they must refuse and asks the cluster what each service account may do). No role here binds,
        # escalates, impersonates or changes RBAC objects.
        extraObjects:
          # The operator is an image of a third party that makes workloads, Services and Secrets in monitoring. Whoever asks (the
          # operator, Argo CD, an administrator), the namespace monitoring has no pod with access to the host (one would read the
          # kubeconfig of k3s on the node, an administrator of the cluster) but those of node-exporter, no pod with a priority class
          # of the system (it would preempt the pods of the shop), no Service but a ClusterIP without external IPs and no Secret with
          # a token of a service account.
          # The pods of node-exporter are known by who makes them: the controller of DaemonSets (in k3s it has its own service account,
          # which nobody in monitoring can act as) for the DaemonSet monitoring-node-exporter, which no service account of monitoring
          # may make or change. Labels are no proof. The templates of the workloads are checked too, so that a refusal comes at once
          # to whoever makes the workload. The wave -1 puts the policies before everything else of the application.
          - apiVersion: admissionregistration.k8s.io/v1
            kind: ValidatingAdmissionPolicy
            metadata:
              name: monitoring-no-host-access
              annotations:
                argocd.argoproj.io/sync-wave: "-1"
            spec:
              failurePolicy: Fail
              matchConstraints:
                resourceRules:
                  - apiGroups: [""]
                    apiVersions: ["*"]
                    operations: [CREATE, UPDATE]
                    resources: [pods, pods/ephemeralcontainers]
                  - apiGroups: [apps]
                    apiVersions: ["*"]
                    operations: [CREATE, UPDATE]
                    resources: [deployments, replicasets, statefulsets, daemonsets]
                  - apiGroups: [batch]
                    apiVersions: ["*"]
                    operations: [CREATE, UPDATE]
                    resources: [jobs, cronjobs]
              variables:
                - name: podSpec
                  expression: >-
                    request.kind.kind == 'Pod' ? object.spec
                    : request.kind.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec
                    : object.spec.template.spec
                - name: containers
                  expression: >-
                    variables.podSpec.containers
                    + (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
                    + (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers : [])
                # What reaches the host: its namespaces, its files, its ports, a privileged container and a capability beyond those
                # the baseline profile of the Pod Security Standards allows.
                - name: hostAccess
                  expression: >-
                    (has(variables.podSpec.hostNetwork) && variables.podSpec.hostNetwork ? ['hostNetwork'] : [])
                    + (has(variables.podSpec.hostPID) && variables.podSpec.hostPID ? ['hostPID'] : [])
                    + (has(variables.podSpec.hostIPC) && variables.podSpec.hostIPC ? ['hostIPC'] : [])
                    + (has(variables.podSpec.volumes) && variables.podSpec.volumes.exists(v, has(v.hostPath)) ? ['hostPath'] : [])
                    + (variables.containers.exists(c, has(c.ports) && c.ports.exists(p, has(p.hostPort) && p.hostPort != 0))
                      ? ['hostPort'] : [])
                    + (variables.containers.exists(c, has(c.securityContext) && has(c.securityContext.privileged)
                      && c.securityContext.privileged) ? ['privileged'] : [])
                    + (variables.containers.exists(c, has(c.securityContext) && has(c.securityContext.capabilities)
                      && has(c.securityContext.capabilities.add) && c.securityContext.capabilities.add.exists(a, !(a in [
                        'AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD', 'NET_BIND_SERVICE', 'SETFCAP',
                        'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']))) ? ['capabilities'] : [])
                - name: nodeExporter
                  expression: >-
                    request.kind.kind == 'DaemonSet'
                    ? object.metadata.name == 'monitoring-node-exporter'
                      && !request.userInfo.username.startsWith('system:serviceaccount:monitoring:')
                    : request.kind.kind == 'Pod'
                      && request.userInfo.username == 'system:serviceaccount:kube-system:daemon-set-controller'
                      && has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o, o.kind == 'DaemonSet'
                        && o.name == 'monitoring-node-exporter' && has(o.controller) && o.controller)
                # A change of a pod that leaves its spec as it was (its metadata: a finalizer, an owner, an annotation) adds nothing.
                - name: specUnchanged
                  expression: request.operation == 'UPDATE' && request.kind.kind == 'Pod' && object.spec == oldObject.spec
              validations:
                - expression: variables.hostAccess.size() == 0 || variables.nodeExporter || variables.specUnchanged
                  reason: Forbidden
                  messageExpression: >-
                    request.kind.kind + ' asks for access to the host (' + variables.hostAccess.join(', ') + '): in the
                    namespace monitoring only the DaemonSet monitoring-node-exporter and its pods may'
                # system-cluster-critical and system-node-critical are allowed in every namespace, and a pod with one preempts the
                # pods of the shop. Nobody in monitoring needs them, node-exporter neither.
                - expression: >-
                    !has(variables.podSpec.priorityClassName) || !variables.podSpec.priorityClassName.startsWith('system-')
                    || variables.specUnchanged
                  reason: Forbidden
                  messageExpression: >-
                    request.kind.kind + ' asks for the priority class ' + variables.podSpec.priorityClassName + ': in the
                    namespace monitoring no pod may have a priority class of the system'
          - apiVersion: admissionregistration.k8s.io/v1
            kind: ValidatingAdmissionPolicyBinding
            metadata:
              name: monitoring-no-host-access
              annotations:
                argocd.argoproj.io/sync-wave: "-1"
            spec:
              policyName: monitoring-no-host-access
              validationActions: [Deny]
              matchResources:
                # Set by the API server to the name of the namespace: no other namespace can have it.
                namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
          # A Secret of this type gets from the cluster a token of the service account it names: the operator, which writes Secrets
          # in monitoring (its Helm releases), would get the token of any service account there.
          - apiVersion: admissionregistration.k8s.io/v1
            kind: ValidatingAdmissionPolicy
            metadata:
              name: monitoring-no-service-account-tokens
              annotations:
                argocd.argoproj.io/sync-wave: "-1"
            spec:
              failurePolicy: Fail
              matchConstraints:
                resourceRules:
                  - apiGroups: [""]
                    apiVersions: ["*"]
                    operations: [CREATE, UPDATE]
                    resources: [secrets]
              validations:
                - expression: "!has(object.type) || object.type != 'kubernetes.io/service-account-token'"
                  reason: Forbidden
                  message: in the namespace monitoring no Secret may hold a token of a service account (type kubernetes.io/service-account-token)
          - apiVersion: admissionregistration.k8s.io/v1
            kind: ValidatingAdmissionPolicyBinding
            metadata:
              name: monitoring-no-service-account-tokens
              annotations:
                argocd.argoproj.io/sync-wave: "-1"
            spec:
              policyName: monitoring-no-service-account-tokens
              validationActions: [Deny]
              matchResources:
                namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
          # The operator creates Services in monitoring (create takes no resourceNames) and changes the one of its Alloy. A NodePort
          # or a LoadBalancer (ServiceLB of k3s) would open a port of the node past ufw and the policy on hostPort, and external IPs
          # would take over the traffic of every pod of the cluster to those addresses (CVE-2020-8554). Every Service of the charts is
          # a ClusterIP; ExternalName is a type of its own and so refused too.
          - apiVersion: admissionregistration.k8s.io/v1
            kind: ValidatingAdmissionPolicy
            metadata:
              name: monitoring-cluster-ip-services
              annotations:
                argocd.argoproj.io/sync-wave: "-1"
            spec:
              failurePolicy: Fail
              matchConstraints:
                resourceRules:
                  - apiGroups: [""]
                    apiVersions: ["*"]
                    operations: [CREATE, UPDATE]
                    resources: [services]
              validations:
                - expression: >-
                    (!has(object.spec.type) || object.spec.type == 'ClusterIP')
                    && (!has(object.spec.externalIPs) || object.spec.externalIPs.size() == 0)
                  reason: Forbidden
                  messageExpression: >-
                    'Service of the type ' + (has(object.spec.type) ? object.spec.type : 'ClusterIP')
                    + (has(object.spec.externalIPs) && object.spec.externalIPs.size() > 0 ? ' with external IPs' : '')
                    + ': in the namespace monitoring only a Service of the type ClusterIP without external IPs may be'
          - apiVersion: admissionregistration.k8s.io/v1
            kind: ValidatingAdmissionPolicyBinding
            metadata:
              name: monitoring-cluster-ip-services
              annotations:
                argocd.argoproj.io/sync-wave: "-1"
            spec:
              policyName: monitoring-cluster-ip-services
              validationActions: [Deny]
              matchResources:
                namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
          # The operator, in the namespace monitoring only. It reads its Alloy resource (Argo CD makes it), keeps its finalizer and
          # status, and makes of it through the Alloy chart (presets: deployment) a Deployment, its service account and its Service,
          # all named like the resource (monitoring-alloy); it keeps its Helm releases in Secrets (their names change with each
          # release), its leader election and its events. It may create more objects of those kinds (create takes no resourceNames),
          # but change and delete only those of its Alloy: not kube-state-metrics, node-exporter or itself. No DaemonSet,
          # StatefulSet, ConfigMap or pod. The namespace monitoring has no Secret of the shop.
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: monitoring-alloy-operator
              namespace: monitoring
            rules:
              - apiGroups: [collectors.grafana.com]
                resources: [alloys]
                verbs: [get, list, watch, update, patch]
              - apiGroups: [collectors.grafana.com]
                resources: [alloys/status]
                verbs: [get, update, patch]
              - apiGroups: [collectors.grafana.com]
                resources: [alloys/finalizers]
                verbs: [update]
              - apiGroups: [""]
                resources: [secrets]
                verbs: [get, list, watch, create, update, patch, delete]
              - apiGroups: [""]
                resources: [serviceaccounts, services]
                verbs: [get, list, watch, create]
              - apiGroups: [""]
                resources: [serviceaccounts, services]
                resourceNames: [monitoring-alloy]
                verbs: [update, patch, delete]
              - apiGroups: [apps]
                resources: [deployments]
                verbs: [get, list, watch, create]
              - apiGroups: [apps]
                resources: [deployments]
                resourceNames: [monitoring-alloy]
                verbs: [update, patch, delete]
              - apiGroups: [coordination.k8s.io]
                resources: [leases]
                verbs: [get, list, watch, create, update, patch, delete]
              - apiGroups: [""]
                resources: [events]
                verbs: [create, patch]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: monitoring-alloy-operator
              namespace: monitoring
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: monitoring-alloy-operator
            subjects:
              - kind: ServiceAccount
                name: monitoring-alloy-operator
                namespace: monitoring
          # Alloy reads, in the whole cluster: the nodes and the metrics of their kubelet and cAdvisor, the endpoints of
          # kube-state-metrics, the pods of node-exporter and of every namespace with their logs, the events and the
          # PrometheusRule objects. No Secret and no ConfigMap.
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: monitoring-alloy-collector
            rules:
              - apiGroups: [""]
                resources: [nodes, services, endpoints, pods, namespaces, events]
                verbs: [get, list, watch]
              - apiGroups: [""]
                resources: [nodes/metrics, pods/log]
                verbs: [get]
              - apiGroups: [monitoring.coreos.com]
                resources: [prometheusrules]
                verbs: [get, list, watch]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: monitoring-alloy-collector
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: monitoring-alloy-collector
            subjects:
              - kind: ServiceAccount
                name: monitoring-alloy
                namespace: monitoring
          # Alloy reads the token from the Secret grafana-cloud of the namespace shop and the DSN of the role exporter of Postgres from
          # the Secret shop-exporter (a Secret of its own: the Role cannot give a key of shop-secrets), and from no other Secret of the
          # cluster. Without either of them Alloy does not start, so the Secrets are applied before the application monitoring.
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: alloy-grafana-cloud
              namespace: shop
            rules:
              - apiGroups: [""]
                resources: [secrets]
                resourceNames: [grafana-cloud, shop-exporter]
                verbs: [get, list, watch]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: alloy-grafana-cloud
              namespace: shop
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: alloy-grafana-cloud
            subjects:
              - kind: ServiceAccount
                name: monitoring-alloy
                namespace: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Alloy resource comes in the same synchronization as its CRD (the chart of the operator): the first dry run does
      # not know the kind yet.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
