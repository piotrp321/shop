# Argo CD itself, installed by bootstrap through the Helm controller of k3s from the published chart pinned by version.
# No ingress and no SSO: it is reached with `kubectl port-forward` over SSH (D6).
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 10.15.0
  targetNamespace: argocd
  createNamespace: true
  valuesContent: |-
    # The names of the resources the bootstrap waits for: argocd-server, argocd-repo-server.
    fullnameOverride: argocd
    dex:
      enabled: false
    notifications:
      enabled: false
    configs:
      params:
        server.insecure: true
      cm:
        # The health of an Application, as the documentation of Argo CD gives it. Without it the root does not wait for the
        # health of the applications it created, so the waves (sealed-secrets, secrets, shop) would not be waited for.
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
          end
          return hs
        # The health of a claim. Argo CD takes a Pending claim for a resource that is still progressing and waits for it in its
        # wave; a claim on local-path (WaitForFirstConsumer) stays Pending until its first pod, so a claim that only a CronJob
        # uses (backup-work of the shop) would hold back the sync for good. Pending is healthy only with the annotation the
        # chart puts on such a claim; any other Pending claim is still progressing, a Lost one is degraded.
        resource.customizations.health.PersistentVolumeClaim: |
          hs = {}
          if obj.status ~= nil and obj.status.phase == "Bound" then
            hs.status = "Healthy"
            hs.message = "the claim is bound"
            return hs
          end
          if obj.status ~= nil and obj.status.phase == "Lost" then
            hs.status = "Degraded"
            hs.message = "the volume of the claim is lost"
            return hs
          end
          local annotations = obj.metadata.annotations
          if obj.status ~= nil and obj.status.phase == "Pending" and annotations ~= nil and annotations["shop/bound-by-first-pod"] == "true" then
            hs.status = "Healthy"
            hs.message = "the claim is bound when its first pod starts"
            return hs
          end
          hs.status = "Progressing"
          hs.message = "waiting for the claim to be bound"
          return hs
