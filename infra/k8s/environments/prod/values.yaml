# The server: one node with 8 vCore and 24 GB RAM, behind Cloudflare. The sum of the CPU requests stays up to 7 vCPU
# and of the memory limits up to 20 GB (checked by `make check`).

global:
  # Replace with the domain of the shop before the first deployment.
  domain: shop.example.org
  scheme: https

# The images built by us are deployed by digest: image.digests.<app> is required for all four.
image:
  requireDigests: true

# Cloudflare is in Full (strict) mode: the origin presents the Origin CA certificate (SealedSecret shop-origin-tls).
ingress:
  tls: true
  tlsSecretName: shop-origin-tls

# The demo is not for search engines.
noindex: true

# The start of the demo (D10): the bar of a demo store, no customer accounts, the order mail stays in the cluster.
demoNotice: true
customerAccounts: false
orderMail: mailpit

# The Secret with the Brevo SMTP login and key (BREVO_SMTP_LOGIN, BREVO_SMTP_PASSWORD), created outside the chart.
brevo:
  secretName: shop-brevo-smtp

# The origin takes HTTP(S) only from Cloudflare (https://www.cloudflare.com/ips/, to be refreshed when they change).
ipAllowList:
  enabled: true
  sourceRange:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    - 2400:cb00::/32
    - 2606:4700::/32
    - 2803:f800::/32
    - 2405:b500::/32
    - 2405:8100::/32
    - 2a06:98c0::/29
    - 2c0f:f248::/32

elasticsearch:
  javaOpts: -Xms2g -Xmx2g

keycloak:
  javaHeap: -Xms512m -Xmx1g
  # E-mail verification, password reset and create-admin go out through Brevo.
  mail: brevo

resources:
  postgres: { requests: { cpu: 500m, memory: 1Gi }, limits: { memory: 2Gi } }
  redis: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
  elasticsearch: { requests: { cpu: "1", memory: 3Gi }, limits: { memory: 4Gi } }
  rabbitmq: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
  garage: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  keycloak: { requests: { cpu: 500m, memory: 1536Mi }, limits: { memory: 2Gi } }
  mailpit: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
  api: { requests: { cpu: "1", memory: 512Mi }, limits: { memory: 2Gi } }
  worker: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 1Gi } }
  store: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 1536Mi } }
  admin: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
  imgproxy: { requests: { cpu: 250m, memory: 256Mi }, limits: { memory: 1Gi } }
  varnish: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
  job: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
