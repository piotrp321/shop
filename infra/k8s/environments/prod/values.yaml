# The server: one node with 8 vCore and 24 GB RAM, behind Cloudflare. The sum of the CPU requests stays up to 7 vCPU
# and of the memory limits up to 20 GB (checked by `make check`).

global:
  domain: worf.pl
  scheme: https

# The images built by us are deployed by digest: image.digests.<app> is required for all four.
image:
  requireDigests: true

# Cloudflare is in Full (strict) mode: the origin presents the Origin CA certificate (SealedSecret shop-origin-tls).
ingress:
  tls: true
  tlsSecretName: shop-origin-tls

# The demo is not for search engines.
noindex: true

# The start of the demo (D10): the bar of a demo store, no customer accounts, the order mail stays in the cluster.
demoNotice: true
customerAccounts: false
orderMail: mailpit

# The Secret with the Brevo SMTP login and key (BREVO_SMTP_LOGIN, BREVO_SMTP_PASSWORD), created outside the chart.
brevo:
  secretName: shop-brevo-smtp

# The address of the client for the rate limits of the API: Cloudflare sets CF-Connecting-IP on every request, and
# nothing but Cloudflare reaches the origin (ipAllowList below).
clientIpHeader: CF-Connecting-IP

# Sentry (docs/features/sentry/spec.md, P4 and P7): the environment and one trace in ten. The DSNs are public values, not secrets: one per
# project of the Sentry organization `worf` (EU region, infra/k8s/README.md section 10); an application with an empty DSN has Sentry off.
sentry:
  environment: demo
  tracesSampleRate: 0.1
  dsn:
    api: https://9456d06b82ba3a47b64727357ae7931f@o4512424218329088.ingest.de.sentry.io/4512424271413328
    store: https://dde664ef9af8b65a0dbb626186f27183@o4512424218329088.ingest.de.sentry.io/4512424273444944
    admin: https://4e7feefd85036218103d9fb8f246026e@o4512424218329088.ingest.de.sentry.io/4512424275542096

# The origin takes HTTP(S) only from Cloudflare (https://www.cloudflare.com/ips/, to be refreshed when they change).
ipAllowList:
  enabled: true
  sourceRange:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    - 2400:cb00::/32
    - 2606:4700::/32
    - 2803:f800::/32
    - 2405:b500::/32
    - 2405:8100::/32
    - 2a06:98c0::/29
    - 2c0f:f248::/32

# The nightly backup into a restic repository in a Cloudflare R2 bucket (docs/features/deploy-ops/spec.md, O2). Replace the
# repository with the address of the bucket (s3:https://<account id>.r2.cloudflarestorage.com/<bucket>) before the first
# deployment with the backups; the secret is the SealedSecret shop-backup (make -C infra/k8s seal-secrets WHAT=backup).
backup:
  enabled: true
  repository: s3:https://0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com/shop-backups
  s3Region: auto
  secretName: shop-backup

# The alert rules (docs/features/deploy-ops/spec.md, O6): a PrometheusRule that the application monitoring forwards to its ruler; the
# CRD comes with the application prometheus-crds, which Argo CD applies before the shop.
alerts:
  enabled: true

elasticsearch:
  javaOpts: -Xms2g -Xmx2g

keycloak:
  javaHeap: -Xms512m -Xmx1g
  # E-mail verification, password reset and create-admin go out through Brevo.
  mail: brevo

resources:
  postgres: { requests: { cpu: 500m, memory: 1Gi }, limits: { memory: 2Gi } }
  redis: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
  elasticsearch: { requests: { cpu: "1", memory: 3Gi }, limits: { memory: 4Gi } }
  rabbitmq: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
  garage: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  keycloak: { requests: { cpu: 500m, memory: 1536Mi }, limits: { memory: 2Gi } }
  mailpit: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
  api: { requests: { cpu: "1", memory: 512Mi }, limits: { memory: 2Gi } }
  worker: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 1Gi } }
  store: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 1536Mi } }
  admin: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
  imgproxy: { requests: { cpu: 250m, memory: 256Mi }, limits: { memory: 1Gi } }
  varnish: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
  backup: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  job: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
