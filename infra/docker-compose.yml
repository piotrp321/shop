# Infrastructure services. Included by the root compose.yaml with project_directory set to the
# repo root, so relative paths below are relative to the repo root.
#
# Secrets are never interpolated with ${...}: services read them from .env.local (env_file, required).
# Where an image expects a different variable name, a container-side wrapper maps it ($$VAR is
# evaluated by the container shell, not by Compose).

services:
  postgres:
    image: postgres:18.6
    env_file:
      - path: ./.env.local
        required: true
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.3
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.4.0-management
    environment:
      RABBITMQ_DEFAULT_USER: shop
    env_file:
      - path: ./.env.local
        required: true
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  rabbitmq-init:
    image: curlimages/curl:8.18.0
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - path: ./.env.local
        required: true
    environment:
      RABBITMQ_DEFAULT_USER: shop
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        api=http://rabbitmq:15672/api
        auth="$$RABBITMQ_DEFAULT_USER:$$RABBITMQ_DEFAULT_PASS"
        # The management listener can come up a moment after the broker answers ping.
        retry="--retry 30 --retry-delay 2 --retry-all-errors"
        curl -fsS $$retry -u "$$auth" -X PUT "$$api/vhosts/test"
        curl -fsS $$retry -u "$$auth" -X PUT -H 'content-type: application/json' \
          -d '{"configure":".*","write":".*","read":".*"}' \
          "$$api/permissions/test/$$RABBITMQ_DEFAULT_USER"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./.env.local
        required: true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m
    # Maps our secret name to the one Keycloak expects.
    entrypoint:
      - /bin/bash
      - -c
      - 'export KC_DB_PASSWORD="$$KEYCLOAK_DB_PASSWORD"; exec /opt/keycloak/bin/kc.sh "$$@"'
      - kc
    command: ["start-dev"]
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/localhost/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  garage:
    image: dxflrs/garage:v2.4.0
    env_file:
      - path: ./.env.local
        required: true
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # The image has no shell or curl. `garage status` checks that the daemon answers RPC; the admin
      # /health endpoint reports 503 until the layout is applied by garage-init.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  garage-init:
    build:
      dockerfile_inline: |
        FROM dxflrs/garage:v2.4.0 AS garage
        FROM alpine:3.22
        COPY --from=garage /garage /usr/local/bin/garage
    depends_on:
      garage:
        condition: service_healthy
    env_file:
      - path: ./.env.local
        required: true
    restart: "no"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - ./infra/garage/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  imgproxy:
    image: darthsim/imgproxy:v3.31.1
    depends_on:
      garage-init:
        condition: service_completed_successfully
    env_file:
      - path: ./.env.local
        required: true
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://garage:3900
      IMGPROXY_S3_REGION: garage
      # Both buckets: the second one is used by the integration tests.
      IMGPROXY_ALLOWED_SOURCES: s3://product-images/,s3://product-images-test/
      # Same limits as ProductImageStorage (64 MB, 50 MP); imgproxy is the second line of defence.
      IMGPROXY_MAX_SRC_FILE_SIZE: "67108864"
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
    # Maps our secret names to the AWS names read by the S3 client.
    entrypoint:
      - /bin/sh
      - -c
      - 'export AWS_ACCESS_KEY_ID="$$GARAGE_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$$GARAGE_SECRET_ACCESS_KEY"; exec entrypoint.sh "$$@"'
      - imgproxy
    command: ["imgproxy"]
    ports:
      - "127.0.0.1:${IMGPROXY_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.11
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: dev
    env_file:
      - path: ./.env.local
        required: true
    environment:
      APP_ENV: dev
      # Database connection (not secrets); the password is SHOP_DB_PASSWORD from .env.local.
      SHOP_DB_HOST: postgres
      SHOP_DB_NAME: shop
      SHOP_DB_USER: shop
      # Public browser-facing URLs (not secrets). Only the admin origin gets CORS.
      ADMIN_URL: http://localhost:${ADMIN_PORT:-5173}
      STORE_URL: http://localhost:${STORE_PORT:-3000}
      # Images: Garage S3 endpoint, bucket and the browser-facing imgproxy URL (not secrets).
      GARAGE_S3_ENDPOINT: http://garage:3900
      IMAGES_BUCKET: product-images
      IMGPROXY_PUBLIC_URL: http://localhost:${IMGPROXY_PORT:-8081}
    volumes:
      - ./apps/api:/app
      # Dependencies live in a volume, not on the host.
      - api-vendor:/app/vendor
    ports:
      - "127.0.0.1:${API_PORT:-8000}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      # The entrypoint runs `composer install` on first start.
      start_period: 120s

  store:
    build:
      context: ./apps/store
    # Dependencies are installed into the node_modules volume when package-lock.json is newer than the install.
    command: ["sh", "-c", "[ node_modules/.package-lock.json -nt package-lock.json ] || npm ci; exec npm run dev"]
    volumes:
      - ./apps/store:/app
      # Dependencies live in a volume, not on the host.
      - store-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:${STORE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      # `npm ci` runs on first start before the dev server is up.
      start_period: 180s

  admin:
    build:
      context: ./apps/admin
    # Dependencies are installed into the node_modules volume when package-lock.json is newer than the install.
    command: ["sh", "-c", "[ node_modules/.package-lock.json -nt package-lock.json ] || npm ci; exec npm run dev"]
    volumes:
      - ./apps/admin:/app
      # Dependencies live in a volume, not on the host.
      - admin-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      # `npm ci` runs on first start before the dev server is up.
      start_period: 180s

volumes:
  api-vendor:
  store-node-modules:
  admin-node-modules:
  postgres-data:
  redis-data:
  elasticsearch-data:
  rabbitmq-data:
  garage-meta:
  garage-data:
