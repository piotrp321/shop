# The settings of Postgres that do not depend on the memory of the container (docs/features/runtime-config/spec.md, "Postgres").
# Compose mounts this file and the chart links it (files/postgresql.conf, ConfigMap postgres-config); both start Postgres with
# -c config_file=/etc/postgresql/postgresql.conf. The values that depend on the memory of the container (shared_buffers and
# effective_cache_size) are not here: they are -c arguments of the command (compose) and of the values of the environment (chart).
# A name that Postgres does not know stops the start with `unrecognized configuration parameter` in the log.
#
# Not set on purpose, the defaults stay: jit, work_mem, random_page_cost, max_connections, log_min_duration_statement,
# log_parameter_max_length_on_error.

# What initdb of the image writes to the postgresql.conf of the data directory, which config_file replaces: without them
# Postgres would listen on localhost only, take the simple text search configuration instead of the English one and fall
# back to the C locale for the messages, numbers, money and dates. Compared with `SELECT name, setting FROM pg_settings` of a
# container with the default file: the other settings of that file (max_connections, min_wal_size, datestyle,
# dynamic_shared_memory_type, autovacuum_worker_slots) equal the defaults of Postgres, so they are not repeated here.
listen_addresses = '*'
default_text_search_config = 'pg_catalog.english'
timezone = 'Etc/UTC'
log_timezone = 'Etc/UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# The cost of the queries without logging their parameters: pg_stat_statements keeps normalized texts (constants as $n).
# Utility commands (ALTER ROLE ... PASSWORD) are left out, they could carry literals. Reading the view needs pg_read_all_stats.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track_utility = off
track_io_timing = on

# What the log of Postgres says: lock waits longer than deadlock_timeout (1 s) are logged, and an error carries only its main
# message: no DETAIL, HINT, QUERY or CONTEXT (the values of keys, the rows of COPY, the queries of a deadlock) and no text of the
# statement. The slow queries are in pg_stat_statements, so log_min_duration_statement stays off (it logs the parameters).
log_lock_waits = on
log_error_verbosity = terse
log_min_error_statement = panic

# Less WAL (full-page images) and fewer forced checkpoints under the writes of the demo data generator and of the reindex.
wal_compression = lz4
max_wal_size = 8GB
checkpoint_timeout = 15min

# Builds of indexes and VACUUM; autovacuum has its own (autovacuum_max_workers x autovacuum_work_mem, 3 workers by default).
maintenance_work_mem = 256MB
autovacuum_work_mem = 128MB
