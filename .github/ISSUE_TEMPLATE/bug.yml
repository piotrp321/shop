name: Błąd
description: Działanie niezgodne ze specyfikacją albo z oczekiwaniem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Wypełnij wymagane pola. Zgłoszenie z brakami dostaje etykietę `needs-info` i nie idzie do przygotowania.
  - type: textarea
    id: environment
    attributes:
      label: Środowisko
      description: "Gdzie wystąpił problem: stos lokalny albo inne środowisko, gałąź lub commit, przeglądarka, konto i jego rola."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Kroki odtworzenia
      description: "Jeden krok w linii."
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Wynik oczekiwany
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Wynik faktyczny
      description: "Komunikat, zrzut ekranu albo odpowiedź API."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Kryterium akceptacji
      description: "Po czym poznamy, że problem jest rozwiązany. Najlepiej jako test."
    validations:
      required: true
  - type: textarea
    id: unknowns
    attributes:
      label: Niewiadome
      description: "Czego nie wiesz albo co wymaga decyzji. Wpisz „Brak”, jeśli nic."
    validations:
      required: false
