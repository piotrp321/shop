# Deployment (docs/features/deploy/spec.md, "Wdrożenie nowej wersji" and D4). A version reaches the server only when the
# user asks for it: `gh workflow run deploy.yml --ref main`. Nothing deploys on a push.
#
#   workflow_dispatch   on main (refs/heads/main): images -> smoke -> deploy. Builds the four production images and pushes
#     on main           them to GitHub Container Registry tagged with the commit SHA and writes the images values file (the
#                       revision and the four digests, infra/k8s/scripts/images-values.sh) once. The smoke test installs
#                       the chart with that very file, so the cluster pulls the images from the registry by digest. Only
#                       after it passes, and after the render of prod with that file is checked, does one atomic push move
#                       the branch `deploy` to the commit by fast-forward and add a snapshot commit (the commit plus the
#                       file) to the branch `deploy-images`, which Argo CD tracks (.github/scripts/deploy-ref.sh, deploy
#                       key from the secret DEPLOY_KEY; without the secret it ends with a warning, not an error).
#   workflow_dispatch   on any other branch: smoke only, on that branch; the images are built from the GitHub Actions
#                       cache, nothing is pushed and `deploy` does not move. GitHub offers it only once this file is on the
#                       default branch (main), so before the merge of the epic the rehearsal on the epic branch is the pull
#                       request event (this file is in the paths below).
#   pull request        smoke only, when the change touches the files that decide the images and the chart (paths
#                       below); the images are built from the GitHub Actions cache and never pushed. Not a required check.
#
# env.DEPLOY ("true" for a dispatch on main) is the one switch of everything above; the jobs `images` and `deploy` repeat
# the same expression because the env context is not available in a job's `if`.
#
# Runs for main are never cancelled: one runs, at most one waits, and a waiting one is replaced by the newer request, which
# runs on the then latest commit, so the latest commit is deployed. A run for any other ref is superseded by the next one
# for the same ref (the next push to the same PR).
name: Deploy

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'apps/*/Dockerfile'
      - 'apps/api/config/**'
      - 'apps/api/bin/**'
      - 'apps/api/composer.lock'
      - 'apps/store/package-lock.json'
      - 'apps/admin/package-lock.json'
      - 'apps/store/next.config.ts'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/deploy-ref.sh'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every run: step gets `bash --noprofile --norc -eo pipefail {0}`. Without `shell:` GitHub uses `bash -e {0}`, where the
# status of `make smoke | tee log` is that of `tee`, so a red smoke test would give a green job and deploy would run.
defaults:
  run:
    shell: bash

env:
  # A deployment: a dispatch on main (the string "true" or "false"). Pushing images, the images values file and `deploy` hang
  # on it, nothing else; see the header.
  DEPLOY: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
  # The images of the chart (image.registry); k3s pulls them without credentials once the packages are public.
  IMAGE_PREFIX: ghcr.io/piotrp321/shop
  # The registry name the smoke test expects for the cluster of COMPOSE_PROJECT_NAME (infra/k8s/scripts/smoke.sh:
  # shop-smoke-sm-<project>); it fails with "image ... is missing" if the two ever differ.
  COMPOSE_PROJECT_NAME: deploy
  SMOKE_REGISTRY: shop-smoke-sm-deploy

jobs:
  # Builds and pushes the four production images with the tag <commit sha>. An image that is already in the registry
  # under that tag (a re-run of the same commit) is kept, not rebuilt, so one tag never gets two digests.
  images:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.digests.outputs.api }}
      store: ${{ steps.digests.outputs.store }}
      admin: ${{ steps.digests.outputs.admin }}
      elasticsearch: ${{ steps.digests.outputs.elasticsearch }}
      # The images values file, generated here once; the jobs that need it write these bytes and check the checksum.
      values: ${{ steps.values.outputs.values }}
      values_sha256: ${{ steps.values.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Find the images that are already there
        id: existing
        run: |
          for app in api store admin elasticsearch; do
            ref="$IMAGE_PREFIX/$app:$GITHUB_SHA"
            # stdout is the digest (it goes to the job output), stderr only tells why a lookup failed.
            if digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2> "$RUNNER_TEMP/inspect-error")"; then
              echo "$app=$digest" >> "$GITHUB_OUTPUT"
              echo "$ref exists ($digest), it is kept"
            elif grep -qiE 'not found|manifest unknown|name unknown|denied|unauthorized' "$RUNNER_TEMP/inspect-error"; then
              echo "$ref is not there yet"
            else
              echo "::error::could not look up $ref: $(cat "$RUNNER_TEMP/inspect-error")"
              exit 1
            fi
          done

      # provenance: false keeps one plain image manifest per tag, so the digest is that of the image that gets
      # pulled and deployed.
      - name: Build and push api
        id: build-api
        if: steps.existing.outputs.api == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          target: prod
          push: true
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
          cache-from: type=gha,scope=deploy-api
          cache-to: type=gha,mode=max,scope=deploy-api

      - name: Build and push store
        id: build-store
        if: steps.existing.outputs.store == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/store
          target: prod
          push: true
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/store:${{ github.sha }}
          cache-from: type=gha,scope=deploy-store
          cache-to: type=gha,mode=max,scope=deploy-store

      - name: Build and push admin
        id: build-admin
        if: steps.existing.outputs.admin == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/admin
          target: prod
          push: true
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/admin:${{ github.sha }}
          cache-from: type=gha,scope=deploy-admin
          cache-to: type=gha,mode=max,scope=deploy-admin

      - name: Build and push elasticsearch
        id: build-elasticsearch
        if: steps.existing.outputs.elasticsearch == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/elasticsearch
          push: true
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/elasticsearch:${{ github.sha }}
          cache-from: type=gha,scope=deploy-elasticsearch
          cache-to: type=gha,mode=max,scope=deploy-elasticsearch

      # The digests of the four images, for the job outputs and the summary. Argo CD deploys by digest.
      - name: Digests of the images
        id: digests
        env:
          EXISTING_API: ${{ steps.existing.outputs.api }}
          EXISTING_STORE: ${{ steps.existing.outputs.store }}
          EXISTING_ADMIN: ${{ steps.existing.outputs.admin }}
          EXISTING_ELASTICSEARCH: ${{ steps.existing.outputs.elasticsearch }}
          BUILT_API: ${{ steps.build-api.outputs.digest }}
          BUILT_STORE: ${{ steps.build-store.outputs.digest }}
          BUILT_ADMIN: ${{ steps.build-admin.outputs.digest }}
          BUILT_ELASTICSEARCH: ${{ steps.build-elasticsearch.outputs.digest }}
        run: |
          {
            echo "### Images of $GITHUB_SHA"
            echo
            echo '| image | digest |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for app in api store admin elasticsearch; do
            upper="$(printf '%s' "$app" | tr '[:lower:]' '[:upper:]')"
            existing="EXISTING_$upper"
            built="BUILT_$upper"
            digest="${!built:-${!existing:-}}"
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::no valid digest for $app (got '$digest')"
              exit 1
            fi
            echo "$app=$digest" >> "$GITHUB_OUTPUT"
            echo "| \`$IMAGE_PREFIX/$app:$GITHUB_SHA\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      # The file that Argo CD, the smoke test and the check of the render all use (scripts/images-values.sh refuses a
      # malformed digest). Its content goes to the job output between a delimiter that the content cannot contain.
      - name: Images values file
        id: values
        env:
          DIGEST_API: ${{ steps.digests.outputs.api }}
          DIGEST_STORE: ${{ steps.digests.outputs.store }}
          DIGEST_ADMIN: ${{ steps.digests.outputs.admin }}
          DIGEST_ELASTICSEARCH: ${{ steps.digests.outputs.elasticsearch }}
        run: |
          sh infra/k8s/scripts/images-values.sh "$GITHUB_SHA" "$RUNNER_TEMP/values-images.yaml"
          sum="$(sha256sum "$RUNNER_TEMP/values-images.yaml" | cut -d' ' -f1)"
          {
            echo 'values<<IMAGES_VALUES_EOF'
            cat "$RUNNER_TEMP/values-images.yaml"
            echo 'IMAGES_VALUES_EOF'
            echo "sha256=$sum"
          } >> "$GITHUB_OUTPUT"
          echo "values-images.yaml sha256: $sum"
          {
            echo
            echo "values-images.yaml (sha256 \`$sum\`):"
            echo '```yaml'
            cat "$RUNNER_TEMP/values-images.yaml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The smoke test (make -C infra/k8s smoke) on an empty k3d cluster. On a deployment the first install uses the images values
  # file of the job above, so the cluster pulls the pushed images from the registry by digest (the later phases of the
  # test run on the same images, loaded from the local daemon); otherwise it runs on images built here from the cache of
  # GitHub Actions.
  smoke:
    needs: images
    # `images` is skipped unless this is a dispatch on main; a failed or cancelled one stops the smoke test.
    if: ${{ !cancelled() && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A docker-container builder (the cache of GitHub Actions needs it) that is not made the current one: smoke.sh
      # builds its broken images with a plain `docker build` FROM the images loaded below, which only the local daemon
      # (the default builder) sees. The builds below name this builder and load their result into the daemon.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        if: env.DEPLOY != 'true'
        with:
          use: false

      - name: Write the images values file
        if: env.DEPLOY == 'true'
        env:
          IMAGES_VALUES: ${{ needs.images.outputs.values }}
          IMAGES_VALUES_SHA256: ${{ needs.images.outputs.values_sha256 }}
        run: |
          printf '%s\n' "$IMAGES_VALUES" > "$RUNNER_TEMP/values-images.yaml"
          echo "$IMAGES_VALUES_SHA256  $RUNNER_TEMP/values-images.yaml" | sha256sum -c -

      # The later phases of the smoke test (new revisions, a broken migration) build on the images in the local daemon.
      - name: Pull the pushed images by digest
        if: env.DEPLOY == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_API: ${{ needs.images.outputs.api }}
          DIGEST_STORE: ${{ needs.images.outputs.store }}
          DIGEST_ADMIN: ${{ needs.images.outputs.admin }}
          DIGEST_ELASTICSEARCH: ${{ needs.images.outputs.elasticsearch }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for app in api store admin elasticsearch; do
            upper="$(printf '%s' "$app" | tr '[:lower:]' '[:upper:]')"
            digest="DIGEST_$upper"
            docker pull --quiet "$IMAGE_PREFIX/$app@${!digest}"
            docker tag "$IMAGE_PREFIX/$app@${!digest}" "$SMOKE_REGISTRY/$app:r1"
          done

      - name: Build api image
        if: env.DEPLOY != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          target: prod
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          tags: ${{ env.SMOKE_REGISTRY }}/api:r1
          cache-from: type=gha,scope=deploy-api
          cache-to: type=gha,mode=max,scope=deploy-api

      - name: Build store image
        if: env.DEPLOY != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/store
          target: prod
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          tags: ${{ env.SMOKE_REGISTRY }}/store:r1
          cache-from: type=gha,scope=deploy-store
          cache-to: type=gha,mode=max,scope=deploy-store

      - name: Build admin image
        if: env.DEPLOY != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/admin
          target: prod
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          tags: ${{ env.SMOKE_REGISTRY }}/admin:r1
          cache-from: type=gha,scope=deploy-admin
          cache-to: type=gha,mode=max,scope=deploy-admin

      - name: Build elasticsearch image
        if: env.DEPLOY != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/elasticsearch
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          tags: ${{ env.SMOKE_REGISTRY }}/elasticsearch:r1
          cache-from: type=gha,scope=deploy-elasticsearch
          cache-to: type=gha,mode=max,scope=deploy-elasticsearch

      # The runner is sampled every 10 s while the test runs, so the summary shows the peak memory and disk used
      # (smoke.sh adds the peaks of the cluster itself to its log).
      # On a deployment SMOKE_VALUES is the images values file: the first install pulls the images from the registry by digest, with
      # the token of the run (packages: read) given to k3d in a private registries file that is never printed.
      - name: Smoke test
        env:
          SMOKE_GHCR_USER: ${{ env.DEPLOY == 'true' && github.actor || '' }}
          SMOKE_GHCR_TOKEN: ${{ env.DEPLOY == 'true' && secrets.GITHUB_TOKEN || '' }}
        run: |
          if [ "$DEPLOY" = true ]; then
            export SMOKE_VALUES="$RUNNER_TEMP/values-images.yaml"
          fi
          df -m --output=used,size / | tail -n 1 > "$RUNNER_TEMP/disk-start"
          (
            while :; do
              echo "$(free -m | awk '/^Mem:/ {print $3, $2}') $(df -m --output=used,size / | tail -n 1)" >> "$RUNNER_TEMP/samples"
              sleep 10
            done
          ) &
          sampler=$!
          status=0
          SMOKE_BUILD=0 make -C infra/k8s smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log" || status=$?
          kill "$sampler" 2> /dev/null || true
          exit "$status"

      - name: Resources in the summary
        if: always()
        run: |
          {
            echo "### Smoke test ($GITHUB_EVENT_NAME, $GITHUB_SHA)"
            echo
            echo "Status of the job so far: ${{ job.status }}"
            echo
            if [ -s "$RUNNER_TEMP/samples" ]; then
              awk 'BEGIN { m = 0; d = 0 } { if ($1 > m) m = $1; if ($3 > d) d = $3; mt = $2; dt = $4 }
                END { printf "- runner peak memory: %d MiB of %d MiB\n- runner peak disk used: %d MiB of %d MiB\n", m, mt, d, dt }' \
                "$RUNNER_TEMP/samples"
              read -r start_used _ < "$RUNNER_TEMP/disk-start" || true
              echo "- runner disk used before the test: ${start_used:-?} MiB"
            else
              echo "- no resource samples (the test did not start)"
            fi
            if [ -f "$RUNNER_TEMP/smoke.log" ]; then
              echo
              echo '```'
              grep -E '^smoke: (peak|image|docker disk usage|   )|^smoke: (ok|FAILED)' "$RUNNER_TEMP/smoke.log" || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the version after a green smoke test (D4): checks the render of prod with the images values file, then one
  # atomic push moves `deploy` to the commit by fast-forward and adds the snapshot to `deploy-images`. Without the secret
  # DEPLOY_KEY the job ends with a warning. A failed check or push publishes nothing.
  deploy:
    needs: [images, smoke]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The full history, so the push can tell a fast-forward from a commit that is behind or has diverged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write the images values file
        env:
          IMAGES_VALUES: ${{ needs.images.outputs.values }}
          IMAGES_VALUES_SHA256: ${{ needs.images.outputs.values_sha256 }}
        run: |
          printf '%s\n' "$IMAGES_VALUES" > "$RUNNER_TEMP/values-images.yaml"
          echo "$IMAGES_VALUES_SHA256  $RUNNER_TEMP/values-images.yaml" | sha256sum -c -

      - name: Check the render of prod with the images values file
        run: sh infra/k8s/scripts/verify-images.sh "$RUNNER_TEMP/values-images.yaml" "$GITHUB_SHA"

      - name: Publish deploy and deploy-images
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -n "$DEPLOY_KEY" ]; then
            # The host keys of GitHub, from its API over TLS (the key never leaves this step).
            curl -fsS https://api.github.com/meta \
              | python3 -c 'import json, sys; [print("github.com " + key) for key in json.load(sys.stdin)["ssh_keys"]]' \
              > "$RUNNER_TEMP/known_hosts"
            export DEPLOY_KNOWN_HOSTS="$RUNNER_TEMP/known_hosts"
          fi
          export DEPLOY_SNAPSHOT_FILE="$RUNNER_TEMP/snapshot"
          sh .github/scripts/deploy-ref.sh "$GITHUB_SHA" "git@github.com:$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/values-images.yaml"
          echo "### deploy" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOY_KEY" ]; then
            echo "The branch deploy is at \`$GITHUB_SHA\`, the branch deploy-images at \`$(cat "$DEPLOY_SNAPSHOT_FILE")\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The secret DEPLOY_KEY is not set: the branches deploy and deploy-images did not move." >> "$GITHUB_STEP_SUMMARY"
          fi
