# Light CI: static analysis and tests of the three apps.
# Runs without the full stack: app containers start with --no-deps; only the services the tests need are started.
# The `e2e` job is the exception: it starts the full stack and runs the Playwright tests.
# Both jobs run for every change, so they can be required status checks. For a pull request that changes
# documentation only (docs/** and *.md outside .github/, see .github/scripts/docs-only.sh) the `scope` job
# says so, and both jobs skip their steps and pass within seconds.
name: CI

on:
  pull_request:
  # Pushes to main and to epic branches (epic/*, to which AO squash-merges task PRs): the required checks
  # report on the head of the branch.
  push:
    branches: [main, 'epic/**']

# A pull request run is superseded by the next push to the same PR. A push run is keyed by its commit and never
# cancelled, so every merge into an epic branch gets its own result and the head never stays without one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Compose names the images <project>-<service>; the build steps below tag them to match.
  COMPOSE_PROJECT_NAME: shop
  CI_RUN: docker compose run --rm --no-deps -T

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scope script tests
        run: sh .github/scripts/test_docs_only.sh

      # Pushes (main, epic/**) always run the full CI.
      - name: Detect a documentation-only change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            docs_only="$(sh .github/scripts/docs-only.sh "$BASE_SHA" "$HEAD_SHA")"
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  checks:
    needs: scope
    # Runs even when `scope` failed, so the required check reports a failure instead of being skipped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FULL_CI: ${{ needs.scope.outputs.docs_only != 'true' }}
    steps:
      - name: Require the scope job
        if: needs.scope.result != 'success'
        run: echo "::error::The scope job did not succeed" && exit 1

      - name: Documentation-only change, skipping the checks
        if: env.FULL_CI != 'true'
        run: echo "Only docs/** and *.md changed"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.FULL_CI == 'true'

      # Standard-library scripts of the Claude Code skills (/delivery state, /planner manifest, /ao-run events) and the AO hooks.
      - name: Skill script tests
        if: env.FULL_CI == 'true'
        run: |
          python3 -m unittest discover -s .ao -p 'test_*.py'
          python3 -m unittest discover -s .claude/skills/delivery -p 'test_*.py'
          python3 -m unittest discover -s .claude/skills/planner -p 'test_*.py'
          python3 -m unittest discover -s .claude/skills/integration -p 'test_*.py'
          python3 -m unittest discover -s .claude/skills/ao-run -p 'test_*.py'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.FULL_CI == 'true'

      - name: Generate .env.local
        if: env.FULL_CI == 'true'
        run: sh infra/scripts/init-env.sh

      - name: Build api image
        if: env.FULL_CI == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          target: dev
          tags: shop-api
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build store image
        if: env.FULL_CI == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/store
          tags: shop-store
          load: true
          cache-from: type=gha,scope=store
          cache-to: type=gha,mode=max,scope=store

      - name: Build admin image
        if: env.FULL_CI == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/admin
          tags: shop-admin
          load: true
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      # Dependencies go into the named volumes, as in local development.
      - name: Install dependencies
        if: env.FULL_CI == 'true'
        run: |
          $CI_RUN api true
          $CI_RUN store npm ci --no-audit --no-fund
          $CI_RUN admin npm ci --no-audit --no-fund

      - name: make check
        if: env.FULL_CI == 'true'
        run: make check RUN="$CI_RUN"

      # The api integration tests need PostgreSQL (database shop_test, created by its init script),
      # the image services: Garage (buckets created by garage-init) and imgproxy, RabbitMQ with the
      # `test` vhost (created by the one-shot rabbitmq-init), Elasticsearch (the test index is created by
      # init-test, which `make -C apps/api test` runs first) and Keycloak with the imported realms (discovery tests).
      # The dashboard probes (ProbesTest and the dashboard endpoint test) reach all of them, plus Redis and Mailpit;
      # the store integration tests (sessions, refresh lock) need Redis too. Mailpit also receives the order
      # confirmation emails of the api mailer tests (MAILER_DSN and MAILER_FROM come from the api service of
      # docker-compose.yml, which `docker compose run` applies).
      - name: Start PostgreSQL, Redis, Garage, imgproxy, RabbitMQ, Elasticsearch, Keycloak and Mailpit
        if: env.FULL_CI == 'true'
        run: |
          docker compose up -d --wait postgres redis garage imgproxy rabbitmq elasticsearch keycloak mailpit
          docker compose run --rm rabbitmq-init

      # All suites of every app; api `test` migrates shop_test first.
      - name: Tests
        if: env.FULL_CI == 'true'
        run: |
          make -C apps/api test RUN="$CI_RUN" PHPUNIT_ARGS="--log-junit var/junit.xml"
          make -C apps/store test RUN="$CI_RUN"
          make -C apps/admin test RUN="$CI_RUN"

      # TEMPORARY measurement: the slowest api tests, classes and directories from the JUnit report.
      - name: Slowest api tests
        if: ${{ always() && env.FULL_CI == 'true' }}
        run: |
          python3 - apps/api/var/junit.xml <<'EOF'
          import collections, sys, xml.etree.ElementTree as ET
          cases = [c for c in ET.parse(sys.argv[1]).iter('testcase')]
          total = sum(float(c.get('time', 0)) for c in cases)
          print(f'{len(cases)} test cases, {total:.1f} s in total')
          by_class, by_dir = collections.Counter(), collections.Counter()
          count_class, count_dir = collections.Counter(), collections.Counter()
          for c in cases:
              t = float(c.get('time', 0))
              cls = c.get('class') or c.get('classname') or '?'
              path = (c.get('file') or '').replace('/app/tests/', '').split('/')
              d = '/'.join(path[:2]) if len(path) > 2 else '?'
              by_class[cls] += t; count_class[cls] += 1
              by_dir[d] += t; count_dir[d] += 1
          print('\n== Directories')
          for d, t in by_dir.most_common():
              print(f'{t:8.1f} s {100 * t / total:5.1f}% {count_dir[d]:5d}  {d}')
          print('\n== Top 40 classes')
          for cls, t in by_class.most_common(40):
              print(f'{t:8.1f} s {100 * t / total:5.1f}% {count_class[cls]:5d}  {cls}')
          print('\n== Top 40 test cases')
          for c in sorted(cases, key=lambda c: -float(c.get('time', 0)))[:40]:
              print(f"{float(c.get('time', 0)):8.2f} s  {c.get('class')}::{c.get('name')}")
          EOF

      - name: Upload the api JUnit report
        if: ${{ always() && env.FULL_CI == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-junit
          path: apps/api/var/junit.xml
          if-no-files-found: warn

      # The committed OpenAPI files and generated clients must equal a fresh export and generation
      # (no services needed, so --no-deps works).
      - name: Contract freshness
        if: env.FULL_CI == 'true'
        run: |
          make -C apps/api openapi RUN="$CI_RUN"
          make api-client RUN="$CI_RUN"
          git diff --exit-code -- apps/api/openapi.json apps/api/openapi-admin.json apps/store/src/api/schema.d.ts apps/admin/src/api/schema.d.ts

  # End-to-end tests on the full stack: Playwright drives the store and the panel in a browser.
  e2e:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FULL_CI: ${{ needs.scope.outputs.docs_only != 'true' }}
    steps:
      - name: Require the scope job
        if: needs.scope.result != 'success'
        run: echo "::error::The scope job did not succeed" && exit 1

      - name: Documentation-only change, skipping the end-to-end tests
        if: env.FULL_CI != 'true'
        run: echo "Only docs/** and *.md changed"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.FULL_CI == 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.FULL_CI == 'true'

      # Builds the e2e image and type-checks the tests; no services needed, so it fails fast.
      - name: Type-check the e2e tests
        if: env.FULL_CI == 'true'
        run: make e2e-check E2E_FLAGS=-T

      # Builds the images, starts every service, runs the migrations and starts the worker (`exec` needs -T).
      - name: Start the stack
        if: env.FULL_CI == 'true'
        run: make up RUN="docker compose exec -T"

      - name: Seed demo data
        if: env.FULL_CI == 'true'
        run: make seed RUN="docker compose exec -T"

      - name: make e2e
        if: env.FULL_CI == 'true'
        run: make e2e E2E_FLAGS=-T

      - name: Service logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: e2e/test-results
          if-no-files-found: ignore
