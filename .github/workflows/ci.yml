# Light CI: static analysis and tests of the three apps.
# Runs without the full stack: app containers start with --no-deps; only the services the tests need are started.
# Runs for every change, documentation included, so the `checks` job can be a required status check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Compose names the images <project>-<service>; the build steps below tag them to match.
  COMPOSE_PROJECT_NAME: shop
  CI_RUN: docker compose run --rm --no-deps -T

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate .env.local
        run: sh infra/scripts/init-env.sh

      - name: Build api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          target: dev
          tags: shop-api
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build store image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/store
          tags: shop-store
          load: true
          cache-from: type=gha,scope=store
          cache-to: type=gha,mode=max,scope=store

      - name: Build admin image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/admin
          tags: shop-admin
          load: true
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      # Dependencies go into the named volumes, as in local development.
      - name: Install dependencies
        run: |
          $CI_RUN api true
          $CI_RUN store npm ci --no-audit --no-fund
          $CI_RUN admin npm ci --no-audit --no-fund

      - name: make check
        run: make check RUN="$CI_RUN"

      # The api integration tests need PostgreSQL (database shop_test, created by its init script),
      # the image services: Garage (buckets created by garage-init) and imgproxy, RabbitMQ with the
      # `test` vhost (created by the one-shot rabbitmq-init) and Elasticsearch (the test index is created by
      # init-test, which `make -C apps/api test` runs first).
      - name: Start PostgreSQL, Garage, imgproxy, RabbitMQ and Elasticsearch
        run: |
          docker compose up -d --wait postgres garage imgproxy rabbitmq elasticsearch
          docker compose run --rm rabbitmq-init

      # All api suites; `test` migrates shop_test first. Store keeps to unit tests,
      # its integration tests need Redis.
      - name: Tests
        run: |
          make -C apps/api test RUN="$CI_RUN"
          make -C apps/store test-unit RUN="$CI_RUN"
          make -C apps/admin test RUN="$CI_RUN"

      # The committed OpenAPI files must equal a fresh export (no services needed, so --no-deps works).
      - name: Contract freshness
        run: |
          make -C apps/api openapi RUN="$CI_RUN"
          git diff --exit-code -- apps/api/openapi.json apps/api/openapi-admin.json
